<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07080a">
<title>〇五〇〇</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07080a; --panel:#0f1114; --panel2:#14171b; --line:#252a30; --line2:#323841;
  --ink:#ddd7c9; --dim:#8d8a80; --faint:#56544e; --amber:#ffcf6b; --danger:#d9534f;
  --s1:#d0a04a; --s2:#86b85a; --s3:#5fb0d8; --s4:#a98ad8; --s5:#e6e1d3;
  --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --gothic:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"Consolas","Menlo",monospace;
  /* 端の余白：左右は 16px か切り欠きの分の大きいほう */
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --st:env(safe-area-inset-top, 0px); --sb:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--gothic);
  overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:1px solid var(--amber);outline-offset:1px}
[hidden]{display:none!important}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.panel,.loglist,#title{scrollbar-width:thin;scrollbar-color:#3a3f47 transparent}

/* ---------------------------------------------------------------- play screen */
/* 縦長：上から 上の段 / 時刻の帯 / 地図 / 無線 / 札 / 操作。横長（wide）：左に地図、右の列にほかを積む */
#app{position:fixed;inset:0;overflow:hidden}
#game{height:100%;display:grid;gap:4px;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
  grid-template-areas:"hud" "tl" "map" "radio" "cards" "ctl";
  padding:calc(6px + var(--st)) var(--gr) calc(5px + var(--sb)) var(--gl)}
body.wide #game{grid-template-columns:minmax(0,1fr) clamp(340px,34vw,500px);
  grid-template-rows:auto auto auto auto auto minmax(0,1fr);
  grid-template-areas:"map hud" "map tl" "map cards" "map radio" "map ctl" "map log";gap:6px 12px;
  padding:calc(10px + var(--st)) var(--gr) calc(10px + var(--sb)) var(--gl)}
/* 横に寝かせた電話など低い横長：地図の幅は ui.js が高さから決める（--mapw）。日誌は札の列に入れず、ボタンで開く */
body.wide.short #game{grid-template-columns:var(--mapw,300px) minmax(0,560px);justify-content:center;
  grid-template-rows:auto auto auto minmax(0,1fr) auto;
  grid-template-areas:"map hud" "map tl" "map cards" "map radio" "map ctl";gap:4px 12px;
  padding-top:calc(6px + var(--st));padding-bottom:calc(6px + var(--sb))}
#logbox{grid-area:log;display:none;min-height:0}
body.wide #logbox{display:flex}
body.wide #btnLog{display:none}
body.wide.short #logbox{display:none}
body.wide.short #btnLog{display:flex}

/* hud */
#hud{grid-area:hud;position:relative;z-index:2;display:flex;align-items:center;gap:10px;height:28px;font-size:12px;white-space:nowrap;min-width:0}
#hud .nl{font-family:var(--mincho);font-size:14px;letter-spacing:.06em}
#hud .clk{font-family:var(--mono);font-size:15px;color:#f0e6cf;letter-spacing:.04em}
#hud .grp{display:flex;align-items:center;gap:4px;color:var(--dim);min-width:0}
#hud .door{display:flex;gap:1px}
#hud .door i{display:block;width:5px;height:10px;background:#a9a08a}
#hud .door i.off{background:#2a2c30}
#hud .door.low i{background:var(--danger)}
#hud .door.low i.off{background:#2a2c30}
#hud .door.hit{animation:dhit .18s}
#hud .doorx{color:#a9a08a;font-family:var(--mono);font-size:13px;min-width:24px;text-align:center}
@keyframes dhit{50%{filter:brightness(2.2)}}
#hud .dots{letter-spacing:1px;color:#ffe6a8;font-size:11px}
#hud .dots .off{color:#33363b}
#hud .sp{display:none}
/* 設定：見えている枠は 22px、押せる所は上下に広げて 40px */
#hud .hbtn{position:relative;margin-left:auto;align-self:stretch;display:flex;align-items:center;padding:0 9px;font-size:12px;color:var(--dim)}
#hud .hbtn::before{content:"";position:absolute;left:0;right:0;top:3px;bottom:3px;border:1px solid var(--line);pointer-events:none}
#hud .hbtn::after{content:"";position:absolute;left:-6px;right:-8px;top:-6px;bottom:-6px}

/* timeline：帯（幅いっぱい）と、その下の「次 …」の一行 */
#tl{grid-area:tl;display:flex;flex-direction:column;gap:1px;min-width:0}
#tltrack{position:relative;height:30px;min-width:0;background:linear-gradient(to right,#0d1018 0%,#0c0f16 78%,#1a2030 90%,#3a3a3e 100%);
  border:1px solid var(--line);overflow:visible}
#tltrack .past{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.035);pointer-events:none}
#tltrack .hr{position:absolute;bottom:1px;transform:translateX(-50%);font:10px/1 var(--mono);color:#5d616a;pointer-events:none}
#tltrack .hr::before{content:"";position:absolute;left:50%;bottom:11px;width:1px;height:4px;background:#30343b}
#tltrack .wv{position:absolute;bottom:12px;width:1px;height:7px;background:#6e6a60;pointer-events:none;transform:translateX(-.5px)}
#tltrack .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--amber);box-shadow:0 0 6px rgba(255,207,107,.6);pointer-events:none;transform:translateX(-1px)}
/* 印の押せる所は ui.js が並べる（隣と重ならないよう間で分ける）。高さは帯の下へ 10px のばして 40px */
#tltrack .mk{position:absolute;top:0;height:40px;width:40px;padding:0;--x:20px}
#tltrack .mk .gl{position:absolute;top:0;left:var(--x);width:0;display:flex;justify-content:center;padding-top:3px;pointer-events:none}
#tltrack .mk b{display:block;flex:0 0 auto;width:10px;height:10px;transform:rotate(45deg);background:var(--rc);box-shadow:0 0 4px rgba(0,0,0,.8)}
#tltrack .mk.lost b{transform:none;background:none;width:auto;height:auto;margin-top:-1px;color:var(--rc);font:bold 13px/1 var(--gothic);text-shadow:0 0 3px #000}
#tltrack .mk.lost b::before{content:"\2715"}
#tltrack .mk.saved b{transform:none;background:none;width:11px;height:11px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(255,255,255,.5)}
#tltrack .mk::after{content:"";position:absolute;left:var(--x);top:15px;width:1px;height:6px;background:var(--rc);opacity:.7;pointer-events:none}
#tltrack .mk.warn b{animation:blink .45s steps(2) infinite}
#tltrack .mk.pop b{animation:pop .9s ease-out}
#tltrack .mk.new{animation:fadein .4s ease-out}
/* まとめ印：重なる印を一つに。中の数を小さな点で（2〜4 個） */
#tltrack .mk.grp .dots{position:absolute;top:23px;left:var(--x);transform:translateX(-50%);display:flex;gap:2px;pointer-events:none}
#tltrack .mk.grp .dots i{display:block;width:3px;height:3px;background:var(--rc);box-shadow:0 0 2px #000}
#tltrack .mk.grp::after{height:5px}
#tltrack .dxs{position:absolute;inset:0;pointer-events:none}
#tltrack .dx{position:absolute;top:3px;transform:translateX(-50%);font:bold 11px/1 var(--gothic);color:var(--rc);text-shadow:0 0 3px #000;font-style:normal}
#tltrack .dx::before{content:"\2715"}
@keyframes blink{50%{opacity:.15}}
@keyframes pop{0%{transform:scale(2.4);filter:brightness(3)}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#tlnext{height:13px;font:11px/13px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tlnext b{font-weight:normal;color:var(--ink)}

/* map */
#mapbox{grid-area:map;position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#mapframe{position:relative;touch-action:none;box-shadow:0 0 0 1px #1b1e23,0 0 40px rgba(0,0,0,.8)}
#mapframe canvas{position:absolute;left:0;top:0;display:block}
#px{image-rendering:pixelated;image-rendering:crisp-edges}
#ov{pointer-events:none;z-index:2}
/* 地図の走査線（4.9）：地図の一画素の行の高さで縞（--sl は ui.js が決める。細かすぎれば 2 行を 1 段に）。字と印の重ねの下 */
#mapframe::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--sl,3px) - 1px),rgba(0,0,0,.16) calc(var(--sl,3px) - 1px),rgba(0,0,0,.16) var(--sl,3px))}
body.noscan #mapframe::after,body.noscan #radio::after{display:none}
#mapframe.shake{animation:shake .22s}
#mapframe.shake2{animation:shake2 .5s}
@keyframes shake{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,1px)}}
@keyframes shake2{10%{transform:translate(4px,-2px)}30%{transform:translate(-4px,2px)}50%{transform:translate(3px,1px)}70%{transform:translate(-2px,-1px)}}
.mlayer{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:3}
/* 止まっている間の札は地図の上の隅（北の坂の脇の何もない所）。左上に「停止中」、右上に「この夜を閉じて」 */
#pausetag{background:rgba(0,0,0,.22);align-items:flex-start;justify-content:space-between;padding:6px}
#pausetag .tap{pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:40px;min-height:40px;padding:6px 10px;
  font:13px/1 var(--mincho);letter-spacing:.2em;color:#f1e9d6;border:1px solid rgba(241,233,214,.45);background:rgba(6,7,9,.7);animation:breathe 2.4s ease-in-out infinite}
#pausetag .tap span{padding-left:.2em}
#pausetag .tap small{font:11px/1 var(--gothic);letter-spacing:.06em;color:#c9c1ad}
#pausetag .close{pointer-events:auto;margin-left:auto;min-height:40px;max-width:calc(7.2em + 16px);padding:5px 7px;font:11px/1.3 var(--gothic);text-align:left;word-break:keep-all;overflow-wrap:anywhere;
  color:#e8b8b6;border:1px solid rgba(217,83,79,.6);background:rgba(20,8,8,.84)}
#pausetag .close.arm{color:#fff;background:rgba(120,22,18,.92);border-color:#e0605a}
@keyframes breathe{50%{opacity:.6}}
#flaretag{align-items:flex-start;padding-top:8px}
#flaretag span{font-size:12px;color:#ffe6a8;background:rgba(10,8,4,.8);border:1px solid rgba(255,230,168,.5);padding:5px 10px}
#mapsheet{pointer-events:auto;background:rgba(4,5,7,.8);flex-direction:column;justify-content:flex-start;padding:12px 12px 10px;overflow:hidden}
#mapsheet h3{margin:0 0 8px;font:15px/1.4 var(--mincho);letter-spacing:.12em;color:#f0e6cf;width:100%}
#mapsheet .ln{width:100%;font-size:12.5px;line-height:1.55;color:#cfc8b8;animation:fadein .25s ease-out;padding-left:4.6em;text-indent:-4.6em}
#mapsheet .ln time{display:inline-block;width:3.6em;text-indent:0;font:11px var(--mono);color:var(--dim)}
#mapsheet .ln .k{display:inline-block;width:7px;height:7px;transform:rotate(45deg);margin:0 6px 1px 0;text-indent:0}
#mapsheet .ln.fail{color:#e2aaa7}
#mapsheet .tut{width:100%;font-size:13px;line-height:1.6;margin:0 0 5px;padding-left:1em;text-indent:-1em}
#mapsheet .tut::before{content:"\30FB"}
#mapsheet .go{flex:0 0 auto;margin-top:auto;align-self:center;min-height:40px;border:1px solid var(--line2);padding:0 26px;font-size:14px;background:var(--panel2)}
#mapsheet .lines{width:100%;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px);mask-image:linear-gradient(to bottom,transparent 0,#000 22px)}
#mapsheet .lines .ln{flex:0 0 auto}

/* radio：本文は二行。高さが余れば上に前の行を薄く出す（ui.js が入らない行を隠す） */
#radio{grid-area:radio;position:relative;display:flex;gap:9px;height:74px;padding:7px 9px;background:#0b0e0c;border:1px solid #1f2622;overflow:hidden}
#radio::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(140,255,170,.03) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 30% 50%,rgba(120,200,140,.05),transparent 70%)}
#rface{flex:0 0 auto;align-self:center;width:58px;height:58px;image-rendering:pixelated;border:1px solid #26302a;border-radius:3px;background:#090d0b}
#rbody{flex:1;min-width:0;display:flex;flex-direction:column}
#rhead{display:flex;align-items:baseline;gap:8px;height:15px;font:11px/15px var(--mono);color:#7fa58a;white-space:nowrap}
#rname{font-family:var(--gothic);font-size:12px;font-weight:bold}
#rrole{color:#6f7f6c;font-family:var(--gothic);font-size:11px}
#rtime{margin-left:auto;color:#55695a}
#rtext{flex:1;min-height:0;font-size:13.5px;line-height:1.38;color:#e5e9dc;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;word-break:break-all}
#rtext .h{flex:0 0 auto;font-size:max(11px,.86em);line-height:1.3;color:#68715f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rtext .h b{font-weight:normal;margin-right:.5em;opacity:.75}
#rtext .c{flex:0 0 auto;text-shadow:0 0 5px rgba(120,255,160,.28)}
#rtext .c.old{color:#7a8277;text-shadow:none}
#rtext .hot{color:#fff;text-shadow:0 0 6px rgba(210,255,225,.75)}
#rtext .c.radio{color:#bfe3c6}
#rtext .c.static{color:#a8b0b4;letter-spacing:.1em}
#rtext .cur{display:inline-block;width:.5em;height:1em;vertical-align:-2px;background:#bfe3c6;opacity:.7;animation:blink .5s steps(2) infinite}
body.wide #radio{height:96px}
body.wide #rface{width:76px;height:76px}
body.wide #rtext{font-size:14.5px}
body.wide.short #radio{height:auto;min-height:74px}
body.wide.short #rface{width:58px;height:58px}
body.wide.short #rtext{font-size:13.5px}

/* cards：状態の行は一行。入らなければ ui.js が st2 を付け、役の行を隠して二行で見せる */
#cards{grid-area:cards;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.card{position:relative;height:56px;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--rc);
  padding:3px 4px 0;display:flex;flex-direction:column;overflow:hidden;transition:background .15s,border-color .15s}
.card .r1{display:flex;align-items:baseline;white-space:nowrap;line-height:16px;height:16px}
.card .num{margin-right:3px;font:bold 13px/1 var(--mono);color:var(--rc)}
.card .nm{min-width:0;font-size:13px;font-weight:bold;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.card .role{font-size:11px;line-height:13px;height:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.card .st{font-size:11px;line-height:14px;height:14px;color:#bdb6a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card.st2 .role{display:none}
.card.st2 .st{height:28px;white-space:normal;text-overflow:clip;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
.card .st.q{color:var(--amber)}
.card .hp{position:absolute;left:0;right:0;bottom:0;height:4px;background:#1d1f23}
.card .hp i{display:block;height:100%;background:var(--rc);transition:width .2s}
.card .hp.low i{background:var(--danger)}
/* 失った回数は名前の行の右端（ui.js が ✕ 二つまで、それより多ければ「✕3」）。名前に重ねない */
.card .loss{flex:0 0 auto;margin:0 -1px 0 auto;padding-left:2px;font:11px/1 var(--gothic);color:#c0605b;letter-spacing:-2px}
.card .loss small{font:10px/1 var(--gothic);letter-spacing:-.5px}
.card .msg{position:absolute;inset:auto 0 4px 0;text-align:center;font-size:11px;color:#fff;background:rgba(160,40,36,.92);padding:2px 0;opacity:0;transition:opacity .2s}
.card .msg.on{opacity:1}
.card.sel{background:#1b1d22;border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc)}
.card.dead{background:#0b0c0e;border-top-color:#3a3a3a;opacity:.62}
.card.dead .num{color:#555}
.card.dead .st{color:#c46a66}
.card.warn{animation:warnc 0.9s ease-in-out infinite}
.card.shake{animation:cshake .32s}
/* 札の被弾：上の縁を 120 ms 赤く（4.10） */
.card.hit{animation:chit .12s steps(1)}
@keyframes chit{0%{border-top-color:var(--danger)}100%{border-top-color:var(--danger)}}
/* 押した感じ：1 px 下げて明るく */
.card:active,.btn:active,#sheet .acts button:active,.pbtn:active,#sheet .tog:active,#sheet .mrow:active{transform:translateY(1px);filter:brightness(1.3)}
@keyframes warnc{50%{box-shadow:0 0 0 2px var(--rc),0 0 14px var(--rc)}}
@keyframes cshake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
body.wide .card{height:64px;padding:4px 6px 0}
body.wide .card .nm{font-size:14px}
body.wide .card .st{margin-top:4px}
body.wide.short .card{height:56px;padding:3px 4px 0}
body.wide.short .card .st{margin-top:2px}

/* controls：操作の帯はいつも二段（段は 44px、低い画面は 40px。段の間 8px）。帯の高さは選択や構えで変わらない。
   上の段：指令の段（✦・光を絞る）／照明弾の種類の段（構えている間）／行き先の段（兵を選んでいる間）
   下の段：進みの段（❚❚ x1 ▶▶ ↻ ☰）／兵の命令の段（兵を選んでいる間）
   横長（wide）は右の列に四段：進みの段、指令の段、行き先の段、兵の命令の段。低い横長は進みの段と指令の段を一段に */
#ctlbar{grid-area:ctl;position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:44px 44px;row-gap:8px;
  grid-template-areas:"top" "bot"}
.band{display:flex;gap:4px;min-width:0;min-height:0}
#cmdbar,#flarebar,#posbar{grid-area:top}
#ctl,#ordbar{grid-area:bot}
#flarebar,#posbar,#ordbar{display:none}
body.flare:not(.sel) #cmdbar{display:none}
body.flare:not(.sel) #flarebar{display:flex}
body.sel #cmdbar,body.sel #flarebar,body.sel #ctl{display:none}
body.sel #posbar,body.sel #ordbar{display:flex}
body.short #ctlbar{grid-template-rows:40px 40px}
body.wide #ctlbar{grid-template-rows:44px 44px 44px 44px;grid-template-areas:"prog" "cmd" "pos" "ord"}
body.wide #ctl{grid-area:prog;display:flex}
body.wide #cmdbar,body.wide #flarebar{grid-area:cmd}
body.wide #posbar{grid-area:pos;display:flex}
body.wide #ordbar{grid-area:ord;display:flex}
body.wide.sel #cmdbar{display:flex}
body.wide.flare #cmdbar{display:none}
body.wide.flare #flarebar{display:flex}
body.wide.short #ctlbar{grid-template-columns:minmax(0,5fr) minmax(0,3fr);grid-template-rows:40px 40px 40px;column-gap:4px;
  grid-template-areas:"prog cmd" "pos pos" "ord ord"}
#ordbar.idle .btn{opacity:.3;pointer-events:none}
.btn{flex:1 1 0;min-width:0;height:100%;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink);overflow:hidden}
.btn.one .g{font:13px/1.15 var(--gothic);color:#f1ece0;white-space:nowrap}
.btn.q .g,.btn.q .l{color:var(--amber)}
#cmdbar .btn .l{color:#c9c4b8}
#flarebar .btn.on{border-color:var(--amber);background:#2a2412}
#flarebar .btn.on .g,#flarebar .btn.on .l{color:var(--amber)}
#ordbar .btn{background:#121729;border-color:#283152}
#ordbar .btn .g{color:var(--amber)}
#ordbar .btn.x{flex:0 0 40px}
#ordbar .btn.x .g{font:16px/1 var(--gothic);color:#b9b3a3}
.btn.hintb,.card.hintb{animation:hintb .8s ease-in-out infinite}
@keyframes hintb{50%{box-shadow:0 0 0 2px var(--amber),0 0 12px rgba(255,207,107,.65)}}
#hint{position:absolute;left:0;right:0;bottom:calc(100% + 3px);z-index:3;height:24px;padding:0 8px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;color:#ffe6a8;background:rgba(12,10,6,.92);border:1px solid rgba(255,207,107,.55);pointer-events:none;white-space:nowrap;overflow:hidden;animation:fadein .25s ease-out}
.card .role.dk{color:var(--amber)}
.card .role.qb{animation:qblink 1.6s ease-in-out infinite}
@keyframes qblink{50%{opacity:.3}}
/* 手当て待ちの札（3.2）：札そのものが「衛生兵を呼ぶ」。状態の行に「叩いて手当」（琥珀）、細い帯は残りの時間（数字は出さない） */
.card .st.tr{color:var(--amber)}
.card.wd{background:#1a1412}
.card.wd .hp i{background:#c46a66;transition:none}
.card.wd.tt .hp i{background:#e8e3d6}
.card.good{animation:goodc .6s ease-out}
@keyframes goodc{30%{box-shadow:0 0 0 2px var(--rc),0 0 14px var(--rc)}}
/* 「戻れ」：指令の段の右の端。文字だけで、くすんだ白の二重線 */
#cmdbar .btn.recall{flex:0 0 64px;border:3px double #b8b3a5;background:var(--panel2)}
#cmdbar .btn.recall .g{color:#e2ddd0;font:bold 14px/1 var(--gothic)}
#hud .nm{font-size:11px;color:#cfe0ff;border:1px solid #3a4560;padding:0 3px;line-height:14px;margin-left:-6px}
.btn .g{font:15px/1 var(--mono);color:#efe4cb}
.btn .l{font-size:11px;line-height:1.1;color:var(--dim);text-align:center;white-space:normal;text-wrap:balance;overflow:hidden;max-width:100%;max-height:2.2em;padding:0 1px}
.btn:active{background:#20242a}
.btn.on{border-color:var(--amber);background:#1f1b12}
.btn.on .g{color:var(--amber)}
.btn.arm{border-color:#ffe6a8;background:#2a2412}
.btn.dis,.btn:disabled{opacity:.35;pointer-events:none}
.btn.shake{animation:cshake .32s}
#posbar .btn .g{font:bold 15px/1 var(--gothic)}
#posbar .btn .l{font:11px/1.1 var(--mono);white-space:nowrap;text-overflow:ellipsis}
#posbar .btn.full{opacity:.38}
#posbar .btn.same{opacity:.38;border-style:dashed}
#posbar .btn.gone{opacity:.28;color:#8a8f99;border-color:#3a3d44}
#posbar.idle .btn{opacity:.4}

/* log list (wide side panel, and inside the log sheet) */
.logpane{display:flex;flex-direction:column;min-height:0;width:100%;border:1px solid var(--line);background:var(--panel)}
.logtabs{display:flex;border-bottom:1px solid var(--line)}
.logtabs button{flex:1;min-height:40px;padding:0;font:13px/1 var(--mincho);letter-spacing:.1em;color:var(--dim)}
.logtabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--amber)}
.loglist{flex:1;min-height:0;overflow:auto;padding:8px 10px;font-size:12.5px;line-height:1.6;user-select:text;-webkit-user-select:text}
.loglist p{margin:0 0 5px;padding-left:4.4em;text-indent:-4.4em;color:#cfc8b8}
.loglist p time{display:inline-block;width:4.2em;text-indent:0;font:11px var(--mono);color:var(--dim)}
.loglist p .k{display:inline-block;width:7px;height:7px;transform:rotate(45deg);margin:0 6px 1px 0;text-indent:0}
.loglist p.tonight{color:#efe6d2}
.loglist p.fail{color:#e2aaa7}
.loglist .empty{color:var(--faint);font-family:var(--mincho)}
.loglist .cnt{font:11px var(--mono);color:var(--faint);margin-bottom:8px}

/* ---------------------------------------------------------------- sheets */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(2,3,4,.66);display:flex;align-items:center;justify-content:center;
  padding:max(16px,var(--st)) var(--gr) max(16px,var(--sb)) var(--gl)}
#sheet .panel{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line2);
  padding:18px 18px 16px;box-shadow:0 10px 50px rgba(0,0,0,.7)}
#sheet .panel.tall{height:min(640px,100%);display:flex;flex-direction:column;padding:0}
#sheet .panel:focus{outline:none}
#sheet h2{margin:0 0 12px;padding-right:36px;font:18px/1.4 var(--mincho);letter-spacing:.14em}
#sheet .row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
#sheet .row label{flex:1}
#sheet input[type=range]{flex:1.4;min-width:0;height:40px;margin:0;accent-color:var(--amber)}
#sheet .tog{min-width:56px;min-height:40px;padding:0 12px;border:1px solid var(--line2);font-size:13px}
#sheet .tog.on{border-color:var(--amber);color:var(--amber)}
#sheet .keys{margin:12px 0 4px;padding:8px 10px;border:1px solid var(--line);font:12px/1.7 var(--mono);color:var(--dim)}
#sheet .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#sheet .acts button,.pbtn{min-height:40px;border:1px solid var(--line2);padding:10px 16px;font-size:14px;background:var(--panel2)}
#sheet .acts .pri,.pbtn.pri{border-color:#c9b78c;color:#fff3d6;background:#2a2518}
#sheet .acts .warnb{border-color:rgba(217,83,79,.7);color:#f0b7b5}
#sheet .acts .arm{border-color:#e0605a;color:#fff;background:rgba(120,22,18,.92)}
#sheet .madeby{margin-top:14px;text-align:right;font:11.5px/1.6 var(--mincho);color:var(--faint);letter-spacing:.1em}
#sheet .sub{font-size:12.5px;color:var(--dim);line-height:1.7}
#sheet .closex{position:absolute;right:2px;top:2px;width:44px;height:44px;font-size:16px;color:var(--dim)}
.endp{text-align:center;padding:30px 18px 24px!important}
.endp .big{font:30px/1.3 var(--mincho);letter-spacing:.3em;margin:0 0 18px;padding-left:.3em}
.endp .line{font:15px/1.8 var(--mincho);color:#e7dfcd;margin:0 0 20px;letter-spacing:.05em}
.endp .small{margin-top:14px}
.endp .small button{min-height:40px;font-size:12px;color:var(--dim);border:0;padding:0 6px;background:none;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:5px}
.talk{margin:6px auto 18px;max-width:420px;text-align:left}
.talk div{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px;line-height:1.5}
.talk canvas{width:34px;height:34px;flex:0 0 auto;image-rendering:pixelated}
.talk .who{font-size:11px;color:var(--dim);display:block}
.fade-in{animation:fadein .8s ease-out both}
/* 夜の帯の束：夜が多いと（dense）帯を細くして一画面に収める */
.stack{margin:4px 0 16px;display:flex;flex-direction:column;gap:5px;text-align:left}
.stack .band{display:flex;align-items:center;gap:8px;animation:fadein .5s ease-out both}
.stack .band span{flex:0 0 4.4em;font:12px/1.2 var(--mincho);color:var(--dim);text-align:right;white-space:nowrap}
.stack .band div{position:relative;flex:1;height:12px;background:linear-gradient(to right,#0d1018,#0d1018 85%,#2b2f3a);border:1px solid #23262c}
.stack .band div i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rc);transform:translateX(-1px)}
.stack .band.last div{border-color:#8e8672;background:linear-gradient(to right,#141822,#1d2230 80%,#c9b78c)}
.stack .band.many div i{opacity:.55}
.stack.dense{gap:3px;margin-bottom:12px}
.stack.dense .band span{font-size:11px}
.stack.dense .band div{height:8px}
.stack.dense .band div i{top:-2px;bottom:-2px}
.credits{margin-top:22px;font:12.5px/2 var(--mincho);color:var(--dim);letter-spacing:.12em}
/* 束の日の見出し（開いている日が二つ以上のとき）と、日の間の昼の札 */
.stack .dhead{margin:6px 0 0 4.4em;padding-left:8px;font:12.5px/1.4 var(--mincho);letter-spacing:.2em;color:#cbbf9f;animation:fadein .5s ease-out both}
.dayc{margin:4px auto 6px;max-width:420px;padding:10px 14px;border:1px solid var(--line2);background:#16140f;text-align:left;font:13.5px/1.8 var(--mincho);color:#e7dfcd}
.dayc p{margin:0}
/* まとめ印の重ね板：一行ずつ叩くとその印の記録 */
#sheet .mrows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#sheet .mrow{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-left:4px solid var(--rc);background:var(--panel2);text-align:left;font-size:14px}
#sheet .mrow time{font:13px var(--mono);color:var(--dim)}
#sheet .mrow em{margin-left:auto;font:normal 12px var(--mono);color:var(--dim)}
#sheet .mrow.lost span{color:#e2aaa7}
#sheet .mrow.warn{animation:blink .45s steps(2) infinite}

/* ---------------------------------------------------------------- title */
/* 縦長は一列（.tcol は display:contents で並びを order で決める）。低い横長は左に題とボタン、右に五人 */
#title{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(ellipse at 50% 38%,rgba(10,12,16,.55),rgba(3,4,5,.94) 70%)}
#title .tbox{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  padding:calc(24px + var(--st)) var(--gr) calc(20px + var(--sb)) var(--gl)}
#title .tcol{display:contents}
#title .roster{order:1}
#title .tbtns{order:2}
#title .tsnd{order:3}
#title .tset{order:4}
#title h1{margin:0;font:normal clamp(52px,17vw,104px)/1 var(--mincho);letter-spacing:.08em;color:#efe5cc;text-shadow:0 0 30px rgba(255,214,140,.18)}
#title h1 rt{font:clamp(11px,3vw,14px)/1.6 var(--mono);letter-spacing:.5em;color:var(--dim)}
#title .tplace{margin:4px 0 0;font:15px/1.6 var(--mincho);letter-spacing:.3em;color:#cbbf9f}
#title .tlead{font:13px/1.9 var(--mincho);color:var(--dim);letter-spacing:.12em}
#title .tmore{color:#e7d6a8}
#title .roster{display:flex;flex-direction:column;gap:5px;margin:8px 0 4px;width:min(420px,100%)}
#title .roster div{display:flex;align-items:center;gap:9px;text-align:left;font-size:12px;color:var(--dim);border-left:3px solid var(--rc);padding-left:7px}
#title .roster canvas{width:30px;height:30px;flex:0 0 auto;image-rendering:pixelated}
#title .roster b{color:var(--ink);font-size:13px;margin-right:6px}
#title .roster em{font-style:normal;color:var(--rc);margin-right:8px;font-size:11px}
#title .roster .loss{color:#c0605b;margin-left:4px;font-size:11px}
#title .roster .nw{white-space:nowrap}
#title .tbtns{display:flex;flex-direction:column;gap:8px;margin-top:8px;width:min(280px,100%)}
#title .tbtns .pbtn{padding:13px 0;font:16px/1 var(--mincho);letter-spacing:.3em}
#title .tbtns .pbtn small{display:block;margin-top:6px;font:11px var(--mono);letter-spacing:.1em;color:var(--dim)}
#title .tsnd{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);margin-top:4px}
#title .tsnd label{display:flex;align-items:center}
#title .tsnd input{width:120px;height:40px;margin:0 0 0 6px;accent-color:var(--amber)}
#title .tset{min-height:40px;padding:0 14px;font-size:12px;color:var(--dim);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:5px}
#title .tcleared{min-height:40px;padding:0 6px;font:13px/1.6 var(--mincho);letter-spacing:.12em;color:#e7d6a8;text-decoration:underline;text-decoration-color:rgba(201,183,140,.5);text-underline-offset:5px}

body.ending #hud,body.ending #tl,body.ending #radio,body.ending #cards,body.ending #ctlbar,body.ending #logbox{opacity:.12;transition:opacity 2s;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  #mapframe.shake,#mapframe.shake2,.card.shake,.btn.shake{animation:none}
  .card.warn{animation:none;box-shadow:0 0 0 2px var(--rc)}
  #tltrack .mk.warn b{animation:none;outline:2px solid var(--amber)}
  #pausetag .tap{animation:none}
  .card.hit{animation:none}
}
/* 低い縦長（ブラウザの帯のある小さな電話）：無線・札・ボタンを詰める。本文の二行は切らない */
body.short:not(.wide) #game{gap:3px}
body.short:not(.wide) #radio{height:66px}
body.short:not(.wide) #rface{width:46px;height:46px}
body.short:not(.wide) #rtext{font-size:12.5px;line-height:1.25}
body.short:not(.wide) .card{height:52px}
body.short:not(.wide) .card .role{display:none}
body.short:not(.wide) .card .st{margin-top:1px}
body.short:not(.wide) .card.st2 .st{height:26px;line-height:13px}
body.short:not(.wide) .card .hp{height:3px}
body.short:not(.wide) .btn{gap:1px}
body.short:not(.wide) .btn .l{line-height:1.05}
@media (max-height:700px) and (max-aspect-ratio:1/1){
  #title .tbox{gap:7px;padding-top:calc(14px + var(--st));padding-bottom:calc(10px + var(--sb))}
  #title h1{font-size:clamp(44px,13vw,64px)}
  #title .tlead{line-height:1.6}
  #title .roster{gap:3px;margin:4px 0 2px}
  #title .roster canvas{width:26px;height:26px}
  #title .tbtns .pbtn{padding:11px 0}
}
/* 横長で高さ 760 まで（横向きの電話から 1024x640・1366x657・1280x720 の PC まで）：題は二列。一列では音と設定が下にはみ出す */
@media (max-height:760px) and (min-aspect-ratio:1/1){
  #title .tbox{flex-direction:row;align-items:center;gap:32px;padding-top:calc(12px + var(--st));padding-bottom:calc(10px + var(--sb))}
  #title .tcol{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
  /* 五人の列は後ろの遊ぶ画面（札や操作）に重なるので、ふちをぼかした濃い下地を敷く */
  #title .tcol.b{flex:0 1 420px;background:rgba(5,6,8,.88);box-shadow:0 0 22px 14px rgba(5,6,8,.88);border-radius:6px}
  #title h1{font-size:clamp(44px,13vh,72px)}
  #title .tlead{line-height:1.6}
  #title .roster{margin:0;gap:4px}
  #title .tbtns{margin-top:4px}
  #title .tbtns .pbtn{padding:11px 0}
}

<script>
/* content.js */
/* 〇五〇〇 — CONTENT: numbers, terrain, the night's schedule and the id table.
   Everything here is plain JSON-able data (no functions, Infinity or undefined in the result).
   Times are integer ticks: 1 tick = 0.1 game minute, 22:00 = 0, 04:30 = 3900, 05:00 = 4200. */
const CONTENT = (() => {
  // n copies of one enemy type, `gap` ticks apart, starting at offset `start`
  function run(type, n, gap, start) {
    const out = [];
    for (let i = 0; i < n; i++) out.push([start + i * gap, type]);
    return out;
  }
  // one row of the id table (仕様 §8)
  function id(name, cue, log, subject, pauseFirst, key, fail) {
    return { id: name, cue: !!cue, log: !!log, subject: !!subject, pauseFirst: !!pauseFirst, key: key || null, fail: !!fail };
  }

  const ids = [];
  ['w1n', 'w2w', 'w3e', 'w3n', 'w4n', 'w5w', 'w6e', 'w7n', 'w8w', 'dn', 'w9n', 'w9w', 'w9e']
    .forEach(w => ids.push(id(w, 0, 1, 0, 0, null, 0)));
  ['wave_n', 'wave_w', 'wave_e'].forEach(w => ids.push(id(w, 1, 0, 0, 0, null, 0)));
  ids.push(
    //  id               cue log subj pause key      fail
    id('eps_stir',        1, 1, 0, 0, 'eps', 0),
    id('eps_wound',       1, 1, 1, 1, 'eps', 0),
    id('eps_run',         1, 1, 1, 0, 'eps', 0),
    id('eps_dark',        1, 1, 1, 1, 'eps', 1),
    id('eps_lit',         1, 1, 0, 1, 'eps', 0),
    id('eps_saved',       0, 1, 1, 0, 'eps', 0),
    id('alpha_whisper',   1, 0, 0, 0, 'alpha', 0),
    id('alpha_called',    1, 1, 1, 1, 'alpha', 0),
    id('alpha_gone',      1, 1, 1, 1, 'alpha', 1),
    id('alpha_light',     1, 1, 0, 1, 'alpha', 0),
    id('alpha_held',      1, 1, 1, 1, 'alpha', 0),
    id('alpha_wake',      1, 1, 1, 0, 'alpha', 0),
    id('alpha_saved',     0, 1, 1, 0, 'alpha', 0),
    id('beta_rod',        1, 1, 1, 1, 'beta', 0),
    id('beta_climb',      1, 1, 1, 0, 'beta', 0),
    id('beta_crawlers',   1, 1, 0, 1, 'beta', 0),
    id('beta_fell',       1, 1, 1, 1, 'beta', 1),
    id('beta_fall_hurt',  1, 1, 1, 0, 'beta', 0),
    id('beta_saved',      1, 1, 1, 0, 'beta', 0),
    id('beta_fixed',      1, 0, 1, 0, 'beta', 0),
    id('beta_dark',       1, 0, 0, 0, 'beta', 0),
    id('gamma_radio',     1, 1, 0, 1, 'gamma', 0),
    id('gamma_reveal',    1, 1, 0, 1, 'gamma', 0),
    id('gamma_grabbed',   1, 1, 1, 1, 'gamma', 1),
    id('gamma_door',      1, 1, 0, 1, 'gamma', 0),
    id('gamma_door_grab', 1, 1, 1, 0, 'gamma', 1),
    id('gamma_saved',     0, 1, 1, 0, 'gamma', 0),
    id('delta_stir',      1, 1, 0, 1, 'delta', 0),
    id('delta_seen',      1, 1, 0, 0, 'delta', 0),
    id('delta_hold',      1, 0, 1, 1, 'delta', 0),
    id('delta_fall',      1, 1, 1, 1, 'delta', 1),
    id('delta_saved',     0, 1, 1, 0, 'delta', 0),
    id('down',            1, 1, 1, 0, null, 0),
    id('door_N',          0, 1, 0, 0, null, 0),
    id('door_W',          0, 1, 0, 0, null, 0),
    id('door_E',          0, 1, 0, 0, null, 0),
    id('door_TB',         0, 1, 0, 0, null, 0),
    id('door_low',        1, 0, 0, 1, null, 0),
    id('hq_gag',          1, 0, 0, 0, null, 0),
    id('dawn_rally',      1, 0, 0, 0, null, 0),
    id('fallen',          0, 1, 0, 0, null, 0),
    id('dawn',            0, 1, 0, 0, null, 0)
  );

  const C = {
    W: 240, H: 300, TPM: 10, END: 4200, DAWN: 3900, RETREAT: 4100,
    posOrder: ['north', 'tower', 'west', 'east', 'hq'],
    positions: {
      north: { x: 120, y: 64, cap: 2, range: 60, dmg: 2, taken: 1, lamp: 30, slots: [[-6, 0], [6, 0], [0, 7]] },
      tower: { x: 120, y: 168, cap: 2, range: 52, dmg: 1, opDmg: 0.5, taken: 1, lamp: 30, slots: [[-6, 3], [6, 3], [0, 9]] },
      west:  { x: 44, y: 148, cap: 2, range: 72, dmg: 1, taken: 1, lamp: 30, slots: [[-6, 0], [6, 0], [0, 7]] },
      east:  { x: 196, y: 148, cap: 2, range: 52, dmg: 1, taken: 0.6, lamp: 30, slots: [[-6, 0], [6, 0], [0, 7]] },
      // tuned: dmg 1 -> 0.3, lamp 22 -> 16
      hq:    { x: 120, y: 268, cap: 99, shooters: 2, range: 44, dmg: 0.3, taken: 1, lamp: 16, regenEvery: 60,
               slots: [[-16, -6], [16, -6], [-8, 4], [0, 4], [8, 4], [0, -12]] },
    },
    paths: {
      N:  [[120, -12], [120, 64], [120, 168], [120, 268]],
      N2: [[120, -24], [120, 64], [120, 168], [120, 268]],   // the big ones of dn
      W:  [[-12, 104], [44, 148], [92, 222], [120, 268]],
      E:  [[252, 104], [196, 148], [148, 222], [120, 268]],
      TB: [[174, 205], [120, 168], [120, 268]],   // tuned: at 02:53 outside the tower lantern, inside a flare thrown on the tower
    },
    pathPos: {
      N: [null, 'north', 'tower', 'hq'], N2: [null, 'north', 'tower', 'hq'],
      W: [null, 'west', null, 'hq'], E: [null, 'east', null, 'hq'], TB: [null, 'tower', 'hq'],
    },
    spots: {
      WEST_DARK: { x: 14, y: 206 },
      TOWER_BASE: [{ x: 116, y: 206 }, { x: 126, y: 212 }],
      NORTH_UPPER: { x0: 96, y0: -30, x1: 144, y1: 14 },

<script>
/* days.js */
/* 〇五〇〇 — DAYS: the content of each day, built once on load from CONTENT.
   DAYS[d] has the same shape as CONTENT (plain JSON-able data) plus day, open and the day's own fields.
   makeDay(base, over): a field that over does not name is base's value as it is.
     replaced whole when named: events waves ids spots paths pathPos posOrder keys keyRole pathMeta decor mech huge orders
     merged key by key (arrays replaced): positions soldiers enemies rules search flare
     any other field (W H TPM END DAWN RETREAT soldierOrder day open ...): over's value when named
   Times are integer ticks (toTick here is the same formula as SIM.toTick: days.js loads before sim.js). */
const DAYS = (() => {
  'use strict';
  const base = (typeof CONTENT !== 'undefined') ? CONTENT
    : (typeof require === 'function' ? require('./content.js') : null);

  const TPM = 10;
  function toTick(s) {
    const m = /^\s*(\d{1,2}):(\d{2})(?:\.(\d))?\s*$/.exec(String(s));
    if (!m) return NaN;
    let h = +m[1];
    if (h < 22) h += 24;
    return ((h - 22) * 60 + (+m[2])) * TPM + (m[3] ? +m[3] : 0);
  }

  const MERGE = { positions: true, soldiers: true, enemies: true, rules: true, search: true, flare: true };
  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function merge(a, b) {
    if (!isObj(a) || !isObj(b)) return clone(b);
    const out = clone(a);
    for (const k of Object.keys(b)) out[k] = merge(a[k], b[k]);
    return out;
  }
  function makeDay(b, over) {
    const out = clone(b);
    over = over || {};
    for (const k of Object.keys(over)) out[k] = MERGE[k] ? merge(b[k], over[k]) : clone(over[k]);
    return out;
  }

  // one row of an id table: row('zeta_hum', 1, 1, 0, 1, 'zeta', 0)
  function row(id, cue, log, subject, pauseFirst, key, fail) {
    return { id: id, cue: !!cue, log: !!log, subject: !!subject, pauseFirst: !!pauseFirst, key: key || null, fail: !!fail };
  }
  // rows every later day has: these of the first day's table, then the new common ones
  const SHARED = ['dawn_rally', 'hq_gag', 'door_low', 'fallen', 'dawn', 'down', 'wave_n', 'wave_w', 'wave_e', 'door_N', 'door_W', 'door_E'];
  const COMMON = [
    row('wave_s', 1, 0, 0, 0, null, 0),
    row('door_S', 0, 1, 0, 0, null, 0),
    row('wound_down', 1, 1, 1, 0, null, 0),
    row('wound_saved', 1, 1, 1, 0, null, 0),
    row('wound_lost', 1, 1, 1, 0, null, 0),
    row('lamp_quiet', 1, 0, 1, 0, null, 0),
    row('lamp_dark', 1, 0, 1, 0, null, 0),

  // the id table of a later day: the shared rows, then the day's own rows (same id twice is an error)
  function idsFor(dayRows) {
    const out = [], seen = {};

      if (seen[r.id]) throw new Error('days: id twice ' + r.id);
      seen[r.id] = true;

/* sim.js */
/* 〇五〇〇 — SIM: the deterministic night.

  'use strict';

  const TPM = 10;                       // ticks per game minute (仕様 §2)
  const TOWER = 'tower', HQ = 'hq';     // the searchlight's post and the dugout
  const HAND_R = 10;                    // the hand lantern's ring (3.1)
  // states that walk the roads: touched by enemies, dragged by lurkers, stepped on
  const MOVERS = { moving: true, rushing: true, called: true, fetching: true, carrying: true };

  const RECALL = { moving: true, rushing: true, called: true, fetching: true };

  const WOUNDABLE = { idle: true, holding: true, treating: true };

  const WORDS = {
    states: ['idle', 'moving', 'rushing', 'called', 'climbing', 'holding', 'wounded', 'treating', 'fetching', 'carrying', 'dead'],
    causes: ['combat', 'dragged', 'called', 'fell', 'grabbed', 'held_out', 'swarmed', 'crushed'],
    refused: ['unknown', 'dead', 'busy', 'same', 'full', 'empty', 'gone', 'locked', 'hq', 'safe', 'nobody', 'fine', 'nomedic', 'none'],
    off: ['gone', 'dark', 'rod', 'switch', 'noOperator'],
    orders: ['prone', 'lamp', 'beam', 'treat', 'carry', 'recall'],

  const V1_KEYS = 'eps alpha beta gamma delta'.split(' ');     // the first day's events, when content.keys is absent

    N2: { dir: 'n', pos: 'north', door: 'door_N' },
    W: { dir: 'w', pos: 'west', door: 'door_W' },
