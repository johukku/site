    else if (inp.type === 'beam') refuseBtn(D.bBeam, e.reason === 'busy' ? null : e.reason);
  }
  // ---- 命令の案内（一日目の lamp・beam・prone）：その場面で一度ずつ。一度に一つ、消えてから 20 秒あける。夜は止めない
  function hintWant(key, id) {
    if (hints.seen[key] || !canOrder(key) || (HINT_DAY1[key] && C.day && C.day !== 1)) return;
    if (!hints.want[key]) hints.want[key] = { id: id || null };
  }
  // 手当て待ちの兵（まだ手当てを受けていない、叩ける札）
  function lyingOne() {
    for (const s of S.soldiers) if (isLying(s) && !s.treatBy) return s.id;
    return null;
  }
  // 手当て待ちのいる持ち場に立って、担げる兵
  function carrierNow() {
    for (const s of S.soldiers) if (s.alive && s.state === 'idle' && s.pos && s.pos !== 'hq' && carryTarget(s)) return s.id;
    return null;
  }
  // 道を来て持ち場で止まった敵が、持ち場の兵を叩いている（その兵の id）
  function roadStrike() {
    for (const e of S.enemies) {
      if (e.gone || !e.path || e.state !== 'attack' || typeof e.target !== 'string' || e.target === 'door') continue;
      const s = sol(e.target);
      if (s && s.alive && s.pos && s.pos !== 'hq') return s.id;
    }
    return null;
  }
  // 持ち場（本部壕のほか）に立つ兵で、体力が半分を割った者
  function weakAtPost() {
    for (const s of S.soldiers) if (s.alive && s.pos && s.pos !== 'hq' && s.state === 'idle' && !s.down && s.hp / s.maxHp < 0.5) return s.id;
    return null;
  }
  function checkHints() {
    if (!hints.seen.lamp && !hints.want.lamp) { const id = roadStrike(); if (id) hintWant('lamp', id); }
    if (!hints.seen.prone && !hints.want.prone) { const id = weakAtPost(); if (id) hintWant('prone', id); }
    // 担ぐ：衛生兵の案内を見たあとで初めて、手当て待ちのいる持ち場に立つ兵がいる tick
    if (hints.seen.treat && !hints.seen.carry && !hints.want.carry && canOrder('carry')) { const id = carrierNow(); if (id) hintWant('carry', id); }
  }
  // 待っていた案内の場面がまだ続いているか（続いていれば、その場面の兵で出す）
  function hintStill(key, w) {
    if (key === 'lamp') { const id = alive(w.id) && sol(w.id).pos && sol(w.id).pos !== 'hq' ? w.id : roadStrike(); w.id = id; return !!id; }
    if (key === 'prone') { const s = sol(w.id); const ok = s && s.alive && s.pos && s.pos !== 'hq' && s.state === 'idle' && !s.down; w.id = ok ? w.id : weakAtPost(); return !!w.id; }
    if (key === 'beam') return !!(S && S.search && !(S.posGone && S.posGone.tower));

    if (hints.cur || phase !== 'play' || now < hints.freeAt || tutorialOpen || sheetOpen) return;
    for (const key of HINT_KEYS) {
      const w = hints.want[key];
      if (!w) continue;
      delete hints.want[key];
      if (hints.seen[key] || !hintStill(key, w)) continue;
      hints.seen[key] = true;

    if (reset) hints.want = {};
  }

  function hintDone(key) {

    if (hints.cur && hints.cur.key === key) hintEnd(false);
  }
  // 予感：既知の出来事の 5 ゲーム分前
  function checkWarn(t) {
    for (const k of KEYS) {
      if (N.warned[k] || !N.knownPrev[k]) continue;
      const T = MARK_T[k];
      if (t >= T - 50 && t < T) {

        AUDIO.ui('warn');
        if (!tracing) { if (ff) stopFF(); if (userSpeed >= 2) userSpeed = 1; }
      }
    }
  }
  // 救えた瞬間：前の夜に見た失敗の時刻に来ても 'dead' でない（失敗の id は表の fail と key から。いちばん早い記録の時刻で）
  function checkBeat(t) {
    for (const k of KEYS) {
      if (N.beats[k] || N.beatDone[k]) continue;
      const rec = failRec(k);
      if (!rec || t < rec.t) continue;
      const out = N.outcomes[k];
      if (out === 'dead') { N.beatDone[k] = true; continue; }
      if (!out) { if (t > rec.t + 600) N.beatDone[k] = true; continue; }
      let who = rec.subject && alive(rec.subject) ? rec.subject : null;
      if (!who && out === 'saved' && N.outSubj[k] && alive(N.outSubj[k])) who = N.outSubj[k];

  function beat(k, who) {

    const items = [];

      const c = RQ.cur;

  }

  // ---------------------------------------------------------------- radio window
  // 今の行を下に、その前の行（hist、最大 3）を上に薄く。入りきらない古い行は隠す
  const RQ = { q: [], cur: null, shown: null, hist: [], lastBark: -1e9, barkBy: {}, hurtBy: {}, barkIdx: {}, shownWho: 'radio' };
  function radioReset() {
    if (RQ.cur && RQ.cur.n < RQ.cur.it.text.length) AUDIO.ui('radioClose', { who: RQ.cur.it.who });

  function say(item) {
    if (item.at === undefined) item.at = nowMs;

      if (RQ.cur && RQ.cur.it.prio < 3) RQ.cur = null;      // 叫びや雑談は出来事に席をゆずる
    } else {
      RQ.q.push(item);

        if (j >= 0) RQ.q.splice(j, 1);

  // 行の by：{ s1..s5: '…' }。話す兵が決まったら、その兵の分の文を使う（無ければ text）
  function byText(L, who) {
    return L.by && isSoldierId(who) && typeof L.by[who] === 'string' ? L.by[who] : L.text;

  // who:'pos' は、その行を打ちはじめるときに cue の持ち場にいる生きた先頭の兵
  function posSpeaker(pos) {
    const P = S && pos ? S.positions[pos] : null;
    if (!P) return null;
    for (const id of P.occupants) if (alive(id)) return id;
    return null;
  }
  function queueCue(e, seen) {
    const lines = TX.cues[e.id];

    const row = idRow[e.id] || {};
    // 出来事で倒れた本人の切れた一言は、倒れた後でも流す
    const lastWords = !!row.fail;
    const vars = { name: e.subject ? nameOf(e.subject) : null, pos: e.pos ? TX.positions[e.pos] : null };
    for (const L of lines) {

      if (who === 'pos' && !e.pos) continue;
      const last = lastWords && who === e.subject;
      if (isSoldierId(who) && !last && !alive(who)) continue;
      const s = byText(L, who);
      if (/\{name\}/.test(s) && !e.subject) continue;
      if (/\{pos\}/.test(s) && !e.pos) continue;

      say({ who, text: fmt(s, vars), prio: 3, seen, cue: e.id, last, tick: e.t, pos: e.pos || null, by: who === 'pos' ? L.by || null : null, vars });

  function bark(id, cat) {
    if (!isSoldierId(id) || !alive(id)) return;

    if (cat === 'fire' && now - (RQ.barkBy[id] || -1e9) < 20000) return;
    if ((cat === 'hurt' || cat === 'low') && now - (RQ.hurtBy[id] || -1e9) < 8000) return;

    const key = id + ':' + cat;

  // 命令の返事の一言（捨ててよい行）。叫びの 3 秒の決まりとは別に数え、出来事の無線が待っていれば出さない
  function orderBark(id, cat) {
    if (!isSoldierId(id) || !alive(id)) return;
    const now = nowMs;
    if (now - (RQ.lastOrder || -1e9) < ORDER_GAP) return;
    if ((RQ.cur && RQ.cur.it.prio >= 3) || RQ.q.some((x) => x.prio >= 3)) return;
    const arr = TX.barks[id] && TX.barks[id][cat];
    if (!arr || !arr.length) return;

    say({ who: id, text: arr[0], prio: 2 });
  }
  // 時刻で流す雑談。pos：who がそこにいるとき。pos と with：二人が同じ持ち場。with だけ：二人とも生きていれば無線の掛け合い。
  // re：すぐ前の行が本当に流れたときだけ（答える相手のいない返事を流さない）
  function idleLine(L, i) {
    const w = L.who;
    if (isSoldierId(w)) {
      const s = sol(w);
      if (!s || !s.alive) return;
      if (L.pos && s.pos !== L.pos) return;
    }
    if (L.with) {
      const o = sol(L.with);
      if (!o || !o.alive) return;
      if (L.pos && o.pos !== L.pos) return;
    }
    const item = { who: w, text: L.text, prio: 1 };
    if (L.re) {
      const prev = N.idleItems[i - 1];
      if (!prev) return;
      item.after = prev;
    }
    N.idleItems[i] = item;
    say(item);
  }
  // 無線の行の持ち場（電波の強さを決める）：兵なら今いる持ち場（歩いていれば出た持ち場）、ほかは行の持ち場か本部壕
  function radioPos(it) {
    if (it.who === 'fake' || it.who === 'radio') return 'hq';
    if (isSoldierId(it.who) && S) {
      const s = (S.soldiers || []).find((x) => x && x.id === it.who);
      if (s) return s.pos || s.from || it.pos || 'hq';
    }
    return it.pos || 'hq';
  }
  function startLine(it) {
    it.played = true;
    if (RQ.shown && RQ.shown !== it) { RQ.hist.push(RQ.shown); if (RQ.hist.length > 3) RQ.hist.shift(); }
    RQ.shown = it;
    const cps = it.cps || (it.prio >= 3 ? (it.seen ? 120 : 32) : 40);   // 前に聞いた無線は x4 で打つ
    const hold = it.hold || ((it.prio >= 3 ? 1200 : 900) + it.text.length * 45);
    RQ.cur = { it, n: 0, acc: 0, cps, hold, doneAt: 0, lastAt: -1e9 };
    // 同調（4.2）：話し手が変わった行の頭で 140 ms
    if (RQ.shownWho !== it.who) RQ.tuneAt = nowMs;
    RQ.shownWho = it.who;
    // 無線の開く音（'me' は鳴らさない。'fake' は本部の札で鳴らす）。打ち終えたら radioClose
    AUDIO.ui('radioOpen', { who: it.who, pos: radioPos(it) });
    const isS = isSoldierId(it.who);
    setText(D.rname, speakerLabel(it.who));
    D.rname.style.color = isS ? ROLE[it.who] : (it.who === 'me' ? '#d8cfb6' : '#7fa58a');
    setText(D.rrole, isS ? TX.soldiers[it.who].role : '');
    setText(D.rtime, clock(it.tick));
    renderRadio();
  }
  function renderRadio() {
    const box = D.rtext;
    if (!box) return;
    box.textContent = '';
    for (const h of RQ.hist) {
      const d = el('div', 'h');
      const lab = speakerLabel(h.who);
      if (lab) { const b = el('b', null, lab); if (ROLE[h.who]) b.style.color = ROLE[h.who]; d.appendChild(b); }
      d.appendChild(document.createTextNode(h.text));
      box.appendChild(d);
    }
    D.rcur = null;
    const it = RQ.shown;
    if (it) {
      const live = !!(RQ.cur && RQ.cur.it === it);
      D.rcur = el('div', 'c' + (it.who === 'radio' ? ' radio' : it.who === 'static' ? ' static' : '') + (live ? '' : ' old'));
      box.appendChild(D.rcur);
      drawRadioText();
    } else fitRadio();
  }
  // 最後に打った 1 字を 180 ms だけ白く。'static' と 'fake' の行は、出たばかりの字を 60 ms だけ別の仮名にしてから戻す（4.2）
  const GARBLE = 'ヰヱヲヮヵヶゐゑをぬねのめぬゆ';
  function radioFx() { return save.settings.scan !== false && !reducedMotion; }
  function garbleOf(ch, n) { return GARBLE.charAt((n * 7 + ch.charCodeAt(0)) % GARBLE.length); }
  function drawRadioText() {
    const e = D.rcur, it = RQ.shown;
    if (!e || !it) return;
    const c = RQ.cur && RQ.cur.it === it ? RQ.cur : null;
    const n = c ? c.n : it.text.length;
    const hot = !!(c && n > 0 && nowMs - c.lastAt < 180);
    const garb = !!(hot && radioFx() && (it.who === 'static' || it.who === 'fake') && nowMs - c.lastAt < 60 && it.text.charAt(n - 1).trim());
    if (c) { c.hot = hot; c.garb = garb; }
    if (hot) {
      e.textContent = it.text.slice(0, n - 1);
      const ch = it.text.charAt(n - 1);
      e.appendChild(el('span', 'hot', garb ? garbleOf(ch, n) : ch));
    } else e.textContent = it.text.slice(0, n);
    if (n < it.text.length) e.appendChild(el('span', 'cur'));
    fitRadio();
  }
  // 無線窓の顔の opt（4.1）：表情・口・光・体力・電波・同調
  function faceOpt(it, typing, now) {
    const fo = faceOf(RQ.shownWho);
    let face = fo.face, expr = 'talk';
    const s = isSoldierId(face) ? sol(face) : null;
    if (it) {
      if (it.cat === 'fire' || it.cat === 'kill') expr = 'shout';
      else if (it.cat === 'hurt' || it.cat === 'low') expr = 'hurt';
      else if (/^ふ[ーん]/.test(it.text)) expr = 'hum';
      if (it.last) {
        // 倒れた本人の切れた一言：打ち終えて 200 ms 止め絵、そのあとは砂嵐だけ
        expr = 'hurt';
        if (it.doneAt) { if (now - it.doneAt > 200) face = 'static'; else expr = 'lost'; }
      }
    }
    if (s && s.state === 'wounded') expr = 'hurt';
    const c = RQ.cur && RQ.cur.it === it ? RQ.cur : null;
    const ch = c && c.n > 0 ? c.it.text.charAt(c.n - 1) : '';
    let light = 'lamp';
    if (s) { try { light = RENDER.faceLight(S, face) || 'lamp'; } catch (e) { light = 'lamp'; } }
    let mouth = 'half';
    try { mouth = RENDER.mouthOf(ch) || 'half'; } catch (e) { mouth = 'half'; }
    const tune = RQ.tuneAt !== undefined && now - RQ.tuneAt >= 0 && now - RQ.tuneAt < 140 ? now - RQ.tuneAt : null;
    const opt = {
      expr, mouth, light, hp: s ? (s.alive ? clamp(s.hp / s.maxHp, 0, 1) : 0) : 1, signal: fo.signal, tune,
      wounded: !!(s && s.state === 'wounded'), scan: save.settings.scan !== false, still: reducedMotion, now,
    };
    return { face, opt, typing: typing && face !== 'static' };
  }
  // 上にはみ出した前の行は丸ごと隠す（途中で切れた行を見せない）
  function fitRadio() {
    const box = D.rtext;
    if (!box || !box.children) return;
    const top = box.offsetTop;
    for (const ch of Array.prototype.slice.call(box.children)) {
      if (ch === D.rcur) break;
      if (ch.offsetTop < top - 0.5) ch.style.display = 'none';
    }
  }
  function radioTick(now, dt) {
    const k = isRunning() ? clamp(curSpeed(now), 1, 4) : 1;
    const c = RQ.cur;
    if (c) {
      const len = c.it.text.length;
      // 次の行が待っていれば、打つのも渡すのも速める（遅れが 1.5 分を超えたらもう一段）。拍の一言はそのまま
      const wait = c.it.knew ? 0 : RQ.q.length;
      const lag = wait && S ? S.tick - RQ.q[0].tick : 0;
      const hurry = wait ? Math.min(3, 1 + 0.5 * wait + (lag > 15 ? 1 : 0)) : 1;
      if (c.n < len) {
        c.acc += dt * c.cps * k * hurry / 1000;
        const add = Math.floor(c.acc);
        if (add > 0) {
          c.acc -= add;
          c.n = Math.min(len, c.n + add);
          c.lastAt = now;
          AUDIO.ui('type', { ch: c.it.text.charAt(c.n - 1), n: c.n, hurry: hurry > 1 });
          if (c.n >= len) { c.doneAt = now; c.it.doneAt = now; AUDIO.ui('radioClose', { who: c.it.who }); }
          drawRadioText();
        } else if (c.hot && (now - c.lastAt >= 180 || (c.garb && now - c.lastAt >= 60))) drawRadioText();
      } else if (c.hot) {
        if (now - c.lastAt >= 180 || (c.garb && now - c.lastAt >= 60)) drawRadioText();
      } else {
        const hold = wait ? Math.min(c.hold, 450 + len * 22) / hurry : c.hold;
        if (now - c.doneAt >= hold / (c.it.knew ? 1 : k)) {
          RQ.cur = null;
          if (D.rcur) D.rcur.classList.add('old');
        }
      }
    }
    if (!RQ.cur) {
      while (RQ.q.length) {
        const it = RQ.q.shift();
        if (it.prio < 3) {
          // 叫びと雑談は遅れたら捨てる（出来事の無線は捨てない）
          if (now - it.at > (it.prio === 2 ? 2000 : 4000)) continue;
          if (it.prio === 1 && S && S.tick - it.tick > 20) continue;
          if (it.after && !it.after.played) continue;
        }
        if (it.who === 'pos') {
          const w = posSpeaker(it.pos);
          if (!w) continue;
          it.who = w;
          if (it.by && typeof it.by[w] === 'string' && fills(it.by[w], it.vars)) it.text = fmt(it.by[w], it.vars);
        }
        if (isSoldierId(it.who) && !it.last && !alive(it.who)) continue;
        startLine(it);
        break;
      }
    }
    const typing = !!(RQ.cur && RQ.cur.n < RQ.cur.it.text.length);
    const fo = faceOpt(RQ.shown, typing, now);
    try { RENDER.portrait(D.rctx, fo.face, 0, 0, D.rface.width, fo.typing, fo.opt); } catch (e) { /* なくてよい */ }
  }

  // ---------------------------------------------------------------- per-frame DOM
  // 地図の上の「停止中」の札：全角の空白の前を大きく、後ろ（押すと再開）を小さく二行に
  function pausedLabel(e, s) {
    e.textContent = '';
    const i = String(s).indexOf('　');
    if (i < 0) { e.appendChild(el('span', null, s)); return; }
    e.append(el('span', null, s.slice(0, i)), el('small', null, s.slice(i + 1)));
  }
  function cardState(s) {
    const U = TX.ui;
    // 倒れた札は暗くなり ✕ も付くので、「戦死」は重ねず死に方だけ（戦闘か不明なら「戦死」）
    if (!s.alive) return (s.cause !== 'combat' && U.cause[s.cause]) || U.state.dead;
    const q = cardQueued(s.id);
    if (q && q.type === 'move') return fmt(U.queued, { pos: TX.posShort[q.to] });      // 止まっている間に出した移動（叩けば取り消し）
    if (q && q.type === 'prone') return U.queuedOrd[q.on ? 'prone' : 'up'];
    if (q && q.type === 'lamp') return U.queuedOrd[q.off ? 'lampOff' : 'lampOn'];
    if (q && q.type === 'carry') return U.queuedOrd.carry;
    if (q && q.type === 'treat') return U.queuedOrd.treat;
    // 手当て待ち：叩けるあいだは「叩いて手当」、手当てを受けている間は「手当て中」
    if (s.state === 'wounded') return s.treatBy ? U.state.treating : (canOrder('treat') ? U.treatCard : U.state.wounded);
    if (s.state === 'treating' || s.state === 'carrying' || s.state === 'fetching') return U.state[s.state];
    if (s.state === 'idle') return (TX.posShort[s.pos] || '') + (s.down ? ' ' + U.state.down : '');
    if (s.state === 'moving' || s.state === 'rushing') return U.state[s.state] + (s.dest ? ' →' + TX.posShort[s.dest] : '');
    if (s.state === 'climbing' || s.state === 'holding') return (TX.posShort[s.pos] || '') + ' ' + U.state[s.state];
    return U.state[s.state] || s.state;
  }
  function btnMsg(b, now) { return b && b._msg && now < b._msgUntil ? b._msg : null; }
  // 案内で明滅させる札（その兵を選ぶまで。選んだら命令のボタンへ移る）
  function hintCardId() {
    const h = hints.cur;
    if (!h || phase !== 'play' || (h.key !== 'lamp' && h.key !== 'prone' && h.key !== 'treat' && h.key !== 'carry') || !h.id) return null;
    return selected === h.id ? null : h.id;
  }
  function updateDom(now) {
    if (!S || !N) return;
    const U = TX.ui;
    // 上の段
    setText(D.nl, nightLabel(N.n));
    setText(D.clk, clock(S.tick));
    const dn = Math.ceil(clamp(S.door.hp / S.door.max, 0, 1) * 10);
    const low = S.door.hp < C.rules.doorLowAt;
    if (D.k.door !== dn || D.k.doorLow !== low) {
      D.k.door = dn; D.k.doorLow = low;
      D.doorI.forEach((b, i) => b.classList.toggle('off', i >= dn));
      D.door.classList.toggle('low', low);
    }
    const noDoor = posGone('hq');
    if (D.doorX && D.doorX.hidden === noDoor) { D.doorX.hidden = !noDoor; D.door.hidden = noDoor; }
    const fl = phase === 'play' ? flaresAvail() : S.flaresLeft;
    if (D.k.fl !== fl) { D.k.fl = fl; D.fdotI.forEach((b, i) => b.classList.toggle('off', i >= fl)); }

    // 時刻の帯
    const x = pct(S.tick);
    if (D.k.tlx !== x) { D.k.tlx = x; D.tlNow.style.left = x; D.tlPast.style.width = x; }
    for (const w of C.waves) { const v = idVisible(w.id); if (D.waves[w.id].hidden === v) D.waves[w.id].hidden = !v; }
    const wk = activeWarnKey();
    let markMoved = false;
    for (const k of KEYS) {
      const m = D.marks[k];
      const vis = keyVisible(k);
      if (vis !== m.vis) {
        m.vis = vis; m.el.hidden = !vis; markMoved = true;
        if (vis) restartAnim(m.el, 'new');
      }
      if (!vis) continue;
      const cls = 'mk ' + markStatus(k) + (wk === k ? ' warn' : '');
      if (m.cls !== cls) {
        const keep = ['pop', 'new'].filter((c) => m.el.classList.contains(c));
        m.cls = cls; m.el.className = cls + (keep.length ? ' ' + keep.join(' ') : '');
      }
    }
    if (markMoved) placeMarks();         // 見える印が増えたら、押せる所を並べ直す（重なればまとめ印に）
    paintGroups(wk);
    const nk = (phase === 'play' || phase === 'intro') ? nextMarkKey(S.tick) : null;
    const nxt = nk ? fmt(U.next, { at: clock(MARK_T[nk]), pos: markPlace(nk) }).trim() : '';
    if (D.k.nxt !== nxt) { D.k.nxt = nxt; setText(D.tlNext, nxt); D.tlNext.style.color = nk ? ROLE[KEY_ROLE[nk]] : ''; }

    // 兵の札
    const warnRole = wk ? KEY_ROLE[wk] : null;
    for (const id of C.soldierOrder) {
      const s = sol(id), c = D.cards[id], k = c.k;
      const st = cardState(s);
      const lying = isLying(s);
      const trc = lying && !s.treatBy && canOrder('treat') && !cardQueued(id);
      if (k.st !== st || k.trc !== trc) {
        k.st = st; k.trc = trc; setText(c.st, st);
        c.st.classList.toggle('q', !!cardQueued(id)); c.st.classList.toggle('tr', trc); fitCard(c);
      }
      // 役の行：手当て待ちなら「手当て待ち」、立っている持ち場の灯りを消していれば「灯り消」（琥珀）
      const dk = !lying && !!(s.alive && s.pos && S.positions[s.pos] && S.positions[s.pos].dark);
      const rl = lying ? U.state.wounded : dk ? U.lampDark : TX.soldiers[id].role;
      if (k.rl !== rl) { k.rl = rl; setText(c.role, rl); c.role.classList.toggle('dk', dk || lying); }
      // lamp_quiet のあと、点けるまで「灯り消」をゆっくり明滅
      const qb = dk && !!N.quiet[s.pos];
      if (k.qb !== qb) { k.qb = qb; c.role.classList.toggle('qb', qb); }
      // 細い帯：ふだんは体力。手当て待ちの間は失血までの残り（手当てを受けている間は手当ての進み）。数字は出さない
      let hpP = s.alive ? Math.round(clamp(s.hp / s.maxHp, 0, 1) * 100) : 0;
      if (lying) {
        const BL = C.mech && C.mech.bleed;
        if (s.treatBy && s.treatUntil !== null && BL) hpP = Math.round(clamp(1 - (s.treatUntil - S.tick) / BL.treatTicks, 0, 1) * 100);
        else if (s.bleedUntil !== null && BL) hpP = Math.round(clamp((s.bleedUntil - S.tick) / BL.bleedTicks, 0, 1) * 100);
      }
      if (k.hp !== hpP) { k.hp = hpP; c.hpi.style.width = hpP + '%'; c.hp.classList.toggle('low', !lying && hpP <= 35); }
      const hb = hintCardId() === id;
      const cls = (s.alive ? '' : ' dead') + (selected === id ? ' sel' : '') + (warnRole === id ? ' warn' : '') + (hb ? ' hintb' : '') +
        (lying ? ' wd' : '') + (lying && s.treatBy ? ' tt' : '');
      if (k.cls !== cls) {
        k.cls = cls;
        for (const n of ['dead', 'sel', 'warn', 'hintb', 'wd', 'tt']) c.el.classList.toggle(n, cls.indexOf(' ' + n) >= 0);
      }
      let ln = save.losses[id] || 0;
      if (!N.committed) for (const d of N.deaths) if (d.id === id) ln++;
      if (k.ln !== ln) { k.ln = ln; setCardLoss(c.loss, ln); }
    }

    // 操作の帯
    const playing = phase === 'play';
    setText(D.bPause._g, paused ? '▶' : '❚❚');
    setText(D.bPause._l, paused ? U.play : U.pause);
    D.bPause.classList.toggle('on', playing && paused);
    setText(D.bSpeed._g, fmt(U.speedN, { n: userSpeed }));
    D.bFF.classList.toggle('on', ff);
    const armed = mode === 'flare';
    D.bFlare.classList.toggle('arm', armed);
    const fmsg = D.k.flareMsgUntil && now < D.k.flareMsgUntil;
    const fdots = '●'.repeat(Math.max(0, fl)) + '○'.repeat(Math.max(0, C.flare.count - Math.max(0, fl)));
    setText(D.bFlare._l, fmsg ? U.refused.empty : U.flare + ' ' + fdots);
    D.bFlare.classList.toggle('dis', !armed && fl <= 0 && !fmsg);
    // 構えている間の段：選んでいる種類が琥珀
    for (const kk in D.kind) D.kind[kk].classList.toggle('on', flareKind === kk);
    // 光を絞る／広げる：今の太さの逆。積まれていれば「次は…」、替えている間は押せない
    if (D.bBeam) {
      const qb = playing ? queuedOf('beam') : null;
      const txt = btnMsg(D.bBeam, now) || (qb ? U.queuedOrd[qb.narrow ? 'beamNarrow' : 'beamWide'] : (S.search.mode === 'narrow' ? U.beamWide : U.beamNarrow));
      setText(D.bBeam._g, txt);
      D.bBeam.classList.toggle('q', !!qb);
      D.bBeam.classList.toggle('dis', !qb && (switching() || !!(S.posGone && S.posGone.tower)));
      D.bBeam.classList.toggle('hintb', !!(hints.cur && hints.cur.key === 'beam'));
    }
    const nar = S.search.mode === 'narrow';
    if (D.nm.hidden === nar) D.nm.hidden = !nar;
    const tv = canTrace() || tracing;
    if (D.bTrace.hidden === tv) D.bTrace.hidden = !tv;
    if (tv) { setText(D.bTrace._l, tracing ? U.traceStop : U.trace); D.bTrace.classList.toggle('on', tracing); }
    const wide = document.body.classList.contains('wide');
    document.body.classList.toggle('sel', !!selected && playing);
    document.body.classList.toggle('flare', armed && playing);
    // 兵の命令の段：使えないとき（本部壕の兵・歩いている兵など）は暗いボタン
    const me = selected && playing ? sol(selected) : null;
    D.ordbar.classList.toggle('idle', !me);
    if (D.bProne) {
      const qp = me ? queuedProne(me.id) : null;
      const txt = qp ? U.queuedOrd[qp.on ? 'prone' : 'up'] : (me && me.down ? U.up : U.prone);
      setText(D.bProne._g, txt);
      D.bProne.classList.toggle('q', !!qp);
      D.bProne.classList.toggle('dis', !!me && !qp && !!precheckProne(me));
      D.bProne.classList.toggle('hintb', !!(me && hints.cur && hints.cur.key === 'prone'));
    }
    if (D.bLamp) {
      const lp = lampPosOf(me);
      const ql = queuedLamp(lp);
      const dark = !!(lp && S.positions[lp] && S.positions[lp].dark);
      const txt = ql ? U.queuedOrd[ql.off ? 'lampOff' : 'lampOn'] : (dark ? U.lampOn : U.lampOff);
      setText(D.bLamp._g, txt);
      D.bLamp.classList.toggle('q', !!ql);
      D.bLamp.classList.toggle('dis', !!me && !ql && !!precheckLamp(me));
      D.bLamp.classList.toggle('hintb', !!(me && hints.cur && hints.cur.key === 'lamp'));
    }
    if (D.bCarry) {
      const qc = me ? queuedCarry(me.id) : null;
      setText(D.bCarry._g, qc ? U.queuedOrd.carry : U.carry);
      D.bCarry.classList.toggle('q', !!qc);
      D.bCarry.classList.toggle('dis', !!me && !qc && !!precheckCarry(me));
      D.bCarry.classList.toggle('hintb', !!(me && hints.cur && hints.cur.key === 'carry'));
    }
    // 戻れ：歩いている兵がいなければ暗い。積まれていれば「次は戻る」
    if (D.bRecall) {
      const qr = playing ? queuedOf('recall') : null;
      setText(D.bRecall._g, btnMsg(D.bRecall, now) || (qr ? U.queuedOrd.recall : U.recall));
      D.bRecall.classList.toggle('q', !!qr);
      D.bRecall.classList.toggle('dis', !qr && !walkersNow().length && !queued.some((q) => q.type === 'move'));
      D.bRecall.classList.toggle('hintb', !!(hints.cur && hints.cur.key === 'recall'));
    }
    // 案内の一行
    // 二日目の沢の羽音の明滅は、灯りの案内を見たあとなら文を出さない（quiet）
    for (const pk in N.quiet) if (!S.positions[pk] || !S.positions[pk].dark) delete N.quiet[pk];
    const hk = hints.cur && playing && !hints.cur.quiet ? hints.cur.key : null;
    if (D.hint.hidden !== !hk) D.hint.hidden = !hk;
    if (hk) setText(D.hint, U.hint[hk]);
    if (selected || wide) {
      const me = selected ? sol(selected) : null;
      const mq = selected ? queuedMove(selected) : null;
      D.posbar.classList.toggle('idle', !selected);
      for (const k of C.posOrder) {
        const P = D.pos[k];
        const n = S.positions[k].occupants.length + incoming(k, selected);
        const gone = posGone(k);
        const cap = gone ? C.positions[k].cap : capNow(k);
        // 定員の無い所（本部壕、04:30 からの橋）は名前だけ
        const g = (k === 'hq' || cap >= 99) ? TX.posShort[k] : fmt(U.posBtn, { pos: TX.posShort[k], n, cap });
        if (P.k.g !== g) { P.k.g = g; setText(P.el._g, g); }
        // 待っている移動があれば、その行き先が「同じ」。今いる持ち場は取り消しとして押せる
        const same = !!(me && (mq ? mq.to === k : isSamePost(me, k)));
        // 無くなった持ち場は暗いボタン（押すと札に「もう無い」）
        P.el.classList.toggle('gone', gone);
        P.el.classList.toggle('full', !gone && !same && n >= cap);
        P.el.classList.toggle('same', !gone && same);
      }
    }

    // 地図の上の札（照明弾を構えている間は「一時停止中」を出さない）
    const pt = playing && paused && !sheetOpen && !tutorialOpen && !armed;
    if (D.pause.hidden === pt) D.pause.hidden = !pt;
    if (pt) {
      if (D.k.pausedLabel !== U.paused) { D.k.pausedLabel = U.paused; pausedLabel(D.pauseTap, U.paused); }
      const cn = N.deaths.length > 0;
      if (D.pauseClose.hidden === cn) D.pauseClose.hidden = !cn;
      if (cn && !D.pauseClose.classList.contains('arm')) setText(D.pauseClose, U.closeNight);
    }
    const ft = playing && armed;
    if (D.flareTag.hidden === ft) D.flareTag.hidden = !ft;
    if (ft) setText(D.flareTagS, U.flareArm);

    if (logDirty && logPanes.length) renderLogs();
  }
  function syncView(sp) {
    view.selected = selected;
    view.mode = mode;
    view.paused = !isRunning();
    view.speed = sp;
    view.isTouch = isTouch;
    view.ghostState = (G && save.settings.ghost && (phase === 'play' || phase === 'intro') && S && S.tick < ghostEnd()) ? G : null;
    const wk = activeWarnKey();
    view.warnPos = wk ? MARK_POS[wk] : null;
    if (view.beat && nowMs > view.beat.until + 200) view.beat = null;
    if (view.aimMark && nowMs > view.aimMark.until) view.aimMark = null;
    // 止まっている間に出して、まだ効いていない命令（描画が点線や輪で見せる）
    const pd = { moves: [], aim: null, flares: [], prone: [], lamps: [], beam: null, treats: [], carries: [], recall: false };
    if (view.recallFlash && nowMs > view.recallFlash.until) view.recallFlash = null;
    if (phase === 'play' && !isRunning()) {
      const m = medic();
      for (const q of queued) {
        if (q.type === 'treat') { const p = sol(q.soldier); const to = lyingAt(p); if (m && to) pd.treats.push({ soldier: q.soldier, medic: m.id, to }); }
        else if (q.type === 'carry') pd.carries.push({ soldier: q.soldier, to: 'hq' });
        else if (q.type === 'recall') pd.recall = true;
        else if (q.type === 'move') pd.moves.push({ soldier: q.soldier, to: q.to });
        else if (q.type === 'aim') pd.aim = { x: q.x, y: q.y };
        else if (q.type === 'flare') pd.flares.push({ x: q.x, y: q.y, kind: q.kind || 'long', r: flareROf(q.kind) });
        else if (q.type === 'prone') pd.prone.push({ soldier: q.soldier, on: q.on });
        else if (q.type === 'lamp') pd.lamps.push({ pos: q.pos, off: q.off });
        else if (q.type === 'beam') pd.beam = { narrow: q.narrow };
      }
    }
    view.pending = pd;
    view.flareKind = flareKind;
    view.flareR = flareROf(flareKind);
  }

  // ---------------------------------------------------------------- main loop（固定の歩幅：stepMs = 50 / speed）
  function frame(now) {
    const dt = lastNow ? clamp(now - lastNow, 0, 1000) : 16;
    lastNow = now; nowMs = now;
    if (intro) introTick(now);
    if (isRunning()) {
      acc += Math.min(dt, 250);
      let steps = 0;
      while (steps < MAX_STEPS) {
        const stepMs = STEP_MS / curSpeed(now);
        if (acc < stepMs) break;
        acc -= stepMs; steps++;
        if (doStep() || !isRunning()) { acc = 0; break; }
      }
      if (steps >= MAX_STEPS) acc = Math.min(acc, STEP_MS / curSpeed(now));
    } else acc = 0;
    if (beatUntil && now >= beatUntil) beatUntil = 0;
    hintTick();
    // タッチの選択は、止まっている間は外さない。動いている間だけ数える
    if (selected && selTouch) { if (isRunning()) selIdle += dt; if (selIdle > SEL_TOUCH_MS) deselect(); }
    const sp = curSpeed(now);
    syncView(sp);
    const alpha = isRunning() ? clamp(acc / (STEP_MS / sp), 0, 1) : 1;
    const evs = frameEvents; frameEvents = [];
    const t0 = tnow();
    RENDER.frame(S, evs, view, alpha, now);
    AUDIO.events(evs, S, sp);
    AUDIO.update(S, view, dt);
    perfSample(tnow() - t0, now);
    const ap = phase === 'title' || ((phase === 'play' || phase === 'intro') && !isRunning());
    if (ap !== audioPausedState) { audioPausedState = ap; AUDIO.setPaused(ap); }
    updateDom(now);
    radioTick(now, dt);
  }
  function loop(now) {
    window.requestAnimationFrame(loop);
    try { frame(now); } catch (e) { if (errCount++ < 5) console.error(e); }
  }

  // ---------------------------------------------------------------- start
  function unlockAudio() { try { AUDIO.unlock(); } catch (e) { /* 音なしでも遊べる */ } }
  function start() {
    C = DAYS[1]; TX = TEXT;
    try { reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reducedMotion = false; }

    save = loadSave();
    hints.seen = save.hints;               // 案内を見たかは保存の hints をそのまま使う（夜の終わりに保存される）
    setDay(save.day);                      // 一日目の指紋は CONTENT のまま（v1 の保存の入力列がそのまま使える）
    D.frame = $('mapframe');
    D.pause = $('pausetag'); D.pauseTap = D.pause.querySelector('.tap'); D.pauseClose = D.pause.querySelector('.close');
    // 地図の上の「一時停止中」の札を押すと再開。「この夜を閉じて」は二度押して決める
    D.pauseTap.addEventListener('click', (ev) => { ev.stopPropagation(); resume(); });
    twoTap(D.pauseClose, () => TX.ui.closeNight, () => TX.ui.closeConfirm, closeNight);
    D.flareTag = $('flaretag'); D.flareTagS = D.flareTag.querySelector('span');
    buildHud(); buildTimeline(); buildCards(); buildCtl(); buildRadio();
    D.built = true;
    const lp = makeLogPane(); $('logbox').appendChild(lp.el); logPanes.push(lp);
    document.title = TX.title.name;

    RENDER.init({ pixel: $('px'), overlay: $('ov'), content: C });
    AUDIO.setVolume(save.settings.volume);
    applyLook();

    D.frame.addEventListener('pointerdown', onMapDown);
    D.frame.addEventListener('pointermove', onMapMove);
    D.frame.addEventListener('pointerup', onMapUp);
    D.frame.addEventListener('pointercancel', onMapCancel);
    D.frame.addEventListener('pointerleave', onMapLeave);
    D.frame.addEventListener('contextmenu', (ev) => ev.preventDefault());
    window.addEventListener('keydown', onKey);
    // 音は最初の操作のハンドラの中で同期的に開ける（毎回呼んでよい）
    window.addEventListener('pointerdown', (ev) => {
      lastPointer = ev.pointerType || 'mouse'; isTouch = lastPointer !== 'mouse'; selIdle = 0; unlockAudio();
      // 重ね板が閉じた直後の押し（二度押しの二度目）は、その後の click ごと捨てる
      if (tnow() < guardUntil) {
        swallowClickUntil = tnow() + 800;
        ev.stopPropagation();
        if (ev.cancelable) ev.preventDefault();
      } else swallowClickUntil = 0;
    }, true);
    window.addEventListener('click', (ev) => {
      if (swallowClickUntil && tnow() < swallowClickUntil && ev.detail > 0) { swallowClickUntil = 0; ev.stopPropagation(); ev.preventDefault(); }
    }, true);
    window.addEventListener('keydown', unlockAudio, true);
    window.addEventListener('touchend', unlockAudio, true);
    document.addEventListener('visibilitychange', () => { if (document.hidden && phase === 'play' && !paused) setPaused(true); });
    window.addEventListener('resize', layout);
    window.addEventListener('orientationchange', layout);
    if (typeof ResizeObserver === 'function') { try { new ResizeObserver(() => layout()).observe($('mapbox')); } catch (e) { /* resize で足りる */ } }

    showTitle();
    layout();
    window.requestAnimationFrame(loop);
  }

  // 確認用（ゲームの規則は変えない）：同じ doStep を同期で回す
  const debug = {
    get state() { return S; }, get ghost() { return G; }, get night() { return N; }, get save() { return save; },
    get phase() { return phase; }, get paused() { return paused; }, view,
    get day() { return day; }, get rec() { return R; }, get content() { return C; }, get tutorialOpen() { return tutorialOpen; },
    get traceReady() { return !!traceBy; }, get sheet() { return sheetOpen; },
    layout() { layout(); },
    advance(n) {
      let i = 0;
      for (; i < (n | 0) && S && !S.over && phase === 'play'; i++) doStep();
      if (RQ.q.length > 2) RQ.q.splice(0, RQ.q.length - 2);     // 飛ばした分の無線は捨てる
      return S ? S.tick : null;
    },
    radio() { return { cur: RQ.cur && RQ.cur.it, q: RQ.q.slice(), hist: RQ.hist.slice() }; },
    get queued() { return queued.slice(); },
    get hints() { return { seen: Object.assign({}, hints.seen), cur: hints.cur ? Object.assign({}, hints.cur) : null, want: Object.keys(hints.want), freeAt: hints.freeAt }; },
    get flareKind() { return flareKind; },
    get mode() { return mode; },
    get selected() { return selected; },
    hintTick() { hintTick(); },
    frame(t) { frame(t); },
    // 入力列 [{t,input}] を、プレイヤーの命令と同じ道（queued → 次の step）で until まで流す
    play(list, until) {
      const by = indexInputs(list);
      while (S && !S.over && phase === 'play' && S.tick < until) {
        const ins = by.get(S.tick);
        if (ins) for (const x of ins) queued.push(x);
        doStep();
      }
      if (RQ.q.length > 2) RQ.q.splice(0, RQ.q.length - 2);
      return S ? S.tick : null;
    },
    runToEnd() { let g = 0; while (S && !S.over && phase === 'play' && g++ < 5000) doStep(); return S ? S.over : null; },
    resume() { if (tutorialOpen) closeTutorial(); if (intro) skipIntro(); setPaused(false); },
    speed(s) { userSpeed = s; },
    // 4.10：夜の最初の 5 秒の一フレームの処理時間の p95（ms。まだ測り終えていなければ null）と、いま「軽く」描いているか
    perf() { return { p95: perf.p95, n: perf.n, low: effQuality() === 'low', auto: perf.low, measuring: !perf.done && perf.start > 0 }; },
    faceOf(w) { return faceOf(w); },
  };

  return { start, fmt, fingerprint, debug };
})();
if (typeof module !== 'undefined') module.exports = UI;

</script>
<script>UI.start()</script>
