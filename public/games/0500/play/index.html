    }
    for (const id of C.soldierOrder) {
      const d = C.soldiers[id], P = C.positions[d.start];
      st.soldiers.push({
        id: id, x: P.x, y: P.y, px: P.x, py: P.y, pos: d.start, from: null, dest: null,
        hp: d.hp, maxHp: d.hp, alive: true, state: 'idle', cause: null,
        firing: false, targetId: null, facing: -Math.PI / 2, rushTo: null, calledBy: null,
        climbUntil: null, lastHit: null, shotN: 0, nextShot: 0, hitEvT: null,
        failBy: null, bleedUntil: null, treatUntil: null, treatBy: null, fetchUntil: null, woundSlot: null,
        rushWhy: null, down: false, carry: null, carriedBy: null,
      });
      st.positions[d.start].occupants.push(id);
    }
    if (contentMap) contentMap.set(st, C);
    const ctx = { st: st, C: C, t: 0, E: [], outs: [] };
    updateSearch(ctx);           // initial on/off, no events kept
    refreshPositions(st, C);
    buildLights(st, C);
    return st;
  }

  // ---------- ② inputs ----------
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function refuse(ctx, input, reason) { mk(ctx, 'refused', { input: input, reason: reason }); }
  function canOrder(C, type) { return Array.isArray(C.orders) && C.orders.indexOf(type) >= 0; }
  function isBool(v) { return v === true || v === false; }
  // a soldier named by a new order: only the ids of soldierOrder (no prototype keys)
  function orderSoldier(st, C, id) { return (typeof id === 'string' && C.soldierOrder.indexOf(id) >= 0) ? sol(st, id) : null; }
  function orderPos(st, C, pos) { return typeof pos === 'string' && C.posOrder.indexOf(pos) >= 0 && has(st.positions, pos); }
  function gonePos(st, pos) { return !!(st.posGone && st.posGone[pos]); }
  function applyInput(ctx, inp) {
    const st = ctx.st, C = ctx.C;
    if (!inp || typeof inp !== 'object') return;
    if (inp.type === 'move') {
      const s = sol(st, inp.soldier);
      const to = inp.to;
      if (!s) return;
      if (!has(C.positions, to) || !has(st.positions, to)) return refuse(ctx, inp, 'unknown');   // no such post ('constructor', '__proto__' too)
      if (gonePos(st, to)) return refuse(ctx, inp, 'gone');                                    // stepped on (3.3)
      if (!s.alive) return refuse(ctx, inp, 'dead');
      if (BUSY[s.state]) return refuse(ctx, inp, 'busy');
      if ((s.state === 'idle' && s.pos === to) || (s.state === 'moving' && s.dest === to)) return refuse(ctx, inp, 'same');
      let n = st.positions[to].occupants.length;
      for (const o of st.soldiers) if (o !== s && o.alive && o.dest === to) n++;
      if (n >= capOf(st, C, to)) return refuse(ctx, inp, 'full');
      if (s.state === 'idle') { s.from = s.pos; leavePos(st, s); }
      s.state = 'moving';
      s.dest = to;
      s.down = false;                       // a move gets him up and walking
      return;
    }
    if (inp.type === 'aim') {
      const S = st.search;
      const x = +inp.x, y = +inp.y;
      if (!isFinite(x) || !isFinite(y)) return;
      if (dist(x, y, S.x, S.y) < 1) return;
      S.target = Math.atan2(y - S.y, x - S.x);
      return;
    }
    if (inp.type === 'flare') {
      // kind: absent means the long one (every v1 input). The wide one needs the day's flare.wide.
      const kind = (inp.kind === undefined || inp.kind === null) ? 'long' : inp.kind;
      if (kind === 'wide' && !(C.flare && C.flare.wide)) return refuse(ctx, inp, 'locked');
      if (kind !== 'long' && kind !== 'wide') return refuse(ctx, inp, 'unknown');
      if (st.flaresLeft <= 0) return refuse(ctx, inp, 'empty');
      let x = +inp.x, y = +inp.y;
      if (!isFinite(x) || !isFinite(y)) return;
      x = Math.max(0, Math.min(C.W, x));
      y = Math.max(0, Math.min(C.H, y));
      const F = kind === 'wide' ? C.flare.wide : C.flare;
      st.flaresLeft--;
      st.flares.push({ x: x, y: y, px: x, py: y, r: F.r, ttl: F.ttl, ttlMax: F.ttl, kind: kind });
      mk(ctx, 'flare', kind === 'wide' ? { x: x, y: y, kind: kind } : { x: x, y: y });
      return;
    }
    if (has(NEW_TYPES, inp.type)) {
      // the new orders. Refusal order: locked -> unknown -> the thing named -> the soldier who acts.
      // a day that does not list one cannot give it, and nothing else is looked at
      if (!canOrder(C, inp.type)) return refuse(ctx, inp, 'locked');
      if (inp.type === 'prone') return orderProne(ctx, inp);
      if (inp.type === 'lamp') return orderLamp(ctx, inp);
      if (inp.type === 'beam') return orderBeam(ctx, inp);
      if (inp.type === 'treat') return orderTreat(ctx, inp);
      if (inp.type === 'carry') return orderCarry(ctx, inp);
      if (inp.type === 'recall') return orderRecall(ctx, inp);
    }
  }
  // 衛生兵を呼ぶ {type:'treat', soldier}: soldier is the one waiting for treatment. The medic runs to that post
  // (rushing, rushWhy 'treat'; st.rush and rushTo are not written: only the first day's eps run moves eps).
  // A patient being carried is going to the dugout, so the medic runs there.
  function orderTreat(ctx, inp) {
    const st = ctx.st, C = ctx.C;
    const p = orderSoldier(st, C, inp.soldier);
    if (!p) return refuse(ctx, inp, 'unknown');
    const to = p.pos || (p.carriedBy ? HQ : null);
    if (to && gonePos(st, to)) return refuse(ctx, inp, 'gone');
    if (!p.alive) return refuse(ctx, inp, 'dead');
    if (p.state !== 'wounded' || !to) return refuse(ctx, inp, 'fine');
    const m = medicOf(st, C);
    if (!m || !m.alive || m.state === 'wounded') return refuse(ctx, inp, 'nomedic');
    if (BUSY[m.state]) return refuse(ctx, inp, 'busy');
    if (m.state === 'idle' && m.pos === to) return refuse(ctx, inp, 'same');
    if (m.state === 'idle') { m.from = m.pos; leavePos(st, m); }
    m.state = 'rushing'; m.dest = to; m.rushWhy = 'treat'; m.rushTo = null; m.calledBy = null; m.down = false;
    mk(ctx, 'treatGo', { medic: m.id, soldier: p.id, to: to });
  }
  // the one lying at s's post that s may carry: not being treated, the smallest id
  function carryable(st, s) {
    if (!s.pos || !st.positions[s.pos]) return null;
    const W = st.positions[s.pos].wounded;
    for (const o of st.soldiers) {
      if (o !== s && o.alive && o.state === 'wounded' && o.pos === s.pos && !o.treatBy && W.indexOf(o.id) >= 0) return o;
    }
    return null;
  }
  // 担いで本部へ {type:'carry', soldier}: soldier (standing idle at a post) carries one lying there to the dugout,
  // at carryWalk. The bleeding deadline keeps running.
  function orderCarry(ctx, inp) {
    const st = ctx.st, C = ctx.C;
    const s = orderSoldier(st, C, inp.soldier);
    if (!s) return refuse(ctx, inp, 'unknown');
    if (!st.positions[HQ] || gonePos(st, HQ)) return refuse(ctx, inp, 'gone');
    if (!s.alive) return refuse(ctx, inp, 'dead');
    if (s.pos === HQ) return refuse(ctx, inp, 'safe');
    const w = carryable(st, s);
    if (!w) return refuse(ctx, inp, 'fine');
    if (s.state !== 'idle') return refuse(ctx, inp, 'busy');
    const pos = s.pos, W = st.positions[pos].wounded;
    s.from = pos; leavePos(st, s);
    s.state = 'carrying'; s.dest = HQ; s.carry = w.id; s.down = false; s.firing = false; s.targetId = null;
    W.splice(W.indexOf(w.id), 1);
    w.pos = null; w.carriedBy = s.id; w.woundSlot = null; w.x = s.x; w.y = s.y;
    mk(ctx, 'carry', { soldier: s.id, wounded: w.id });
  }
  // 戻れ {type:'recall'}: everyone walking (moving, rushing, called, fetching) turns back to the post he came from.
  // A called one comes to (the event's wake). The medic's run is called off (the eps run too: st.rush goes).
  // Carrying soldiers keep going. A post that is gone sends him to the nearest one left.
  function orderRecall(ctx, inp) {
    const st = ctx.st, C = ctx.C, ids = [];
    for (const s of st.soldiers) if (s.alive && RECALL[s.state]) ids.push(s.id);
    if (!ids.length) return refuse(ctx, inp, 'none');
    for (const id of ids) {
      const s = sol(st, id);
      if (s.state === 'called') {
        const c = enemyById(st, s.calledBy);
        wake(ctx, s, c ? c.group : callKeyOf(C));
      } else {
        if (s.state === 'rushing') {
          if (st.rush && st.rush.medic === s.id) { st.rush = null; st.ev.epsClear = null; st.ev.epsRecalled = true; }
          s.rushWhy = null; s.rushTo = null;
        }
        s.state = 'moving';
        s.dest = s.from;
      }
      s.down = false;
      if (!s.dest || !has(st.positions, s.dest) || gonePos(st, s.dest)) s.dest = nearestPost(st, C, s.x, s.y);
    }
    mk(ctx, 'recall', { ids: ids });
  }
  // 伏せろ／起きろ {type:'prone', soldier, on}: a soldier standing idle at a post (not the dugout) lies down or gets up.
  // Lying down: he does not shoot (⑥), enemies at the post strike someone standing first, and an enemy's blow on him is × proneMul.
  function orderProne(ctx, inp) {
    const st = ctx.st, C = ctx.C;
    const s = orderSoldier(st, C, inp.soldier);
    if (!s || !isBool(inp.on)) return refuse(ctx, inp, 'unknown');
    if (s.pos && gonePos(st, s.pos)) return refuse(ctx, inp, 'gone');
    if (!s.alive) return refuse(ctx, inp, 'dead');
    if (s.pos === HQ) return refuse(ctx, inp, 'safe');
    if (s.state !== 'idle' || !s.pos) return refuse(ctx, inp, 'busy');
    if (s.down === inp.on) return refuse(ctx, inp, 'same');
    s.down = inp.on;
    mk(ctx, 'prone', { soldier: s.id, on: inp.on });
  }
  // 灯りを消す／点ける {type:'lamp', pos, off}: the post's lantern. A dark post lights nothing (the tower's beam goes too)
  // and enemies on the road do not stop there. It stays as it is until someone lights it again.
  function orderLamp(ctx, inp) {
    const st = ctx.st, C = ctx.C, pos = inp.pos;
    if (!orderPos(st, C, pos) || !isBool(inp.off)) return refuse(ctx, inp, 'unknown');
    if (gonePos(st, pos)) return refuse(ctx, inp, 'gone');
    if (pos === HQ) return refuse(ctx, inp, 'hq');
    if (!headOf(st, pos)) return refuse(ctx, inp, 'nobody');
    if (st.positions[pos].dark === inp.off) return refuse(ctx, inp, 'same');
    st.positions[pos].dark = inp.off;
    mk(ctx, 'lamp', { pos: pos, off: inp.off });
  }
  // 光を絞る／広げる {type:'beam', narrow}: the beam's width and reach. Off for switchTicks while it changes.
  function orderBeam(ctx, inp) {
    const st = ctx.st, C = ctx.C, S = st.search, N = C.search && C.search.narrow;
    if (!N) return refuse(ctx, inp, 'locked');
    if (!isBool(inp.narrow)) return refuse(ctx, inp, 'unknown');
    if (!st.positions[TOWER] || gonePos(st, TOWER)) return refuse(ctx, inp, 'gone');
    if (S.switchUntil !== null && ctx.t < S.switchUntil) return refuse(ctx, inp, 'busy');
    const mode = inp.narrow ? 'narrow' : 'wide';
    if (S.mode === mode) return refuse(ctx, inp, 'same');
    S.mode = mode;
    S.half = inp.narrow ? N.half : C.search.half;
    S.length = inp.narrow ? N.length : C.search.length;
    S.switchUntil = ctx.t + N.switchTicks;
    mk(ctx, 'beamMode', { mode: mode });
  }

  // ---------- spawning ----------
  function spawnEnemy(ctx, type, x, y, group, path) {
    const st = ctx.st, C = ctx.C, d = C.enemies[type];
    const e = {
      id: st.nextId++, type: type, x: x, y: y, px: x, py: y, hp: d.hp, maxHp: d.hp,
      lit: false, seen: false, revealed: type !== 'mimic', state: path ? 'walk' : 'wait',
      path: path || null, seg: path ? 1 : 0, target: null, dir: 0, born: ctx.t, group: group,
      gone: false, hitEvT: null, sky: false, goal: null,
    };
    if (path) { const p = C.paths[path]; e.dir = Math.atan2(p[1][1] - p[0][1], p[1][0] - p[0][0]); }
    st.enemies.push(e);
    mk(ctx, 'enemySpawn', { id: e.id, kind: type, group: group, x: x, y: y });
    return e;
  }
  function spawnPath(ctx, type, path, group) {
    const p = ctx.C.paths[path][0];
    return spawnEnemy(ctx, type, p[0], p[1], group, path);
  }
  function flee(ctx, e) {
    if (e.gone) return;
    e.gone = true;
    mk(ctx, 'enemyFlee', { id: e.id, kind: e.type, x: e.x, y: e.y });
  }
  function waveOf(C, group) { for (const w of C.waves) if (w.id === group) return w; return null; }
  // first sight / first arrival of a wave (仕様 §8 rows w1n.. and wave_*)
  function groupFirst(ctx, e, how) {
    const C = ctx.C, st = ctx.st;
    const w = waveOf(C, e.group);
    if (!w) return;
    const M = pathMeta(C, w.path);
    const pos = (M && M.pos) || null;
    once(ctx, w.id, null, pos);
    const quietWave = C.events.delta ? C.events.delta.wave : null;     // the big ones up the slope have no wave cue
    if (how === 'seen' && w.id !== quietWave && st.ev.cuedGroups.indexOf(w.id) < 0 && M && M.dir) {
      st.ev.cuedGroups.push(w.id);
      say(ctx, 'wave_' + M.dir, null, pos);
    }
  }

  // a wave sets out down a road whose post is dark with someone standing there: that post's head says so,
  // once a night per post (cue lamp_dark, never a stop)
  function lampDark(ctx, w) {
    const st = ctx.st, M = pathMeta(ctx.C, w.path), pos = M ? M.pos : null;
    if (!pos || !has(st.positions, pos) || !st.positions[pos].dark || st.ev.lampDarkSaid[pos]) return;
    const h = headOf(st, pos);
    if (!h) return;
    st.ev.lampDarkSaid[pos] = true;
    say(ctx, 'lamp_dark', h.id, pos);
  }

  // ---------- lurkers: a pair waits in the dark, anyone walking past within reach is dragged in ----------
  // key: the event (eps). P = content.events[key]: appear/at/end ticks, spot (spots name, default TOWER_BASE),
  // lurkPos (the post they wait under, default tower), dragR, dragKind (default lurker).
  function lurkKind(P) { return P.dragKind || 'lurker'; }
  function lurkPos(P) { return P.lurkPos || TOWER; }
  function lurkSpawn(ctx, key) {
    const C = ctx.C, P = C.events[key];
    for (const p of C.spots[P.spot || 'TOWER_BASE']) spawnEnemy(ctx, lurkKind(P), p.x, p.y, key, null);
    if (headOf(ctx.st, lurkPos(P))) say(ctx, key + '_stir', null, lurkPos(P));    // someone at the post hears it below
  }
  // the pair is one: lit, decided or at the end, they all leave in the same tick
  function lurkersLeave(ctx, key) {
    const P = ctx.C.events[key];
    if (!P) return;
    const kind = lurkKind(P);
    for (const e of ctx.st.enemies) if (!e.gone && e.type === kind && e.group === key) flee(ctx, e);
  }
  // ⑤: anyone walking within reach of an unlit lurker of this event is dragged in. true when someone was
  function lurkDrag(ctx, key) {
    const st = ctx.st, P = ctx.C.events[key], kind = lurkKind(P);
    let dragged = false;
    for (const s of st.soldiers) {
      if (!s.alive || !MOVERS[s.state] || s.hp <= 0) continue;
      for (const e of st.enemies) {
        if (e.gone || e.type !== kind || e.group !== key || e.lit) continue;
        if (dist(s.x, s.y, e.x, e.y) <= P.dragR) {
          s.hp = 0; s.cause = 'dragged'; failMark(s, 'dragged', key, key + '_dark', P.pos);
          dragged = true; break;
        }
      }
    }
    return dragged;
  }
  function lurkLit(ctx, e) {
    const P = ctx.C.events[e.group];
    if (!P) return;
    lurkersLeave(ctx, e.group);
    once(ctx, e.group + '_lit', null, lurkPos(P));
    if (P.litSaves) setOutcome(ctx, e.group, 'saved', null);     // 三日目 mu：照らされて逃げたら saved（subject なし）
  }
  // the lurk events other than the first day's eps (三日目 mu): no medic's run, only those who walk past
  function lurkKeys(C) {
    const out = [];
    for (const k of keysOf(C)) { const P = C.events[k]; if (k !== 'eps' && P && typeof P.dragR === 'number') out.push(k); }
    return out;
  }
  function lurkEvent(ctx, key, P) {
    if (ctx.t === P.appear) lurkSpawn(ctx, key);
    if (ctx.t === P.end) {
      lurkersLeave(ctx, key);
      setOutcome(ctx, key, 'void', null);           // nobody dragged in by then
    }
  }
  // ④ after moveSoldiers: one walking (or who just walked) comes within creakR of an unlit lurker for the first time
  // (mu_creak), or within nearR of the big one while it is on the map (step_near; not one still inside the ring he left).
  // Both stop the first night, a few ticks before the reach: time to call 「戻れ」.
  function nearCues(ctx) {
    const st = ctx.st, C = ctx.C;
    for (const k of lurkKeys(C)) {
      const P = C.events[k];
      if (typeof P.creakR !== 'number' || ctx.t < P.appear || ctx.t >= P.end || st.discovered.indexOf(k + '_creak') >= 0) continue;
      let who = null;
      for (const s of st.soldiers) {
        if (!s.alive || s.hp <= 0 || !(MOVERS[s.state] || s.x !== s.px || s.y !== s.py)) continue;
        for (const e of st.enemies) {
          if (e.gone || e.group !== k || e.type !== lurkKind(P) || e.lit) continue;
          if (dist(s.x, s.y, e.x, e.y) <= P.creakR) { who = s; break; }
        }
        if (who) break;
      }
      if (who) say(ctx, k + '_creak', who.id, lurkPos(P));
    }
    const H = C.huge, h = st.huge;
    if (H && h && typeof H.nearR === 'number' && (h.state === 'walk' || h.state === 'stand') && st.discovered.indexOf('step_near') < 0) {
      for (const s of st.soldiers) {
        if (!s.alive || s.pos || !MOVERS[s.state] || s.hp <= 0) continue;
        if (s.from && FROM_WALK[s.state] && has(st.positions, s.from) && !gonePos(st, s.from)) {
          const P = C.positions[s.from];
          if (dist(s.x, s.y, P.x, P.y) <= P.lamp) continue;
        }
        if (dist(s.x, s.y, h.x, h.y) <= H.nearR) { say(ctx, 'step_near', s.id, null); break; }
      }
    }
  }

  // ---------- eps: the head at the post is wounded and the medic runs from wherever he is ----------
  function epsWound(ctx, key) {
    const st = ctx.st, C = ctx.C, P = C.events[key], pos = P.pos;
    const occ = eventOcc(st, C, pos);
    if (!occ.length) { setOutcome(ctx, key, 'void', null); return; }
    const h = occ[0];
    h.hp = Math.min(h.hp, h.maxHp * P.woundFrac);
    hitSoldier(ctx, h);
    say(ctx, key + '_wound', h.id, pos);
    const m = medicOf(st, C);
    if (!m || !m.alive) { setOutcome(ctx, key, 'void', null); return; }
    if (occ.indexOf(m) >= 0) {
      // the medic is (still) at the post: a step off counts as there, so he stays and sees to the wound
      if (m.state === 'moving') { snapTo(ctx, m, pos); m.state = 'idle'; }
      setOutcome(ctx, key, 'saved', m.id);
      return;
    }
    if (m.state === 'called' || m.state === 'climbing' || m.state === 'holding' ||
        m.state === 'wounded' || m.state === 'treating' || m.state === 'carrying' || m.state === 'fetching') { setOutcome(ctx, key, 'void', m.id); return; }
    if (m.pos) { m.from = m.pos; leavePos(st, m); }
    m.state = 'rushing'; m.dest = pos; m.rushTo = pos; m.calledBy = null; m.rushWhy = key; m.down = false;
    st.rush = { medic: m.id, to: pos };
    say(ctx, key + '_run', m.id, pos);
  }
  function epsEnd(ctx, key) {
    const st = ctx.st;
    lurkersLeave(ctx, key);
    if (st.outcomes[key] === null) {
      const m = medicOf(st, ctx.C);
      // a run called off by 「戻れ」 is saved here without the eps_saved line (he never reached the post)
      if (m && m.alive) setOutcome(ctx, key, 'saved', m.id, !!st.ev.epsRecalled); else setOutcome(ctx, key, 'void', null);
    }
  }
  // the running medic can no longer be dragged: no lurker left, or he is outside their reach and walking away from them
  function clearOfLurkers(st, C, s, key) {
    const P = C.events[key], D = C.positions[s.dest], R = P.dragR, kind = lurkKind(P);
    for (const e of st.enemies) {
      if (e.gone || e.type !== kind || e.group !== key) continue;
      const dx = s.x - e.x, dy = s.y - e.y;
      if (dx * dx + dy * dy <= R * R) return false;
      if (dx * (D.x - s.x) + dy * (D.y - s.y) < 0) return false;     // still closing in
    }
    return true;
  }

  // ---------- callers: a voice in the dark calls the lone soldier at a post ----------
  // key: the event (alpha). P = content.events[key]: appear/at/end ticks, pos, reachR, spot (default WEST_DARK).
  function callKeyOf(C) {
    for (const k of keysOf(C)) { const P = C.events[k]; if (P && typeof P.reachR === 'number') return k; }
    return null;
  }
  function callSpawn(ctx, key) {
    const C = ctx.C, P = C.events[key], sp = C.spots[P.spot || 'WEST_DARK'];
    spawnEnemy(ctx, 'caller', sp.x, sp.y, key, null);
    say(ctx, key + '_whisper', null, P.pos);
  }
  // the called one comes to and walks back to the post he left (may be over cap)
  function wake(ctx, s, key) {
    if (!s.alive || s.hp <= 0 || s.state !== 'called') return;
    const P = key ? ctx.C.events[key] : null;
    s.state = 'moving';
    s.calledBy = null;
    if (!s.from && P) s.from = P.pos;
    s.dest = s.from;
    if (s.dest && gonePos(ctx.st, s.dest)) s.dest = nearestPost(ctx.st, ctx.C, s.x, s.y);
    if (!P) return;
    say(ctx, key + '_wake', s.id, P.pos);
    setOutcome(ctx, key, 'saved', s.id);
  }
  // the called soldier wakes first, then the light is reported (he cannot talk about the face before he comes to)
  function callerGone(ctx, e, lit) {
    const key = e.group, P = ctx.C.events[key];
    if (lit) flee(ctx, e);
    for (const s of ctx.st.soldiers) if (s.alive && s.state === 'called' && s.calledBy === e.id) wake(ctx, s, key);
    if (lit && P) once(ctx, key + '_light', null, P.pos);
  }
  function callAt(ctx, key) {
    const st = ctx.st, P = ctx.C.events[key], pos = P.pos;
    const occ = eventOcc(st, ctx.C, pos);
    let caller = null;
    for (const e of st.enemies) if (!e.gone && e.type === 'caller' && e.group === key) { caller = e; break; }
    // 三日目 nu：呼ぶものが残っていれば、本部を名乗る声が先に流れる（持ち場が空でも）
    if (caller && P.radio) say(ctx, P.radio, null, pos);
    if (!occ.length) { setOutcome(ctx, key, 'void', null); return; }
    if (!caller) { setOutcome(ctx, key, 'saved', occ[0].id); return; }
    if (occ.length >= 2) { say(ctx, key + '_held', occ[0].id, pos); setOutcome(ctx, key, 'saved', occ[0].id); return; }
    const s = occ[0];
    if (s.state !== 'idle' && s.state !== 'moving') { setOutcome(ctx, key, 'void', s.id); return; }
    if (s.pos) { s.from = s.pos; leavePos(st, s); }
    s.state = 'called'; s.dest = null; s.calledBy = caller.id; s.down = false;
    say(ctx, key + '_called', s.id, pos);
  }
  function callEnd(ctx, key) {
    for (const e of ctx.st.enemies) {
      if (!e.gone && e.type === 'caller' && e.group === key) { flee(ctx, e); callerGone(ctx, e, false); }
    }
  }

  // ---------- beta, gamma, delta (the first day) ----------
  function betaRod(ctx) {
    const st = ctx.st, B = ctx.C.events.beta;
    st.ev.rodOut = true;
    const occ = eventOcc(st, ctx.C, B.pos).filter(s => s.state !== 'climbing');
    if (!occ.length) {
      st.ev.repairPending = true;
      say(ctx, 'beta_rod', null, B.pos);
      setOutcome(ctx, 'beta', 'void', null);
      return;
    }
    const s = occ[0];
    release(ctx, s);                     // a medic treating stops; one carrying drops the one he carries
    snapTo(ctx, s, B.pos);
    s.state = 'climbing'; s.down = false;
    s.climbUntil = B.climbUntil;
    st.search.repairUntil = B.climbUntil;
    st.ev.betaClimber = s.id;
    say(ctx, 'beta_rod', s.id, B.pos);
    say(ctx, 'beta_climb', s.id, B.pos);
  }
  function betaJudge(ctx) {
    const st = ctx.st, C = ctx.C, B = C.events.beta;
    if (st.ev.betaClimber === null) return;              // tower was empty at 02:50: nothing happens
    const cl = sol(st, st.ev.betaClimber);
    const tb = st.enemies.filter(e => !e.gone && e.hp > 0 && e.group === B.group);
    buildLights(st, C);                                   // a flare fired this very tick counts
    const anyLit = tb.some(e => litAt(st, C, e.x, e.y, false));
    once(ctx, 'beta_crawlers', null, B.pos);
    if (!cl || !cl.alive || cl.hp <= 0 || cl.state !== 'climbing') { setOutcome(ctx, 'beta', 'void', cl ? cl.id : null); return; }
    const other = eventOcc(st, C, B.pos).some(o => o.id !== cl.id && o.state !== 'climbing');
    if (anyLit || other || tb.length === 0) {
      for (const e of tb) flee(ctx, e);
      setOutcome(ctx, 'beta', 'saved', cl.id);           // -> beta_saved
      return;
    }
    cl.hp -= B.fallDmg;
    hitSoldier(ctx, cl);
    if (cl.hp <= 0) { cl.cause = 'fell'; return; }
    // survived the fall: back on the ground, nothing chased off, the light still needs a climb
    cl.state = 'idle'; cl.climbUntil = null;
    st.search.repairUntil = null;
    st.ev.repairPending = true;
    say(ctx, 'beta_fall_hurt', cl.id, B.pos);
    setOutcome(ctx, 'beta', 'saved', cl.id, true);      // he lived; beta_fall_hurt stands in for beta_saved
  }
  function deltaJudge(ctx) {
    const st = ctx.st, C = ctx.C, D = C.events.delta;
    const occ = eventOcc(st, C, D.pos);
    if (st.ev.deltaSeen) {
      for (const e of st.enemies) {
        if (!e.gone && e.hp > 0 && e.group === D.wave && e.type === D.kind) { e.hp -= D.seenDmg; hitEnemy(ctx, e); }
      }
      setOutcome(ctx, 'delta', 'saved', occ.length ? occ[0].id : null);
      return;
    }
    if (!occ.length) { setOutcome(ctx, 'delta', 'void', null); return; }
    const h = occ[0];
    if (h.state !== 'idle' && h.state !== 'moving') { setOutcome(ctx, 'delta', 'void', h.id); return; }
    snapTo(ctx, h, D.pos);
    h.state = 'holding'; h.down = false;
    st.ev.holder = h.id;
    say(ctx, 'delta_hold', h.id, D.pos);
  }
  function deltaFall(ctx) {
    const st = ctx.st, D = ctx.C.events.delta;
    if (st.ev.holder === null) return;
    const h = sol(st, st.ev.holder);
    if (!h || !h.alive || h.hp <= 0) { setOutcome(ctx, 'delta', 'void', h ? h.id : null); return; }
    h.hp -= D.holdDmg;
    hitSoldier(ctx, h);
    if (h.hp <= 0) { h.cause = 'held_out'; return; }
    h.state = 'idle';
    setOutcome(ctx, 'delta', 'saved', h.id);
  }

  // ---------- 負傷と手当て (3.2) ----------
  // A combat fall at a post, with a living medic, is not death yet: the soldier lies at the post (wounded),
  // out of occupants, and bleeds out at bleedUntil unless the medic, standing idle at that post, treats him.
  // Steps: treatment starts in ④ right after moveSoldiers; it ends, and bleeding kills, at the head of ③.
  // the medic stops treating: the patient bleeds again from this tick
  function untreat(ctx, m) {
    const p = m.treatBy ? sol(ctx.st, m.treatBy) : null, BL = bleedOf(ctx.C);
    if (p && p.alive && p.treatBy === m.id) { p.treatBy = null; p.treatUntil = null; p.bleedUntil = ctx.t + (BL ? BL.bleedTicks : 0); }
    m.treatBy = null; m.treatUntil = null;
  }
  // an event changes s's state: a medic treating stops, one carrying drops (the one carried dies)
  function release(ctx, s) {
    if (s.state === 'treating') { untreat(ctx, s); s.state = 'idle'; }
    if (s.state === 'carrying' && s.carry) {
      const w = sol(ctx.st, s.carry);
      s.carry = null;
      if (w && w.alive) { w.carriedBy = null; woundDie(ctx, w); }
    }
  }
  // one lying (or carried) dies now: the event that laid him down (failBy, with its cause as a 4th element) or wound_lost
  function woundDie(ctx, s) {
    if (!s.alive) return;
    s.hp = 0;
    if (s.failBy && s.failBy[3]) s.cause = s.failBy[3];
    die(ctx, s, 'wound_lost');
  }
  function canWound(ctx, s) {
    if (!bleedOf(ctx.C) || s.cause || !s.pos || !WOUNDABLE[s.state] || !ctx.st.positions[s.pos]) return false;
    const m = medicOf(ctx.st, ctx.C);
    return !!(m && m.alive);
  }
  function goWounded(ctx, s) {
    const st = ctx.st, pos = s.pos, P = st.positions[pos], BL = bleedOf(ctx.C);
    if (s.state === 'treating') untreat(ctx, s);
    const i = P.occupants.indexOf(s.id);
    if (i >= 0) P.occupants.splice(i, 1);
    P.wounded.push(s.id);
    s.woundSlot = i >= 0 ? i : 0;
    s.state = 'wounded'; s.hp = 0; s.down = false; s.firing = false; s.targetId = null; s.climbUntil = null;
    s.bleedUntil = ctx.t + BL.bleedTicks; s.treatBy = null; s.treatUntil = null;
    say(ctx, 'wound_down', s.id, pos);
  }
  // the one carried is laid in the dugout (or wherever the carrier got to): the first slot nobody uses
  function layDown(ctx, w, pos) {
    const st = ctx.st, C = ctx.C, P = st.positions[pos], CP = C.positions[pos], n = (CP.slots || []).length;
    const used = {};
    for (let i = 0; i < P.occupants.length; i++) used[i] = true;
    for (const id of P.wounded) { const o = sol(st, id); if (o && o.woundSlot !== null) used[o.woundSlot] = true; }
    let k = 0;
    while (used[k] && k < n - 1) k++;
    w.pos = pos; w.carriedBy = null; w.woundSlot = k; w.x = CP.x; w.y = CP.y;
    P.wounded.push(w.id);
  }
  // ③ head: treatments that end this tick, then those who bleed out
  function woundTick(ctx) {
    const st = ctx.st, t = ctx.t, BL = bleedOf(ctx.C);
    if (!BL) return;
    for (const m of st.soldiers) {
      if (!m.alive || m.state !== 'treating' || m.treatUntil === null || t < m.treatUntil) continue;
      const p = sol(st, m.treatBy);
      m.state = 'idle'; m.treatBy = null; m.treatUntil = null;
      if (!p || !p.alive || p.state !== 'wounded' || !p.pos) continue;
      const P = st.positions[p.pos], i = P.wounded.indexOf(p.id);
      if (i >= 0) P.wounded.splice(i, 1);
      P.occupants.push(p.id);                  // at the end of the line, over cap if need be
      p.state = 'idle'; p.hp = Math.min(p.maxHp, BL.reviveHp);
      p.woundSlot = null; p.treatBy = null; p.treatUntil = null; p.bleedUntil = null; p.failBy = null;
      say(ctx, 'wound_saved', p.id, p.pos);
    }
    for (const s of st.soldiers) {
      if (s.alive && s.state === 'wounded' && s.bleedUntil !== null && t >= s.bleedUntil) woundDie(ctx, s);
    }
  }
  // ④ right after moveSoldiers: the medic standing idle where someone lies starts on him (smallest id first)
  function treatStart(ctx) {
    const st = ctx.st, BL = bleedOf(ctx.C);
    if (!BL) return;
    const m = medicOf(st, ctx.C);
    if (!m || !m.alive || m.state !== 'idle' || !m.pos) return;
    const P = st.positions[m.pos];
    if (!P.wounded.length || P.occupants.indexOf(m.id) < 0) return;
    let p = null;
    for (const s of st.soldiers) if (s.alive && s.state === 'wounded' && s.pos === m.pos && !s.treatBy && P.wounded.indexOf(s.id) >= 0) { p = s; break; }
    if (!p) return;
    m.state = 'treating'; m.down = false; m.firing = false; m.targetId = null;
    m.treatBy = p.id; m.treatUntil = ctx.t + BL.treatTicks;
    p.treatBy = m.id; p.treatUntil = m.treatUntil; p.bleedUntil = null;
  }
  // ④ after moveEnemies: with nobody standing at the post, an enemy (revealed, on a road) that comes within touch
  // this tick kills one lying there. "Comes": it was outside touch at ① (the one that struck him down, already
  // standing at the stop gap, walks on over him without killing; the next one along does).
  function passByWounded(ctx) {
    const st = ctx.st, C = ctx.C, R = C.rules.touch;
    if (!bleedOf(C)) return;
    for (const s of st.soldiers) {
      if (!s.alive || s.state !== 'wounded' || !s.pos || s.pos === HQ || st.positions[s.pos].occupants.length > 0) continue;
      for (const e of st.enemies) {
        if (e.gone || !e.revealed || !e.path) continue;
        if (dist(e.x, e.y, s.x, s.y) <= R && dist(e.px, e.py, s.x, s.y) > R) { woundDie(ctx, s); break; }
      }
    }
  }

  // ---------- 寄るもの (3.1): small winged ones drawn to light ----------
  // They fly straight (no road), cannot be shot, and burst at what they reach: the soldiers standing at that post
  // share burst between them (no taken, no proneMul); at the dugout the door takes toDoor. A flare burns them.
  // events[key].swarms = [{spot, at, n, gap}]: body i sets out at at + i*gap from the spot (a strip spot puts body i
  // at an even step along it). spots with sky:true are the sky ones: they follow the beam while inside it.
  function isDrawn(C, e) { const d = C.enemies[e.type]; return !!(d && d.shootable === false && !e.path); }
  function spawnDrawn(ctx, key, sw, i) {
    const C = ctx.C, sp = C.spots[sw.spot], f = sw.n > 1 ? i / (sw.n - 1) : 0;
    if (!sp) return;
    let x = sp.x, y = sp.y;
    if (typeof sp.x0 === 'number') x = sp.x0 + (sp.x1 - sp.x0) * f;
    if (typeof sp.y0 === 'number') y = sp.y0 + (sp.y1 - sp.y0) * f;
    const e = spawnEnemy(ctx, 'drawn', x, y, key, null);
    e.state = 'walk';
    e.sky = !!sp.sky;
  }
  function flarePull(C, f) {
    const F = f.kind === 'wide' ? C.flare.wide : C.flare;
    return F && typeof F.pull === 'number' ? F.pull : -1;
  }
  // where one of them heads this tick, from this tick's lights (rebuilt in ④ just before):
  // 1 a burning flare within its pull (nearest; ties: the earlier one), 2 a sky one inside the beam: the beam's source,
  // 3 the nearest light: a lit lantern (posOrder breaks ties) or a hand lantern (last)
  function drawnGoal(st, C, e) {
    let fb = null, fd = 0;
    for (const f of st.flares) {
      const R = flarePull(C, f), d = dist(e.x, e.y, f.x, f.y);
      if (R >= 0 && d <= R && (!fb || d < fd)) { fb = f; fd = d; }
    }
    if (fb) return { k: 'flare', x: fb.x, y: fb.y };
    if (e.sky) {
      for (const L of st.lights) if (L.k === 'beam' && inLight(L, e.x, e.y)) return { k: 'beam', pos: TOWER, x: L.x, y: L.y };
    }
    let g = null, gd = 0;
    for (const L of st.lights) {
      if (L.k !== 'lamp') continue;
      const d = dist(e.x, e.y, L.x, L.y);
      if (!g || d < gd) { g = { k: 'lamp', pos: L.pos, x: L.x, y: L.y }; gd = d; }
    }
    for (const L of st.lights) {
      if (L.k !== 'hand') continue;
      const d = dist(e.x, e.y, L.x, L.y);
      if (!g || d < gd) { g = { k: 'hand', carry: L.carry, x: L.x, y: L.y }; gd = d; }
    }
    return g;
  }
  // a swarm's death in a soldier goes to its event's fail (when the event has one)
  function swarmMark(ctx, s, key, pos) {
    const P = ctx.C.events[key];
    if (P && P.fail) s.failBy = [key, P.fail, pos || P.pos || null];
  }
  function drawnBurst(ctx, e, g) {
    const st = ctx.st, C = ctx.C, D = C.enemies[e.type];
    e.gone = true;
    mk(ctx, 'burst', { id: e.id, x: e.x, y: e.y, k: g.k, pos: g.pos || null, group: e.group });
    if (g.k === 'lamp' && g.pos === HQ) {
      // the dugout: the door takes it (those inside are never struck)
      st.door.hp = Math.max(0, st.door.hp - D.toDoor);
      if (st.ev.doorHitT === null || ctx.t - st.ev.doorHitT >= 4) { st.ev.doorHitT = ctx.t; mk(ctx, 'doorHit', { hp: st.door.hp }); }
      return;
    }
    const pos = g.k === 'hand' ? null : g.pos;
    let hit = [];
    if (g.k === 'hand') { const s = sol(st, g.carry); if (s && s.alive && s.hp > 0) hit = [s]; }
    else if (pos && st.positions[pos]) {
      for (const id of st.positions[pos].occupants) { const s = sol(st, id); if (s && s.alive && s.hp > 0) hit.push(s); }
    }
    if (hit.length) {
      const share = D.burst / hit.length;
      for (const s of hit) {
        s.hp -= share;
        hitSoldier(ctx, s);
        if (s.hp <= 0 && !s.cause) { s.cause = 'swarmed'; swarmMark(ctx, s, e.group, pos); }
      }
      return;
    }
    // nobody standing: one lying there dies (smallest id)
    if (!pos) return;
    for (const s of st.soldiers) {
      if (s.alive && s.state === 'wounded' && s.pos === pos) { s.cause = 'swarmed'; swarmMark(ctx, s, e.group, pos); die(ctx, s, 'wound_lost'); break; }
    }
  }
  function drawnBurn(ctx, e) {
    e.gone = true;
    mk(ctx, 'enemyDie', { id: e.id, kind: e.type, x: e.x, y: e.y, how: 'burn' });
    const id = e.group + '_burn';
    if (idIndex(ctx.C)[id]) once(ctx, id, null, posOfKey(ctx.C, e.group));
  }
  // ④ (head of moveEnemies): each one picks its goal, flies, then bursts or burns where it got to
  function moveDrawn(ctx) {
    const st = ctx.st, C = ctx.C, ended = [];
    for (const e of st.enemies) {
      if (e.gone || !isDrawn(C, e)) continue;
      const D = C.enemies[e.type], g = drawnGoal(st, C, e);
      const was = e.goal ? e.goal.k : null;
      e.goal = g;
      if (!g) continue;
      // the post the swarm first headed for (its head is the saved one's subject); '' for a flare or a hand lantern
      const W = st.ev.sw && st.ev.sw[e.group];
      if (W && W.first === null) W.first = (g.k === 'lamp' || g.k === 'beam') && g.pos ? g.pos : '';
      if (g.k === 'beam' && was !== 'beam') {
        const id = e.group + '_reel';
        if (idIndex(C)[id]) once(ctx, id, null, TOWER);
      }
      const sp = D.speed / TPM, dd = dist(e.x, e.y, g.x, g.y);
      if (dd > 0) e.dir = Math.atan2(g.y - e.y, g.x - e.x);
      if (dd <= sp) { e.x = g.x; e.y = g.y; } else { e.x += (g.x - e.x) / dd * sp; e.y += (g.y - e.y) / dd * sp; }
      const r = dist(e.x, e.y, g.x, g.y);
      if (g.k === 'flare') { if (r <= (D.burnR || 4)) { drawnBurn(ctx, e); ended.push(e.group); } }
      else if (r <= (D.burstR || 8)) { drawnBurst(ctx, e, g); ended.push(e.group); }
    }
    ended.forEach((k, i) => { if (ended.indexOf(k) === i) swarmQuiet(ctx, k); });
  }
  // the last of an event's swarm is gone (and none of it is still setting out): a dark post's head says it is quiet
  function swarmQuiet(ctx, key) {
    const st = ctx.st, C = ctx.C, P = C.events[key];
    for (const e of st.enemies) if (!e.gone && e.group === key && isDrawn(C, e)) return;
    if (P && Array.isArray(P.swarms)) for (const sw of P.swarms) if (ctx.t >= sw.at && ctx.t < sw.at + (sw.n - 1) * sw.gap) return;
    for (const k of C.posOrder) {
      if (k === HQ || gonePos(st, k) || !st.positions[k].dark) continue;
      const h = headOf(st, k);
      if (h) { say(ctx, 'lamp_quiet', h.id, k); return; }
    }
  }

  // ---------- 二日目の出来事 (2.2): a swarm comes; nobody swarmed by it means saved ----------
  // events[key] = {cue?, at, end, pos, fail, swarms, needPos?, fetch?}
  //   cue: key_hum is said. needPos: the outcome needs someone at pos at `at` (zeta: else void).
  //   fetch {spot, fillTicks}: at `at` the dugout's head walks to the spot with a hand lantern (theta).
  // A swarm death (failBy) makes it dead. From `end`, once no body of the swarm is left, the rest is decided.
  function swarmState(st, key) {
    if (!st.ev.sw) st.ev.sw = {};
    return st.ev.sw[key] || (st.ev.sw[key] = { head: null, empty: false, first: null, fetcher: null });
  }
  function fetchKeyOf(C) {
    for (const k of keysOf(C)) { const P = C.events[k]; if (P && P.fetch) return k; }
    return null;
  }
  function swarmLeft(ctx, key, P) {
    for (const e of ctx.st.enemies) if (!e.gone && e.group === key && isDrawn(ctx.C, e)) return true;
    for (const sw of P.swarms || []) if (ctx.t < sw.at + (sw.n - 1) * sw.gap) return true;
    return false;
  }
  // the first one standing at a post (not the dugout), posOrder
  function anyHead(st, C) {
    for (const k of C.posOrder) { if (k === HQ || gonePos(st, k)) continue; const h = headOf(st, k); if (h) return h; }
    return null;
  }
  function swarmEvent(ctx, key, P) {
    const st = ctx.st, C = ctx.C, t = ctx.t, W = swarmState(st, key);
    if (t === P.cue) say(ctx, key + '_hum', null, P.pos || null);
    if (t === P.again) say(ctx, key + '_again', null, P.pos || null);      // 三日目 omi：二本目の前
    if (t === P.at) {
      if (P.fetch) fetchStart(ctx, key, P, W);
      else if (P.needPos && P.pos) {
        const occ = eventOcc(st, C, P.pos);
        W.head = occ.length ? occ[0].id : null;
        W.empty = !occ.length;
      }
    }
    if (t < P.end || st.outcomes[key] !== null || swarmLeft(ctx, key, P)) return;
    if (P.fetch) {
      const f = W.fetcher ? sol(st, W.fetcher) : null;
      if (!f) { setOutcome(ctx, key, 'void', null); return; }
      if (f.state === 'fetching') return;                                   // still out: decided when he is back
      setOutcome(ctx, key, f.alive ? 'saved' : 'dead', f.id, true);
      return;
    }
    if (P.needPos && W.empty) { setOutcome(ctx, key, 'void', null); return; }
    let h = W.head ? sol(st, W.head) : null;
    if (!h || !h.alive || h.state === 'wounded') h = null;
    if (!h && W.first) h = headOf(st, W.first);
    if (!h && P.pos && P.pos !== HQ && st.positions[P.pos]) h = headOf(st, P.pos);
    if (!h) h = anyHead(st, C);
    setOutcome(ctx, key, 'saved', h ? h.id : null);
  }
  // theta: the dugout's head (the from rule, the dugout's ring) goes for water with a hand lantern
  function fetchStart(ctx, key, P, W) {
    const st = ctx.st, C = ctx.C, occ = eventOcc(st, C, P.pos);
    if (!occ.length) return;                        // nobody in the dugout: void at the end
    const h = occ[0];
    if (h.state !== 'idle' && h.state !== 'moving') return;
    if (h.pos) { h.from = h.pos; leavePos(st, h); } else h.from = P.pos;
    if (st.rush && st.rush.medic === h.id) st.rush = null;
    h.state = 'fetching'; h.dest = null; h.fetchUntil = null; h.down = false; h.firing = false; h.targetId = null;
    h.rushTo = null; h.rushWhy = null; h.calledBy = null;
    W.fetcher = h.id;
    say(ctx, key + '_water', h.id, P.pos);
  }
  // ④: out to the spring, fill for fillTicks, back to the post he came from
  function moveFetch(ctx, s) {
    const st = ctx.st, C = ctx.C, key = fetchKeyOf(C), P = key ? C.events[key] : null;
    if (!P) return;
    if (s.fetchUntil !== null) {
      if (ctx.t < s.fetchUntil) return;
      s.fetchUntil = null;
      s.dest = (s.from && has(st.positions, s.from) && !gonePos(st, s.from)) ? s.from : HQ;
      mk(ctx, 'fetch', { soldier: s.id, phase: 'back' });
    }
    const to = s.dest ? C.positions[s.dest] : C.spots[P.fetch.spot];
    const sp = C.rules.walk / TPM, dd = dist(s.x, s.y, to.x, to.y);
    if (dd > 0) s.facing = Math.atan2(to.y - s.y, to.x - s.x);
    if (dd > sp) { s.x += (to.x - s.x) / dd * sp; s.y += (to.y - s.y) / dd * sp; return; }
    s.x = to.x; s.y = to.y;
    if (!s.dest) {
      s.fetchUntil = ctx.t + P.fetch.fillTicks;
      mk(ctx, 'fetch', { soldier: s.id, phase: 'fill', x: s.x, y: s.y });
      return;
    }
    const pos = s.dest;
    arrive(ctx, s);
    say(ctx, key + '_back', s.id, pos);
    setOutcome(ctx, key, 'saved', s.id);
  }

  // ---------- 大きいもの (3.3): walks down from the north slope, stops short of a post, steps on it at a set tick ----------
  // C.huge = {walk:[[tick,x,y],…], crush:[{at,pos,key}], stepR, leaveAt}. Never an enemy: not shot, strikes nobody.
  // st.huge = {x, y, px, py, state:'walk'|'stand'|'leave'|'gone', lit, leg} (leg: the key of the next crush; stays the last one)
  function hugePlace(H, t) {
    const W = H.walk;
    if (!Array.isArray(W) || !W.length || t < W[0][0]) return null;
    for (let i = 0; i + 1 < W.length; i++) {
      const a = W[i], b = W[i + 1];
      if (t < a[0] || t >= b[0]) continue;
      const f = (t - a[0]) / (b[0] - a[0]);
      const moving = a[1] !== b[1] || a[2] !== b[2];
      return {
        x: moving ? a[1] + (b[1] - a[1]) * f : a[1], y: moving ? a[2] + (b[2] - a[2]) * f : a[2],
        state: (typeof H.leaveAt === 'number' && t >= H.leaveAt) ? 'leave' : (moving ? 'walk' : 'stand'),
      };
    }
    const z = W[W.length - 1];
    return { x: z[1], y: z[2], state: 'gone' };
  }
  // the head of ③: where it is this tick, then the crush due this tick (soldiers are where the last ④ left them)
  function hugeTick(ctx) {
    const st = ctx.st, H = ctx.C.huge;
    if (!H) return;
    const p = hugePlace(H, ctx.t);
    if (!p) return;
    if (!st.huge) {
      st.huge = { x: p.x, y: p.y, px: p.x, py: p.y, state: p.state, lit: false, leg: (H.crush && H.crush.length) ? H.crush[0].key : null };
      mk(ctx, 'hugeAppear', { x: p.x, y: p.y });
    } else { st.huge.x = p.x; st.huge.y = p.y; st.huge.state = p.state; }
    for (const c of H.crush || []) if (c.at === ctx.t) hugeCrush(ctx, c);
  }
  // mark a soldier stepped on (and the one he carries, who is on his shoulders)
  function crushMark(st, s, list, failBy) {
    if (!s.alive || list.indexOf(s) >= 0) return;
    s.hp = 0; s.cause = 'crushed'; s.failBy = failBy.slice(); s.down = false;
    list.push(s);
    if (s.carry) { const w = sol(st, s.carry); if (w) crushMark(st, w, list, failBy); }
  }
  function crushAll(ctx, list) { for (const s of list) if (s.alive) die(ctx, s, null); }
  // a crush: everyone counted at the post (the from rule: inside the lamp ring on the way out) and everyone lying there.
  // The post is gone after it: no lamp, cap 0, orders to it 'gone'; whoever was heading there turns to the nearest post left.
  function hugeCrush(ctx, c) {
    const st = ctx.st, C = ctx.C, H = C.huge, pos = c.pos;
    if (!has(st.positions, pos) || gonePos(st, pos)) return;
    const list = [], fb = [c.key, c.key + '_crush', pos];
    for (const s of eventOcc(st, C, pos)) crushMark(st, s, list, fb);
    for (const id of st.positions[pos].wounded.slice()) { const s = sol(st, id); if (s) crushMark(st, s, list, fb); }
    st.posGone[pos] = true;
    const i = H.crush.indexOf(c);
    st.huge.leg = H.crush[Math.min(i + 1, H.crush.length - 1)].key;
    const P = C.positions[pos];
    mk(ctx, 'crush', { pos: pos, key: c.key, x: P.x, y: P.y, ids: list.map((s) => s.id) });
    crushAll(ctx, list);
    for (const s of st.soldiers) {
      if (s.alive && s.dest === pos) s.dest = nearestPost(st, C, s.x, s.y);
    }
    if (pos === HQ) {
      // no door any more: those at it stand where the road ends and wait
      for (const e of st.enemies) if (!e.gone && e.target === 'door') { e.state = 'wait'; e.target = null; }
      if (st.cmdAt === HQ) st.cmdAt = nearestPost(st, C, P.x, P.y);
    }
  }
  // ---------- 三日目の踏まれる持ち場の出来事 (2.3 lam・xi・pi) ----------
  // events[key] = {cues:[{at,id}], at, end, pos, fail, crush:true, fall?}. At `at` the post's head (the from rule) is noted
  // (nobody: void at the end). fall: that head drops off the scaffolding and lies there (手当て待ち, even with no medic),
  // bleeding to fall.bled. At `end` (the crush tick; the crush itself is at the head of ③) a crushed or stepped-on soldier
  // has made it dead already; otherwise saved (the head; with fall, once the one who fell is no longer lying there).
  function crushEvent(ctx, key, P) {
    const st = ctx.st, C = ctx.C, t = ctx.t, W = swarmState(st, key);
    for (const c of P.cues || []) if (c.at === t) say(ctx, c.id, null, P.pos);
    if (t === P.at) {
      const occ = eventOcc(st, C, P.pos);
      W.head = occ.length ? occ[0].id : null;
      W.empty = !occ.length;
      if (occ.length && P.fall) fallDown(ctx, key, P, occ[0]);
    }
    if (t < P.end || st.outcomes[key] !== null) return;
    if (W.empty || !W.head) { setOutcome(ctx, key, 'void', null); return; }
    const h = sol(st, W.head);
    if (P.fall && h && h.alive && h.state === 'wounded') return;           // still lying (or carried): wait
    setOutcome(ctx, key, 'saved', h && h.alive ? h.id : null);
  }
  function fallDown(ctx, key, P, h) {
    const st = ctx.st, BL = bleedOf(ctx.C), pos = P.pos;
    release(ctx, h);                       // a medic treating stops; one carrying drops the one he carries
    snapTo(ctx, h, pos);                   // one stepping out inside the ring is put back and falls (仕様 §4 from 規則)
    const PP = st.positions[pos], i = PP.occupants.indexOf(h.id);
    if (i >= 0) PP.occupants.splice(i, 1);
    PP.wounded.push(h.id);
    h.woundSlot = i >= 0 ? i : 0;
    h.state = 'wounded'; h.hp = 0; h.down = false; h.firing = false; h.targetId = null; h.climbUntil = null;
    h.bleedUntil = ctx.t + (BL ? BL.bleedTicks : 80); h.treatBy = null; h.treatUntil = null;
    h.failBy = [key, P.fall.bled, pos, P.fall.cause];
    hitSoldier(ctx, h);
    say(ctx, P.fall.id, h.id, pos);
  }
  // ④ after moveEnemies: a soldier on the roads within stepR of it (while it is on the map) is stepped on.
  // Not one still inside the lamp ring of the post he left (if that post is still there): the crush of that post decides him.
  function hugeStep(ctx) {
    const st = ctx.st, C = ctx.C, H = C.huge, h = st.huge;
    if (!H || !h || (h.state !== 'walk' && h.state !== 'stand')) return;
    const list = [], fb = [h.leg, h.leg + '_step', null];
    for (const s of st.soldiers) {
      if (!s.alive || s.pos || !MOVERS[s.state] || s.hp <= 0) continue;
      if (s.from && FROM_WALK[s.state] && has(st.positions, s.from) && !gonePos(st, s.from)) {
        const P = C.positions[s.from];
        if (dist(s.x, s.y, P.x, P.y) <= P.lamp) continue;
      }
      if (dist(s.x, s.y, h.x, h.y) <= H.stepR) crushMark(st, s, list, fb);
    }
    if (!list.length) return;
    mk(ctx, 'crush', { pos: null, key: h.leg, x: h.x, y: h.y, ids: list.map((s) => s.id) });
    crushAll(ctx, list);
  }

  // ---------- ③ schedule ----------
  function scheduled(ctx) {
    const st = ctx.st, C = ctx.C, t = ctx.t, EV = C.events;
    if (t >= C.END) {
      st.over = 'dawn';
      st.ambient = 1;
      mk(ctx, 'over', { result: 'dawn' });
      say(ctx, 'dawn', null, null);
      flushOutcomes(ctx);
      return;
    }
    if (t >= C.DAWN) st.ambient = Math.min(1, (t - C.DAWN) / (C.END - C.DAWN));
    if (t === C.DAWN) mk(ctx, 'dawnBegin', {});

    // the big one: where it stands, and the post it steps on this tick (3.3: before everything else in ③)
    hugeTick(ctx);
    // treatments that end, then bleeding out (3.2: the head of ③, right after the big one, before waves and events)
    woundTick(ctx);

    // a climb that ends this tick
    for (const s of st.soldiers) {
      if (s.alive && s.state === 'climbing' && s.climbUntil !== null && t >= s.climbUntil) {
        s.state = 'idle'; s.climbUntil = null;
        if (st.ev.rodOut) {
          st.ev.rodOut = false; st.ev.repairPending = false; st.search.repairUntil = null;
          say(ctx, 'beta_fixed', s.id, EV.beta ? EV.beta.pos : TOWER);
        }
      }
    }

    if (t === EV.hqGag) say(ctx, 'hq_gag', null, HQ);

    if (EV.eps) {
      const P = EV.eps;
      if (t === P.appear) lurkSpawn(ctx, 'eps');
      if (t === P.at) epsWound(ctx, 'eps');
      if (t === P.end) epsEnd(ctx, 'eps');
    }

    // the callers: the first day's alpha, the third day's nu
    for (const k of keysOf(C)) {
      const A = EV[k];
      if (!A || typeof A.reachR !== 'number') continue;
      if (t === A.appear) callSpawn(ctx, k);
      if (t === A.at) callAt(ctx, k);
      if (t === A.end) callEnd(ctx, k);
    }
    // the third day's lurkers (mu) and the posts the big one steps on (lam, xi, pi)
    for (const k of lurkKeys(C)) lurkEvent(ctx, k, EV[k]);
    for (const k of keysOf(C)) { const P = EV[k]; if (P && P.crush) crushEvent(ctx, k, P); }

    if (EV.beta) {
      const B = EV.beta;
      if (t === B.at) betaRod(ctx);
      for (const bt of B.spawns) if (t === bt) spawnPath(ctx, B.kind, B.path, B.group);
      if (t === B.judge) betaJudge(ctx);
      if (st.ev.betaDarkAt !== null && t >= st.ev.betaDarkAt) {
        st.ev.betaDarkAt = null;
        if (!st.ev.betaDarkDone && st.positions[B.pos].occupants.length === 0) {
          st.ev.betaDarkDone = true;
          say(ctx, 'beta_dark', null, B.pos);
        }
      }
    }

    if (EV.gamma && t === EV.gamma.at) {
      spawnPath(ctx, 'mimic', EV.gamma.path, EV.gamma.group);
      say(ctx, 'gamma_radio', null, EV.gamma.pos);
    }

    // the second day's events (and any day's swarm events): the hum, who stands there, the water, the judgment
    if (C.enemies.drawn) {
      for (const k of keysOf(C)) { const P = EV[k]; if (P && Array.isArray(P.swarms) && typeof P.end === 'number') swarmEvent(ctx, k, P); }
    }

    for (const w of C.waves) {
      for (const sp of w.spawn) {
        if (w.at + sp[0] !== t) continue;
        spawnPath(ctx, sp[1], w.path, w.id);
        if (sp === w.spawn[0]) lampDark(ctx, w);
      }
    }

    // the drawn ones (3.1): any event of the day with swarms sets them out (one body per spawn tick)
    if (C.enemies.drawn) {
      for (const k of keysOf(C)) {
        const P = EV[k];
        if (!P || !Array.isArray(P.swarms)) continue;
        for (const sw of P.swarms) {
          const i = (t - sw.at) / sw.gap;
          if (i >= 0 && i < sw.n && i === Math.floor(i)) spawnDrawn(ctx, k, sw, i);
        }
      }
    }

    if (EV.delta) {
      const D = EV.delta;
      if (t === D.cueAt) say(ctx, 'delta_stir', null, D.pos);   // every night, before the big ones can be seen
      if (t === D.judge) deltaJudge(ctx);
      if (t === D.fallAt) deltaFall(ctx);
    }

    // 04:30 of the third day: "me" goes to the bridge (and the bridge takes everyone: capOf)
    if (EV.pi && typeof EV.pi.bridgeCapAt === 'number' && t === EV.pi.bridgeCapAt && EV.pi.cmdTo &&
        has(st.positions, EV.pi.cmdTo) && !gonePos(st, EV.pi.cmdTo)) {
      st.cmdAt = EV.pi.cmdTo;
      mk(ctx, 'cmdMove', { to: st.cmdAt });
    }
    if (t === EV.dawnRally) say(ctx, 'dawn_rally', null, null);
    if (t === C.RETREAT) {
      mk(ctx, 'retreat', {});
      for (const e of st.enemies) flee(ctx, e);
    }
  }

  // ---------- ④ movement ----------
  function moveSearch(ctx) {
    const S = ctx.st.search;
    if (!S.operator) return;               // nobody at the handles
    const d = angDiff(S.target, S.angle), mx = ctx.C.search.turnPerTick;
    S.angle = normAng(S.angle + (Math.abs(d) <= mx ? d : (d > 0 ? mx : -mx)));
  }
  function moveFlares(ctx) {
    const st = ctx.st, C = ctx.C;
    for (const f of st.flares) { f.ttl--; f.y += C.flare.driftPerTick; }
    st.flares = st.flares.filter(f => f.ttl > 0);
  }
  function arrive(ctx, s) {
    const st = ctx.st, C = ctx.C, to = s.dest, why = s.rushWhy;
    const mine = s.state === 'rushing' && st.rush && st.rush.medic === s.id;
    s.pos = to; s.dest = null; s.from = null; s.state = 'idle'; s.rushTo = null; s.rushWhy = null; s.down = false;
    st.positions[to].occupants.push(s.id);
    mk(ctx, 'arrive', { id: s.id, pos: to });
    if (mine) {
      st.rush = null;
      const P = why ? C.events[why] : null;
      if (P && why === 'eps' && to === P.pos) {
        // eps was already decided when he got clear of the lurkers; the arrival line comes now
        if (st.ev.epsClear === s.id) { st.ev.epsClear = null; say(ctx, why + '_saved', s.id, to); }
        else setOutcome(ctx, why, 'saved', s.id);
      }
    }
  }
  function moveSoldiers(ctx) {
    const st = ctx.st, C = ctx.C, R = C.rules;
    for (const s of st.soldiers) {
      if (!s.alive) continue;
      if (s.state === 'moving' || s.state === 'rushing') {
        const P = C.positions[s.dest], sp = R.walk / TPM;
        const dd = dist(s.x, s.y, P.x, P.y);
        if (dd > 0) s.facing = Math.atan2(P.y - s.y, P.x - s.x);
        if (dd <= sp) { s.x = P.x; s.y = P.y; arrive(ctx, s); }
        else { s.x += (P.x - s.x) / dd * sp; s.y += (P.y - s.y) / dd * sp; }
      } else if (s.state === 'carrying') {
        // slow, straight to the dugout; the one carried is where the carrier is
        const P = C.positions[s.dest], sp = carryWalk(C) / TPM;
        const dd = dist(s.x, s.y, P.x, P.y);
        const w = s.carry ? sol(st, s.carry) : null;
        if (dd > 0) s.facing = Math.atan2(P.y - s.y, P.x - s.x);
        if (dd <= sp) {
          const to = s.dest;
          s.x = P.x; s.y = P.y;
          s.carry = null;
          arrive(ctx, s);
          if (w && w.alive) layDown(ctx, w, to);
        } else {
          s.x += (P.x - s.x) / dd * sp; s.y += (P.y - s.y) / dd * sp;
          if (w && w.alive) { w.x = s.x; w.y = s.y; }
        }
      } else if (s.state === 'called') {
        const c = enemyById(st, s.calledBy);
        if (!c || c.gone) { wake(ctx, s, c ? c.group : callKeyOf(C)); continue; }
        const A = C.events[c.group];
        const sp = R.calledWalk / TPM;
        const dd = dist(s.x, s.y, c.x, c.y);
        if (dd > 0) s.facing = Math.atan2(c.y - s.y, c.x - s.x);
        if (dd <= sp) { s.x = c.x; s.y = c.y; } else { s.x += (c.x - s.x) / dd * sp; s.y += (c.y - s.y) / dd * sp; }
        if (A && dist(s.x, s.y, c.x, c.y) <= A.reachR) {
          s.hp = 0; s.cause = 'called'; failMark(s, 'called', c.group, c.group + '_gone', A.pos);
        }
      } else if (s.state === 'fetching') {
        moveFetch(ctx, s);
      }
    }
    // the light waits for a climb: the first idle soldier at the tower goes up
    if (st.ev.rodOut && st.ev.repairPending && C.events.beta) {
      const B = C.events.beta;
      let climbing = false;
      for (const s of st.soldiers) if (s.alive && s.state === 'climbing') climbing = true;
      if (!climbing) {
        for (const id of st.positions[B.pos].occupants) {
          const s = sol(st, id);
          if (s && s.alive && s.state === 'idle') {
            s.state = 'climbing'; s.down = false;
            s.climbUntil = ctx.t + B.repairTicks;
            st.search.repairUntil = s.climbUntil;
            st.ev.repairPending = false;
            say(ctx, 'beta_climb', s.id, B.pos);
            break;
          }
        }
      }
    }
  }
  function moveEnemies(ctx) {
    const st = ctx.st, C = ctx.C, R = C.rules;
    if (C.enemies.drawn) moveDrawn(ctx);
    for (const e of st.enemies) {
      if (e.gone || e.state === 'wait' || !e.path) continue;
      const d = C.enemies[e.type], sp = d.speed / TPM;
      // a soldier walking past within touch range gets attacked (the enemy stops)
      if (e.revealed && d.toSoldier > 0) {
        let v = null, vd = 0;
        for (const s of st.soldiers) {
          if (!s.alive || !MOVERS[s.state]) continue;
          const dd = dist(e.x, e.y, s.x, s.y);
          if (dd <= R.touch && (!v || dd < vd)) { v = s; vd = dd; }
        }
        if (v) { e.state = 'attack'; e.target = v.id; e.dir = Math.atan2(v.y - e.y, v.x - e.x); continue; }
      }
      const pts = C.paths[e.path], tags = C.pathPos[e.path];
      const noDoor = gonePos(st, HQ);           // the dugout was stepped on: the road just ends there (3.3)
      if (e.seg >= pts.length) {
        if (noDoor) { e.state = 'wait'; e.target = null; continue; }
        e.state = 'attack'; e.target = 'door'; continue;
      }
      const wx = pts[e.seg][0], wy = pts[e.seg][1], tag = tags[e.seg];
      let stopFor = null;
      if (tag === HQ) stopFor = noDoor ? null : 'door';
      else if (tag && stopsAt(st, tag)) stopFor = tag;
      const dd = dist(e.x, e.y, wx, wy);
      if (dd > 0) e.dir = Math.atan2(wy - e.y, wx - e.x);
      if (stopFor) {
        const gap = R.stopGap;
        if (dd > gap) {
          const mv = Math.min(sp, dd - gap);
          e.x += (wx - e.x) / dd * mv; e.y += (wy - e.y) / dd * mv;
        }
        if (dist(e.x, e.y, wx, wy) <= gap + 1e-6) {
          e.state = 'attack';
          if (stopFor === 'door') {
            e.target = 'door';
            if (e.type === 'mimic' && !e.revealed) revealMimic(ctx, e, 'door');
          } else {
            e.target = strikeOf(st, stopFor).id;
          }
        } else { e.state = 'walk'; e.target = null; }
      } else {
        if (dd <= sp) { e.x = wx; e.y = wy; e.seg++; }
        else { e.x += (wx - e.x) / dd * sp; e.y += (wy - e.y) / dd * sp; }
        e.state = 'walk'; e.target = null;
      }
    }
  }

  function revealMimic(ctx, e, how) {
    const st = ctx.st, C = ctx.C, key = e.group, G = C.events[key];
    e.revealed = true;
    mk(ctx, 'reveal', { id: e.id, x: e.x, y: e.y });
    if (!G) return;
    if (how === 'light') {
      say(ctx, key + '_reveal', null, G.pos);
      const occ = eventOcc(st, C, G.pos);
      setOutcome(ctx, key, occ.length ? 'saved' : 'void', occ.length ? occ[0].id : null);
    } else if (how === 'door') {
      // the patrol is let in at the door and grabs the first one inside; with nobody inside, the door takes it
      say(ctx, key + '_door', null, HQ);
      const occ = eventOcc(st, C, HQ);
      if (occ.length) {
        const h = occ[0];
        h.hp -= G.grabDmg;
        hitSoldier(ctx, h);
        if (h.hp <= 0) { h.cause = 'grabbed'; st.ev.doorGrab = h.id; }   // -> gamma_door_grab in ⑦
        else setOutcome(ctx, key, 'void', h.id);
      } else {
        st.door.hp = Math.max(0, st.door.hp - G.grabDmg);
        if (st.ev.doorHitT === null || ctx.t - st.ev.doorHitT >= 4) {
          st.ev.doorHitT = ctx.t;
          mk(ctx, 'doorHit', { hp: st.door.hp });
        }
        setOutcome(ctx, key, 'void', null);
      }
    }
  }

  // ---------- ⑤ lights, lit, seen ----------
  function lightPhase(ctx) {
    const st = ctx.st, C = ctx.C, t = ctx.t, EV = C.events;
    updateSearch(ctx);
    refreshPositions(st, C);
    buildLights(st, C);
    const D = EV.delta, B = EV.beta, NU = D ? C.spots.NORTH_UPPER : null, TW = B ? C.positions[B.pos] : null;
    if (st.huge) st.huge.lit = litAt(st, C, st.huge.x, st.huge.y, false);     // for the eye only (3.3)
    for (const e of st.enemies) {
      if (e.gone) continue;
      e.lit = litAt(st, C, e.x, e.y, false);
      if (e.lit && !e.seen) { e.seen = true; groupFirst(ctx, e, 'seen'); }
      if (e.type === 'mimic' && !e.revealed && litAt(st, C, e.x, e.y, true)) revealMimic(ctx, e, 'light');
      if (e.lit && e.type === 'caller') callerGone(ctx, e, true);
      else if (e.lit && EV[e.group] && e.type === lurkKind(EV[e.group])) lurkLit(ctx, e);
      // under the scaffolding only: a group first lit by the dugout lamp is door_TB's
      if (B && e.lit && e.group === B.group && (e.seg <= 1 || dist(e.x, e.y, TW.x, TW.y) <= B.nearR)) once(ctx, 'beta_crawlers', null, B.pos);
      if (D && e.lit && !st.ev.deltaSeen && e.group === D.wave && e.type === D.kind && t >= D.seeFrom && t <= D.seeUntil &&
          e.x >= NU.x0 && e.x <= NU.x1 && e.y >= NU.y0 && e.y <= NU.y1) {
        st.ev.deltaSeen = true;
        say(ctx, 'delta_seen', null, D.pos);
      }
    }
    // gamma: the unrevealed patrol steps into the post's lantern ring
    const G = EV.gamma;
    if (G) {
      const EP = C.positions[G.pos];
      for (const e of st.enemies) {
        if (e.gone || e.type !== 'mimic' || e.revealed) continue;
        if (dist(e.x, e.y, EP.x, EP.y) > G.ring) continue;
        const occ = eventOcc(st, C, G.pos);
        if (!occ.length) continue;
        const h = occ[0];
        h.hp -= G.grabDmg;
        hitSoldier(ctx, h);
        if (h.hp <= 0) h.cause = 'grabbed'; else setOutcome(ctx, 'gamma', 'saved', h.id);
        revealMimic(ctx, e, 'grab');

    const P = EV.eps;
    if (P && t >= P.appear && t < P.end) {
      const dragged = lurkDrag(ctx, 'eps');

      // a drag in this same tick decides it first (dead, in ⑦)
      const m = !dragged && st.rush && st.outcomes.eps === null ? sol(st, st.rush.medic) : null;
      if (m && m.alive && m.hp > 0 && m.state === 'rushing' && m.rushWhy === 'eps' && clearOfLurkers(st, C, m, 'eps')) {
        st.ev.epsClear = m.id;
        setOutcome(ctx, 'eps', 'saved', m.id, true);
      }
    }
    // the third day's lurkers (mu): only those who walk past
    for (const k of lurkKeys(C)) { const L = EV[k]; if (t >= L.appear && t < L.end) lurkDrag(ctx, k); }
  }

  // ---------- ⑥ combat ----------
  // never the lurkers, never one that cannot be shot (the drawn ones: shootable false)
  function pickTarget(st, C, x, y, range, darkR) {
    let best = null, bd = 0, dark = false;
    const no = (e) => e.type === 'lurker' || (C.enemies[e.type] && C.enemies[e.type].shootable === false);
    for (const e of st.enemies) {
      if (e.gone || e.hp <= 0 || no(e) || !e.revealed || !e.lit) continue;
      const d = dist(x, y, e.x, e.y);
      if (d <= range && (!best || d < bd || (d === bd && e.id < best.id))) { best = e; bd = d; }
    }
    if (!best && darkR > 0) {
      for (const e of st.enemies) {
        if (e.gone || e.hp <= 0 || no(e) || !e.revealed || e.lit) continue;
        const d = dist(x, y, e.x, e.y);
        if (d <= darkR && (!best || d < bd || (d === bd && e.id < best.id))) { best = e; bd = d; dark = true; }
      }
    }
    return best ? { e: best, dark: dark } : null;
  }
  function shotGap(R, n, salt) {
    const lo = R.shotGap[0], hi = R.shotGap[1];
    return lo + ((n * 7 + salt * 3) % (hi - lo + 1));
  }
  function combat(ctx) {
    const st = ctx.st, C = ctx.C, R = C.rules, t = ctx.t;
    // enemies strike
    for (const e of st.enemies) {
      if (e.gone || e.hp <= 0 || e.state !== 'attack') continue;
      const d = C.enemies[e.type];
      if (e.target === 'door') {
        if (gonePos(st, HQ)) continue;          // no door any more (3.3)
        st.door.hp -= d.toDoor / TPM;
        if (st.ev.doorHitT === null || t - st.ev.doorHitT >= 4) {
          st.ev.doorHitT = t;
          mk(ctx, 'doorHit', { hp: Math.max(0, st.door.hp) });
        }
        const M = pathMeta(C, e.path);
        if (M && M.door) once(ctx, M.door, null, HQ);
        groupFirst(ctx, e, 'arrive');
      } else if (e.target) {
        if (!e.revealed) continue;
        const s = sol(st, e.target);
        if (!s || !s.alive || s.pos === HQ || s.state === 'wounded') continue;
        const taken = s.pos ? C.positions[s.pos].taken : 1;
        s.hp -= s.down ? d.toSoldier / TPM * taken * proneMul(C) : d.toSoldier / TPM * taken;
        hitSoldier(ctx, s);
        if (s.pos) groupFirst(ctx, e, 'arrive');
      }
    }
    // soldiers shoot
    for (let i = 0; i < st.soldiers.length; i++) {
      const s = st.soldiers[i];
      s.firing = false; s.targetId = null;
      if (!s.alive || !s.pos || s.hp <= 0 || s.down || (s.state !== 'idle' && s.state !== 'holding')) continue;   // lying down: no shooting
      const P = C.positions[s.pos], sd = C.soldiers[s.id];
      const idx = st.positions[s.pos].occupants.indexOf(s.id);
      const lim = typeof P.shooters === 'number' ? P.shooters : P.cap;
      if (idx < 0 || idx >= lim) continue;                 // the third one does not shoot
      const pick = pickTarget(st, C, P.x, P.y, P.range + (sd.rangeAdd || 0), R.darkShot);
      if (!pick) continue;
      const e = pick.e;
      let m = typeof P.dmg === 'number' ? P.dmg : 1;
      if (s.pos === TOWER && st.search.on && st.search.operator === s.id && typeof P.opDmg === 'number') m = P.opDmg;
      if (sd.vsTall && (e.type === 'tall' || e.type === 'mimic')) m *= sd.vsTall;
      if (pick.dark) m *= R.darkMul;
      e.hp -= sd.dpm / TPM * m;
      s.firing = true; s.targetId = e.id;
      s.facing = Math.atan2(e.y - P.y, e.x - P.x);
      hitEnemy(ctx, e);
      if (t >= s.nextShot) {
        const sl = (P.slots && P.slots[idx]) || [0, 0];
        mk(ctx, 'shot', { from: s.id, to: e.id, x1: P.x + sl[0], y1: P.y + sl[1], x2: e.x, y2: e.y,
          heavy: s.pos === 'north', dark: pick.dark, pos: s.pos });
        s.shotN++;
        s.nextShot = t + shotGap(R, s.shotN, i);
      }
    }
    // the one in the dugout who gives the orders ("me")
    const DO = st.cmdAt === HQ ? C.spots.DOOR : C.positions[st.cmdAt], cm = st.cmd;
    cm.firing = false; cm.targetId = null;
    const pk = pickTarget(st, C, DO.x, DO.y, R.cmdRange, 0);
    if (pk) {
      pk.e.hp -= R.cmdDpm / TPM;
      cm.firing = true; cm.targetId = pk.e.id;
      hitEnemy(ctx, pk.e);
      if (t >= cm.nextShot) {
        mk(ctx, 'shot', { from: 'me', to: pk.e.id, x1: DO.x, y1: DO.y, x2: pk.e.x, y2: pk.e.y, heavy: false, dark: false, pos: st.cmdAt });
        cm.shotN++;
        cm.nextShot = t + shotGap(R, cm.shotN, 5);
      }
    }
    // healing
    if (t > 0) {
      const HP = C.positions[HQ];
      if (HP && HP.regenEvery && t % HP.regenEvery === 0) {
        for (const id of st.positions[HQ].occupants.slice()) heal(sol(st, id), 1);
      }
      for (const s of st.soldiers) {
        const sd = C.soldiers[s.id];
        if (!sd.healEvery || !s.alive || !s.pos || s.hp <= 0 || (s.state !== 'idle' && s.state !== 'holding')) continue;
        if (t % sd.healEvery !== 0) continue;
        let w = null;
        for (const o of st.soldiers) {        // id order breaks ties
          if (!o.alive || o.hp <= 0 || o.pos !== s.pos) continue;
          if (!w || o.hp / o.maxHp < w.hp / w.maxHp) w = o;
        }
        if (w && w.hp < w.maxHp) heal(w, 1);
      }
    }
    if (st.door.hp < 0) st.door.hp = 0;
  }

  // ---------- ⑦ deaths, removal, outcomes ----------
  // a soldier dies now (hp at 0). line: the id said for a combat death ('down', or 'wound_lost' for one lying or carried)
  function die(ctx, s, line) {
    const st = ctx.st, C = ctx.C, t = ctx.t, B = C.events.beta;
    const wasPos = s.pos, was = s.state, wasClimb = was === 'climbing';
    const cause = s.cause || 'combat';
    s.alive = false; s.state = 'dead'; s.cause = cause; s.hp = 0; s.down = false;
    if (s.pos) leavePos(st, s);
    if (was === 'wounded' && wasPos && st.positions[wasPos]) {
      const W = st.positions[wasPos].wounded, i = W.indexOf(s.id);
      if (i >= 0) W.splice(i, 1);
    }
    s.dest = null; s.from = null; s.rushTo = null; s.calledBy = null; s.climbUntil = null; s.rushWhy = null;
    s.firing = false; s.targetId = null;
    if (st.rush && st.rush.medic === s.id) st.rush = null;
    // treatment cut short (3.2): the medic falls -> the patient bleeds again from now; the patient dies -> the medic stands up
    if (was === 'treating') untreat(ctx, s);
    else if (s.treatBy) {
      const m = sol(st, s.treatBy);
      if (m && m.state === 'treating' && m.treatBy === s.id) { m.state = 'idle'; m.treatBy = null; m.treatUntil = null; }
    }
    s.treatBy = null; s.treatUntil = null; s.bleedUntil = null; s.woundSlot = null;
    if (s.carriedBy) {
      // the one carried died on the way: the carrier walks on to the dugout
      const c = sol(st, s.carriedBy);
      if (c && c.carry === s.id) { c.carry = null; if (c.alive && c.state === 'carrying') c.state = 'moving'; }
      s.carriedBy = null;
    }
    const carried = was === 'carrying' ? s.carry : null;
    s.carry = null;
    mk(ctx, 'soldierDown', { id: s.id, cause: cause, x: s.x, y: s.y });
    // where the death goes: the soldier's own mark, else the first day's table; a combat death is 'down'
    const f = s.failBy || (cause === 'combat' ? null : (cause === 'grabbed' && st.ev.doorGrab === s.id ? DOOR_GRAB : (FAIL[cause] || null)));
    if (!f) say(ctx, line || 'down', s.id, wasPos);          // every combat death, at the post or on the way (null)
    else { say(ctx, f[1], s.id, f[2]); setOutcome(ctx, f[0], 'dead', s.id); }
    // the water carrier (theta) did not come back
    if (was === 'fetching') { const fk = fetchKeyOf(C); if (fk) setOutcome(ctx, fk, 'dead', s.id); }
    s.fetchUntil = null;
    if (wasClimb && st.ev.rodOut) { st.ev.repairPending = true; st.search.repairUntil = null; }
    if (B && wasPos === B.pos && st.positions[B.pos].occupants.length === 0 && !st.ev.betaDarkDone && st.ev.betaDarkAt === null) {
      st.ev.betaDarkAt = t + B.darkDelay;
    }
    // the carrier fell: the one he carried dies with him (as if bled out)
    if (carried) { const w = sol(st, carried); if (w && w.alive) { w.carriedBy = null; woundDie(ctx, w); } }
  }
  function resolve(ctx) {
    const st = ctx.st, C = ctx.C;
    for (const s of st.soldiers) {
      if (!s.alive || s.hp > 0 || (s.state === 'wounded' && !s.cause)) continue;
      if (canWound(ctx, s)) { goWounded(ctx, s); continue; }
      die(ctx, s, null);
    }
    for (const e of st.enemies) {
      if (e.gone || e.hp > 0) continue;
      e.gone = true;
      mk(ctx, 'enemyDie', { id: e.id, kind: e.type, x: e.x, y: e.y });
      if (e.type === 'caller') callerGone(ctx, e, false);
    }
    st.enemies = st.enemies.filter(e => !e.gone);
    if (st.door.hp < C.rules.doorLowAt) once(ctx, 'door_low', null, HQ);
    flushOutcomes(ctx);
    let alive = 0;
    for (const s of st.soldiers) if (s.alive) alive++;
    // with the dugout stepped on there is no door to fall: only everyone down ends it (3.3)
    if ((st.door.hp <= 0 && !gonePos(st, HQ)) || alive === 0) {
      st.over = 'fallen';
      mk(ctx, 'over', { result: 'fallen' });
      say(ctx, 'fallen', null, null);
    }
    updateSearch(ctx);
    refreshPositions(st, C);
  }

    const C = contentOf(st);

    for (const s of st.soldiers) { s.px = s.x; s.py = s.y; }
    for (const e of st.enemies) { e.px = e.x; e.py = e.y; }
    for (const f of st.flares) { f.px = f.x; f.py = f.y; }
    if (st.huge) { st.huge.px = st.huge.x; st.huge.py = st.huge.y; }

    // ② inputs
    if (inputs) for (const inp of inputs) applyInput(ctx, inp);
    // ③ waves and events due this tick
    scheduled(ctx);
    if (st.over) return ctx.E;
    // ④ movement
    moveSearch(ctx);
    moveFlares(ctx);
    moveSoldiers(ctx);
    treatStart(ctx);
    if (C.huge || lurkKeys(C).length) nearCues(ctx);
    // a day with the drawn ones: rebuild this tick's lights (beam angle, flares, who arrived, lamps put out in ②)
    // so that they pick their goal from them. The first day never does this (its events keep v1's order).
    if (C.enemies.drawn) { updateSearch(ctx); refreshPositions(st, C); buildLights(st, C); }
    moveEnemies(ctx);
    hugeStep(ctx);
    passByWounded(ctx);
    // ⑤ lights, lit, seen
    lightPhase(ctx);
    // ⑥ combat
    combat(ctx);
    // ⑦ deaths, removal, outcomes
    resolve(ctx);
    // ⑧ clock
    st.tick++;
    st.minute = Math.floor(st.tick / TPM);
    return ctx.E;
  }

  function lit(st, x, y) { return litAt(st, contentOf(st), x, y, false); }
  // how many may stand at a post now (0 once it is gone; the bridge takes everyone from 04:30 of the third day)
  function capNow(st, pos) { const C = contentOf(st); return C && has(C.positions, pos) ? capOf(st, C, pos) : 0; }

  return { create: create, step: step, lit: lit, lightOf: lightOf, toTick: toTick, clock: clock, WORDS: WORDS, capOf: capNow, hugePlace: hugePlace };
})();

      if (onSprite(p, mx, my)) direct.push({ s, d: Math.hypot(p.x - mx, (p.y - 4 - my) * 0.6) });
    }
