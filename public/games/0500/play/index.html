  function bufSrc(buf) { A.nodeN++; const s = A.ctx.createBufferSource(); s.buffer = buf; return s; }
  function noise(buf, when, dur, rng) {
    A.nodeN++;
    const s = A.ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    const off = (rng || rnd)() * Math.max(0, buf.duration - 0.05);
    s.start(when, off);
    if (dur != null) s.stop(when + dur);
    return s;
  }
  // 0 → peak（attack 秒）→ ほぼ 0 まで（len 秒でおよそ 5%）
  function env(param, when, peak, attack, len) {
    param.setValueAtTime(0, when);
    param.linearRampToValueAtTime(peak, when + Math.max(0.0005, attack));
    param.setTargetAtTime(0, when + Math.max(0.0005, attack), Math.max(0.001, len / 3));
  }
  // 一音を out に。src→filter→gain(env)→out
  function layer(src, out, filterType, f, q, peak, attack, len, when) {
    const fl = bq(filterType, f, q), g = gn(0);
    src.connect(fl); fl.connect(g); g.connect(out);
    env(g.gain, when, peak, attack, len);
    return { fl, g };
  }
  // 出口：out(gain) → panner → bus。反響・残響へ送る量も
  function outlet(amp, p, bus, rev, echoKey, echoAmt) {
    const out = gn(amp), P = pn(p);
    out.connect(P); P.connect(bus || A.sfx);
    if (rev) { const r = gn(rev); out.connect(r); r.connect(A.revIn); }
    if (echoKey && echoAmt) { const e = gn(echoAmt); out.connect(e); e.connect((A.echo[echoKey] || A.echo.hq)); }
    out.P = P;
    return out;
  }
  // 置いた所から聞く音：聞く場所からの距離で大きさ・左右・反響へ送る量を決める
  //  soft：音量の落ちを半分に（照明弾・命令の音のように、遠くても聞かせたい音）
  function placed(amp, x, y, posKey, rev, echoAmt, soft) {
    const L = A.listen || LISTEN;
    const d = Math.hypot((isFinite(x) ? x : L[0]) - L[0], (isFinite(y) ? y : L[1]) - L[1]);
    const k = soft ? 1 / Math.sqrt(1 + d / 160) : 1 / (1 + d / 160);
    return outlet(amp * k, panX(x), A.sfx, rev, posKey, echoAmt ? echoAmt * (0.7 + d / 300) : 0);
  }
  // 同時発音の管理（銃声と出来事は 16 まで、小さな物音は別に 8 まで。超えたら古い音を止める）
  function addVoice(out, srcs, start, end, small) {
    const v = small ? A.small : A.voices, t = A.ctx.currentTime;
    for (let i = v.length - 1; i >= 0; i--) if (v[i].end < t) v.splice(i, 1);
    while (v.length >= (small ? MAX_SMALL : (lightMode ? MAX_VOICES_LIGHT : MAX_VOICES))) killVoice(v.shift(), t);
    v.push({ out, srcs, start, end });
    let left = srcs.length;
    const done = () => { if (--left <= 0) { try { out.disconnect(); } catch (e) { /* もう外れている */ } } };
    srcs.forEach((s) => { s.onended = done; });
  }
  function killVoice(v, t) {
    try {
      const g = v.out.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(0, t + 0.012);
    } catch (e) { /* 無視 */ }
    v.srcs.forEach((s) => { try { s.stop(t + 0.02); } catch (e) { /* 無視 */ } });
  }
  // 長い音（夜明けの和音・倒れたときの持続音）は reset で止められるように
  function addLong(out, srcs) {
    const G = A;   // onended は後で来る。そのときの A ではなく、作ったときの網を見る
    G.long.push({ out, srcs });
    let left = srcs.length;
    const done = () => {
      if (--left <= 0) {
        try { out.disconnect(); } catch (e) { /* 無視 */ }
        const i = G.long.findIndex((x) => x.out === out);
        if (i >= 0) G.long.splice(i, 1);
      }
    };
    srcs.forEach((s) => { s.onended = done; });
  }
  // 間を空ける（key ごとに gap 秒）
  function okGap(map, key, t, gap) {
    const last = map[key];
    if (last != null && Math.abs(t - last) < gap) return false;
    map[key] = t;
    return true;
  }
  // 値が変わったときだけ setTargetAtTime（毎フレームの呼び出しで予定を積みすぎない）
  function tgt(key, param, v, tau) {
    const L = A.lv;
    if (L[key] !== undefined && Math.abs(L[key] - v) < 1e-4) return;
    L[key] = v;
    param.setTargetAtTime(v, A.ctx.currentTime, tau);
  }

  // ---------------------------------------------------------------- バッファ
  function loopFade(d, L, F) {
    // 長さ L+F で作ったものの末尾 F を頭に重ね、輪にしても継ぎ目が鳴らないようにする
    for (let i = 0; i < F; i++) { const k = i / F; d[i] = d[i] * k + d[L + i] * (1 - k); }
  }
  function makeBuffers(ctx) {
    const sr = ctx.sampleRate, r = mulberry32(SEED_BUF);
    const white = ctx.createBuffer(1, Math.floor(sr * 2), sr);
    { const d = white.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }

    const L = Math.floor(sr * 4), F = Math.floor(sr * 0.25);
    const brown = ctx.createBuffer(1, L, sr);
    {
      const tmp = new Float32Array(L + F); let y = 0, m = 1e-9, mean = 0;
      for (let i = 0; i < L + F; i++) { y = (y + (r() * 2 - 1) * 0.02) * 0.997; tmp[i] = y; mean += y; }
      mean /= (L + F);
      for (let i = 0; i < L + F; i++) { tmp[i] -= mean; m = Math.max(m, Math.abs(tmp[i])); }
      loopFade(tmp, L, F);
      const d = brown.getChannelData(0); for (let i = 0; i < L; i++) d[i] = tmp[i] / m;
    }
    // ささやきの細かい揺れ（−1..1 の段々を少しなめらかに）
    const flutter = ctx.createBuffer(1, L, sr);
    {
      const tmp = new Float32Array(L + F); let v = 0, y = 0, hold = 0;
      for (let i = 0; i < L + F; i++) {
        if (--hold <= 0) { v = r() * 2 - 1; if (r() < 0.12) v = -1; hold = Math.floor(sr * (0.012 + r() * 0.03)); }
        y += (v - y) * 0.004; tmp[i] = y;
      }
      loopFade(tmp, L, F);
      flutter.getChannelData(0).set(tmp.subarray(0, L));
    }
    // 谷の残響（1.9 秒、後ろほど暗い）
    const n = Math.floor(sr * 1.9), pre = Math.floor(sr * 0.014);
    const ir = ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch); let y = 0;
      for (let i = pre; i < n; i++) {
        const k = (i - pre) / (n - pre);
        const a = 0.85 - 0.8 * k;
        y += ((r() * 2 - 1) - y) * a;
        d[i] = y * Math.exp(-(i - pre) / (sr * 0.42));
      }
    }
    const rb = synthRumble(sr), rumble = ctx.createBuffer(1, rb.length, sr);
    rumble.getChannelData(0).set(rb);
    return { white, brown, flutter, ir, rumble };
  }
  // 銃声 v2 のバッファ（一種類 4 本）
  function makeShotKind(G, kind) {
    const ctx = G.ctx, sr = ctx.sampleRate, list = [];
    for (let v = 0; v < 4; v++) {
      const d = synthShot(kind, v, sr), b = ctx.createBuffer(1, d.length, sr);
      b.getChannelData(0).set(d);
      list.push(b);
    }
    G.shotBuf[kind] = list;
  }

  // ---------------------------------------------------------------- 音の網
  function tanhCurve(k, top) {
    const N = 2048, curve = new Float32Array(N), nk = Math.tanh(k) / (top || 1);
    for (let i = 0; i < N; i++) { const x = i / (N - 1) * 2 - 1; curve[i] = Math.tanh(k * x) / nk; }
    return curve;
  }
  function compressor(ctx, th, ratio, knee, attack, release) {
    const c = ctx.createDynamicsCompressor();
    try {
      c.threshold.value = th; c.ratio.value = ratio; c.knee.value = knee;
      c.attack.value = attack; c.release.value = release;
    } catch (e) { /* 古い実装 */ }
    return c;
  }
  // opts.eager：銃声のバッファをその場で全部作る（描き出しと確かめ用）。ゲームでは一フレームに一種類ずつ
  function build(ctx, opts) {
    const G = {
      ctx, voices: [], small: [], long: [], last: {}, lastUi: {}, lastFx: {}, lv: {},
      echo: {}, b: null, nodeN: 0, shotBuf: {}, shotQ: SHOT_KINDS.slice(), shotN: 0, listen: LISTEN.slice(),
      steps: {}, counts: {}, shotNodes: [], lastShot: null,
    };
    const prev = A; A = G;
    try {
      Object.assign(G, makeBuffers(ctx));
      // 全体：軽い歪み（k 1.5）→ 音量 → 最後の段のリミッター（−2 dB、20:1）
      G.limiter = compressor(ctx, -2, 20, 0, 0.0003, 0.1);
      G.limiter.connect(ctx.destination);
      G.master = gn(volume); G.master.connect(G.limiter);
      G.shaper = ctx.createWaveShaper();
      G.shaper.curve = tanhCurve(1.5, 0.9);          // 一番大きくても −0.9 dB（リミッターの持ち上げを足しても −0.3 dB を超えない）
      try { G.shaper.oversample = '2x'; } catch (e) { /* 無視 */ }
      G.pre = gn(0.47);
      G.pre.connect(G.shaper); G.shaper.connect(G.master);

      G.duck = gn(1); G.duck.connect(G.pre);        // 兵が倒れたときの「無音のくぼみ」
      G.ui = gn(1); G.ui.connect(G.pre);            // 画面の音（くぼみ・一時停止の影響なし）
      G.direct = gn(1); G.direct.connect(G.pre);    // くぼみの中で鳴らす鈍い音
      G.sfx = gn(1); G.sfx.connect(G.duck);
      G.bedPause = gn(paused ? 0.251 : 1); G.bedPause.connect(G.duck);   // 一時停止中 −12dB
      G.bed = gn(1); G.bed.connect(G.bedPause);     // 一発ごとに 0.7 倍へ沈める（gain をそのまま使う）

      // 銃の母線：WaveShaper（tanh k=3）→ コンプレッサー（−14 dB、4:1、attack 1 ms）→ 全体
      G.gun = gn(GUN_IN);
      G.gunShaper = ctx.createWaveShaper(); G.gunShaper.curve = tanhCurve(3);
      try { G.gunShaper.oversample = '2x'; } catch (e) { /* 無視 */ }
      G.gunComp = compressor(ctx, -14, 4, 4, 0.001, 0.12);
      G.gunMake = gn(GUN_MAKEUP);                   // コンプのあとの持ち上げ（目標の大きさに合わせる）
      G.gun.connect(G.gunShaper); G.gunShaper.connect(G.gunComp); G.gunComp.connect(G.gunMake); G.gunMake.connect(G.sfx);

      // 残響
      G.revIn = gn(1);
      G.conv = ctx.createConvolver(); G.conv.buffer = G.ir;
      G.revOut = gn(0.5);
      G.revIn.connect(G.conv); G.conv.connect(G.revOut); G.revOut.connect(G.sfx);

      // 持ち場ごとの山の反響：三つの返り（Delay → allpass → lowpass → gain → panner）
      G.echoTaps = {};
      Object.keys(ECHO3).forEach((key) => {
        const e = ECHO3[key], inp = gn(1), taps = [];
        for (let i = 0; i < 3; i++) {
          const dl = ctx.createDelay(1.5), ap = bq('allpass', e.ap[i], 0.7), lp = bq('lowpass', e.lp[i], 0.6), g = gn(e.g[i]), P = pn(e.pan[i]);
          dl.delayTime.value = e.d[i];
          inp.connect(dl); dl.connect(ap); ap.connect(lp); lp.connect(g); g.connect(P); P.connect(G.sfx);
          taps.push({ dl, g, P });
        }
        const rs = gn(0.18); inp.connect(rs); rs.connect(G.revIn);
        G.echo[key] = inp; G.echoTaps[key] = taps;
      });

      buildRadio(G);
      buildBeds(G);
      if (opts && opts.eager) while (G.shotQ.length) makeShotKind(G, G.shotQ.shift());
    } catch (e) {
      warn(e);
      A = prev;
      return null;
    }
    A = prev;
    return G;
  }

  // 無線の搬送波：網に一つだけ（同時に鳴る搬送波は一つ）。1.8 kHz の帯域の雑音と、'fake' のときだけ重ねる砂嵐の層
  function buildRadio(G) {
    const t = G.ctx.currentTime;
    const R = G.radio = { open: false, who: null, level: 0, srcs: [] };
    const s = noise(G.white, t, null, bedRnd), bp = bq('bandpass', 1800, 1.4);
    R.lp = bq('lowpass', 6000, 0.7);
    R.car = gn(0);
    s.connect(bp); bp.connect(R.lp); R.lp.connect(R.car); R.car.connect(G.ui);
    // 砂嵐の層：雑音をゆらぐ段々で刻む
    const s2 = noise(G.white, t, null, bedRnd), bp2 = bq('bandpass', 2600, 0.8), am = gn(0.5);
    const fl = noise(G.flutter, t, null, bedRnd), fg = gn(0.5);
    fl.connect(fg); fg.connect(am.gain);
    R.st = gn(0);
    s2.connect(bp2); bp2.connect(am); am.connect(R.st); R.st.connect(G.ui);
    R.srcs.push(s, s2, fl);
  }

  function buildBeds(G) {
    const ctx = G.ctx, t = ctx.currentTime;
    const B = G.b = {
      lastParam: -1, gustNext: 0, gustLvl: 0.7, gustLp: 420, crkNext: 0, birdNext: 0,
      skitNext: 0, groanNext: t + 2, srcs: [],
    };
    // 鳴りつづける音源。オシレーターはここで start する（noise() はもう start 済み）
    const keep = (s) => { if (s.frequency && s.start) s.start(t); B.srcs.push(s); return s; };

    // 風（常時）
    B.wind = gn(LV.wind * 0.7); B.wind.connect(G.bed);
    B.windLp = []; [-0.6, 0.6].forEach((p, i) => {
      const s = keep(noise(G.brown, t, null, bedRnd));
      const hp = bq('highpass', 38, 0.7), lp = bq('lowpass', i ? 380 : 440, 0.7), P = pn(p), g = gn(i ? 0.9 : 1);
      s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(P); P.connect(B.wind);
      B.windLp.push(lp);
    });
    // 風のすきま鳴り（細い高い音、ごく小さく）
    {
      const s = keep(noise(G.white, t, null, bedRnd)), bp = bq('bandpass', 900, 6), g = gn(0.05);
      s.connect(bp); bp.connect(g); g.connect(B.wind);
      B.whistle = bp;
    }

    // 秋の虫
    B.ins = gn(0); B.ins.connect(G.bed);
    B.insV = INSECTS.map((d) => {
      const o = keep(osc('sine', d.f)); const gate = gn(0); const P = pn(d.pan);
      if (d.am) {
        const am = gn(0.5), lfo = keep(osc(d.wave, d.am)), lg = gn(0.5);
        lfo.connect(lg); lg.connect(am.gain);
        o.connect(am); am.connect(gate);
      } else {
        o.connect(gate);
      }
      gate.connect(P); P.connect(B.ins);
      return { f: d.f, amp: d.amp, pat: d.pat, osc: o, gate, next: 0 };
    });

    // 敵が近いほどの低いうなり
    B.hum = gn(0); B.humLp = bq('lowpass', 90, 0.8);
    {
      const a = keep(osc('sawtooth', 43.65)), b2 = keep(osc('sawtooth', 61.74)), c2 = keep(osc('sine', 87.3));
      const ga = gn(1), gb = gn(0.45), gc = gn(0.5);
      a.connect(ga); b2.connect(gb); c2.connect(gc);
      ga.connect(B.humLp); gb.connect(B.humLp); gc.connect(B.humLp);
      B.humLp.connect(B.hum); B.hum.connect(G.bed);
      // ゆっくり揺らす
      const lfo = keep(osc('sine', 0.13)), lg = gn(6);
      lfo.connect(lg); lg.connect(c2.frequency);
    }

    // 探照灯手の鼻歌（ノコギリ波をフォルマントで声らしく）
    {
      const S = B.sing = { on: false, idx: 0, next: 0 };
      S.o1 = keep(osc('sawtooth', HUM_BASE * 1.5)); S.o2 = keep(osc('triangle', HUM_BASE * 1.5));
      const vib = keep(osc('sine', 5.2)), vg = gn(1.4);
      vib.connect(vg); vg.connect(S.o1.frequency); vg.connect(S.o2.frequency);
      const mix = gn(1);
      // 「ん」と「う」の間くらいの響き。スマホでも聞こえるように 800Hz・2.5kHz を少し強め
      [[380, 4, 1.0], [850, 6, 0.9], [2500, 9, 0.35]].forEach(([f, q, a]) => {
        const fl = bq('bandpass', f, q), g = gn(a); S.o1.connect(fl); fl.connect(g); g.connect(mix);
      });
      const tg = gn(0.12); S.o2.connect(tg); tg.connect(mix);
      const lp = bq('lowpass', 2200, 0.6);
      S.note = gn(0); S.g = gn(0); const P = pn(0.12);
      mix.connect(lp); lp.connect(S.note); S.note.connect(S.g); S.g.connect(P); P.connect(G.bed);
    }

    // 呼ぶもの：左の暗がりのささやき（800–1600Hz の帯域ノイズを細かく揺らす）
    {
      const W = B.wh = { on: false, next: 0, left: 0 };
      const s = keep(noise(G.white, t, null, bedRnd));
      W.bp = bq('bandpass', 1150, 2.2);
      const hp = bq('highpass', 800, 0.7), lp = bq('lowpass', 1600, 0.7);
      W.syl = gn(0);
      const fl = gn(0.6), fsrc = keep(noise(G.flutter, t, null, bedRnd)), fd = gn(0.4);
      fsrc.connect(fd); fd.connect(fl.gain);
      W.g = gn(0); const P = pn(-0.8);
      s.connect(W.bp); W.bp.connect(hp); hp.connect(lp); lp.connect(W.syl); W.syl.connect(fl); fl.connect(W.g); W.g.connect(P); P.connect(G.bed);
    }

    // 照明弾の燃える音
    {
      const s = keep(noise(G.white, t, null, bedRnd));
      const bp = bq('bandpass', 2800, 0.5), lp = bq('lowpass', 380, 0.7), lg = gn(1.6);
      B.crk = gn(0.8); B.flare = gn(0); B.flarePan = pn(0);
      s.connect(bp); bp.connect(B.crk); s.connect(lp); lp.connect(lg); lg.connect(B.crk);
      B.crk.connect(B.flare); B.flare.connect(B.flarePan); B.flarePan.connect(G.bed);
    }

    // 探照灯のアークのうなり（点いている間だけ、ごく小さく）
    {
      const o = keep(osc('sawtooth', 100)), bp = bq('bandpass', 420, 1.5);
      B.arc = gn(0); const P = pn(0.1);
      o.connect(bp); bp.connect(B.arc); B.arc.connect(P); P.connect(G.bed);
    }

    // 林のざわめき（東。風の強さで揺らす）
    {
      const s = keep(noise(G.white, t, null, bedRnd)), bp = bq('bandpass', 2400, 0.5), lp = bq('lowpass', 5200, 0.7), am = gn(0.6);
      const fl = keep(noise(G.flutter, t, null, bedRnd)), fg = gn(0.4);
      fl.connect(fg); fg.connect(am.gain);
      B.forest = gn(0); const P = pn(panX(POS_XY.east[0]) * 0.9);
      s.connect(bp); bp.connect(lp); lp.connect(am); am.connect(B.forest); B.forest.connect(P); P.connect(G.bed);
    }

    // 鳥（夜明け）
    B.birds = gn(1); B.birds.connect(G.bed);
  }

  // ---------------------------------------------------------------- 銃声
  // 銃声 v1：バッファができるまでの代わり。行き先は銃の母線
  function shot(when, kind, p, amp, posKey, dist, dark) {
    const K = KIND[kind] || KIND.rifle;
    const out = outlet(amp, p, A.gun, K.rev, posKey, K.echo);
    const near = clamp(1 - dist / 330, 0.2, 1);
    const jit = R(0.92, 1.08);
    const len = K.tail ? 1.9 : 0.34;
    const src = noise(A.white, when, len);
    // 1. click（0–3ms）
    {
      const hp = bq('highpass', 3000, 0.7), g = gn(0);
      src.connect(hp); hp.connect(g); g.connect(out);
      g.gain.setValueAtTime(K.click * (0.35 + 0.65 * near) * 2, when);
      g.gain.setTargetAtTime(0, when + 0.0015, 0.0008);
    }
    // 2. crack（1–3kHz の破裂、スマホでも軽くならない要）
    layer(src, out, 'bandpass', K.cf * jit, K.cq, K.crack * (dark ? 0.8 : 1) * (0.6 + 0.4 * near), 0.0012, K.cd, when);
    // 3. body（200–600Hz の胴）
    layer(src, out, 'bandpass', K.bf * R(0.9, 1.1), K.bq, K.body, 0.003, K.bd, when);
    // 4. thump（110→45Hz に下がるサイン）
    const o = osc('sine', K.th0);
    {
      const g = gn(0);
      o.frequency.setValueAtTime(K.th0 * R(0.95, 1.05), when);
      o.frequency.exponentialRampToValueAtTime(K.th1, when + K.td);
      o.connect(g); g.connect(out);
      env(g.gain, when, K.thump, 0.002, K.td);
      o.start(when); o.stop(when + K.td * 1.6 + 0.02);
    }
    // 狙撃の尾（谷を転がる低い残り）
    if (K.tail) layer(src, out, 'lowpass', 900, 0.5, K.tail, 0.06, 1.6, when);
    // 5. 山の反響は outlet() で ECHO3[posKey] の網へ送る

      o.frequency.exponentialRampToValueAtTime(f * 0.85, tt + 0.08);
      o.connect(g); g.connect(out); env(g.gain, tt, 1, 0.006, 0.08);
      o.start(tt); o.stop(tt + 0.11); srcs.push(o);
      tt += BR(0.09, 0.15);
    }
    let left = srcs.length;
    srcs.forEach((s) => { s.onended = () => { if (--left <= 0) { try { out.disconnect(); } catch (e) { /* 無視 */ } } }; });
  }

  function retreatFx(when) {
    const out = outlet(0.8, -0.8, A.sfx, 0.3);
    const src = noise(A.white, when, 2.4);
    const hp = bq('highpass', 3000, 0.7), g = gn(0);
    src.connect(hp); hp.connect(g); g.connect(out);
    hp.frequency.setValueAtTime(3000, when); hp.frequency.exponentialRampToValueAtTime(600, when + 2.2);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1.2, when + 0.3); g.gain.setTargetAtTime(0, when + 0.8, 0.5);
    if (out.P.pan) { out.P.pan.setValueAtTime(-0.8, when); out.P.pan.linearRampToValueAtTime(0.8, when + 2.2); }
    addVoice(out, [src], when, when + 2.4);
    skitter(when + 0.1, -0.7, 0.5); skitter(when + 0.45, 0.7, 0.35); skitter(when + 0.85, 0, 0.2);
  }

  function dawnChordFx(when) {
    const out = gn(0.7); out.connect(A.sfx);
    const rs = gn(0.6); out.connect(rs); rs.connect(A.revIn);
    const lp = bq('lowpass', 2000, 0.5); lp.connect(out);
    const srcs = [];
    [146.83, 220.0, 293.66, 369.99, 659.25].forEach((f, i) => {
      const o = osc(i === 4 ? 'sine' : 'triangle', f * (1 + R(-0.002, 0.002))), g = gn(0);
      o.connect(g); g.connect(lp);
      const a = i === 4 ? 0.05 : 0.085;
      g.gain.setValueAtTime(0, when + i * 0.12); g.gain.linearRampToValueAtTime(a, when + 1.6 + i * 0.12);
      g.gain.setValueAtTime(a, when + 3.6); g.gain.setTargetAtTime(0, when + 3.6, 1.2);
      o.start(when); o.stop(when + 9); srcs.push(o);
    });
    addLong(out, srcs);
  }

  function fallenDroneFx(when) {
    const out = gn(0); out.connect(A.sfx);
    const lp = bq('lowpass', 240, 0.8); lp.connect(out);
    lp.frequency.setValueAtTime(240, when); lp.frequency.exponentialRampToValueAtTime(110, when + 9);
    const srcs = [];
    [[41.2, 'sawtooth', 1], [43.65, 'sawtooth', 0.8], [82.41, 'sine', 0.6], [123.47, 'sine', 0.25]].forEach(([f, w, a]) => {
      const o = osc(w, f), g = gn(a); o.connect(g); g.connect(lp); o.start(when); o.stop(when + 14); srcs.push(o);
    });
    const src = noise(A.brown, when, 14), nl = bq('lowpass', 300, 0.7), ng = gn(0.5);
    src.connect(nl); nl.connect(ng); ng.connect(out); srcs.push(src);
    out.gain.setValueAtTime(0, when); out.gain.linearRampToValueAtTime(0.12, when + 2);
    out.gain.setValueAtTime(0.12, when + 5); out.gain.setTargetAtTime(0, when + 5, 2.2);
    addLong(out, srcs);
  }

  // 目立つ出来事の音（短い時間に二度鳴らさない）
  function fx(key, when, gap) { return okGap(A.lastFx, key, when, gap); }

  function isStaticCue(id) {
    try {
      if (typeof TEXT !== 'undefined' && TEXT && TEXT.cues && TEXT.cues[id]) {
        const lines = TEXT.cues[id];
        if (Array.isArray(lines) && lines.length) return lines.some((l) => l && l.who === 'static');
      }
    } catch (e) { /* 既定へ */ }
    return id === 'alpha_whisper';
  }

  // cue の音：物音（炭素棒・つかむ）と 'static' の砂嵐だけ。無線の開閉は UI が行ごとに鳴らす（radioOpen・radioClose）
  function cueFx(ev, when) {
    const id = ev.id || '';
    if (id === 'beta_rod' && fx('arc', when, 0.6)) arcSnapFx(when);
    if (id === 'gamma_grabbed' && fx('grab', when, 0.6)) grabFx(when, ev.pos ? panX(POS_XY[ev.pos] ? POS_XY[ev.pos][0] : 196) : 0.5);
    if (isStaticCue(id) && fx('static', when, 0.5)) staticFx(when, -0.6, 0.6, 1.0);
    if (id === 'wound_saved' && fx('tear', when, 0.5)) { const xy = (ev.pos && POS_XY[ev.pos]) || A.listen; tearFx(when, xy[0], xy[1]); }
    // 光をたどりはじめた群れ：羽音を 4 秒ほど強く高くして塔へ寄せる（wings が読む）
    if (/_reel$/.test(id)) { A.reel = A.reel || {}; A.reel[id.slice(0, -5)] = when + 4; }
    // 水汲み：桶の取っ手が鳴る（出るとき）、桶を下ろす（戻ったとき）
    if (/_water$/.test(id) && fx('pail', when, 0.5)) pailFx(when, 120, 268, false);
    if (/_back$/.test(id) && fx('pail', when, 0.5)) pailFx(when, 120, 268, true);
  }
  // 桶：細い金具の二つ鳴りと木の胴の鈍い音。down なら置く音を低く
  function pailFx(when, x, y, down) {
    const out = placed(0.45, x, y, null, 0.05, 0, true);
    const src = noise(A.white, when, 0.3);
    layer(src, out, 'bandpass', down ? 380 : 520, 1.2, 1.3, 0.003, down ? 0.12 : 0.07, when);
    const a = osc('triangle', 2350), b = osc('triangle', 3120), g = gn(0);
    a.connect(g); b.connect(g); g.connect(out);
    env(g.gain, when + 0.01, down ? 0.08 : 0.16, 0.002, 0.18);
    a.start(when); b.start(when); a.stop(when + 0.25); b.stop(when + 0.25);
    addVoice(out, [src, a, b], when, when + 0.3, true);
    count('pail');
  }
  // 水を汲む：水面をすくう音（低い帯の雑音が二度ふくらむ）
  function scoopFx(when, x, y) {
    const out = placed(0.4, x, y, null, 0.06, 0, true);
    const src = noise(A.white, when, 0.9);
    const c = layer(src, out, 'bandpass', 700, 0.9, 1.0, 0.05, 0.35, when);
    c.fl.frequency.setValueAtTime(500, when); c.fl.frequency.linearRampToValueAtTime(1100, when + 0.3);
    layer(src, out, 'bandpass', 900, 0.8, 0.7, 0.05, 0.3, when + 0.45);
    addVoice(out, [src], when, when + 0.9, true);
    count('scoop');
  }

  // ---------------------------------------------------------------- events
  function events(evs, state, speed) {
    if (!A || !evs || !evs.length) return;
    try { doEvents(evs, state, speed); } catch (e) { warn(e); }
  }

  // 持ち場の位置：state にあればそれ（日ごとの地図）、無ければ一日目の表
  function posXY(state, key) {
    const P = state && state.positions && key ? state.positions[key] : null;
    if (P && typeof P.x === 'number' && typeof P.y === 'number') return [P.x, P.y];
    return POS_XY[key] || null;
  }
  // 聞く場所：「自分」のいる所（本部壕なら扉の内側、ほかはその持ち場）
  function listenAt(state) {
    const k = state && state.cmdAt;
    if (k && k !== 'hq') { const p = posXY(state, k); if (p) return p; }
    return LISTEN;
  }
  // 一つの shot イベント：種類、距離、variant（通し番号から）、山鳴り・薬莢・槓桿・跳弾
  function shotEvent(ev, when, sp, vol, state) {
    const from = ev.from || '?';
    const heavy = !!ev.heavy;
    const kind = from === 'me' ? 'me' : from === 's4' ? 'sniper' : heavy ? 'mg' : 'rifle';
    const posKey = ECHO3[ev.pos] ? ev.pos : 'hq';
    const xy = posXY(state, posKey) || POS_XY.hq;
    const x = typeof ev.x1 === 'number' ? ev.x1 : xy[0], y = typeof ev.y1 === 'number' ? ev.y1 : xy[1];
    const L = A.listen;
    const dist = Math.hypot(x - L[0], y - L[1]);
    const lag = Math.min(0.18, dist / 1200) * (sp < 2 ? 1 : sp < 4 ? 0.5 : 0);
    const D = distFx(dist), K = KLV[kind];
    const amp = vol * D.vol * K.amp, srcAmp = vol * K.amp;
    const p = panX(x), gap = heavy ? 0.05 : 0.07;
    const at = when + lag;
    if (!okGap(A.last, from, at, gap)) return;
    const serial = ++A.shotN;
    const P = { pan: p, amp, src: srcAmp, posKey, dist, dark: ev.dark };
    if (kind === 'mg') {
      const n = sp >= 4 ? 2 : 3 + Math.floor(R(0, 3) * 0.999);
      let tr = at;
      for (let i = 0; i < n; i++) {
        playShot(tr, 'mg', serial + i, Object.assign({}, P, { amp: amp * (i ? R(0.82, 0.95) : 1) }));
        tr += R(0.07, 0.095);
      }
      rumbleFx(at, posKey, vol * D.echo * K.rumble, p);
      if (sp < 4) casingFx(at + R(0.3, 0.5), x, y, posKey, 2);
    } else {
      playShot(at, kind, serial, P);
      rumbleFx(at, posKey, vol * D.echo * K.rumble, p);
      if (sp < 4) casingFx(at + R(0.3, 0.5), x, y, posKey, 1);
      if (kind === 'sniper' && sp < 4) boltFx(at + 0.9, x, y);
    }
    if (ev.dark && serial % 9 === 0) ricochetFx(at + 0.04, typeof ev.x2 === 'number' ? ev.x2 : x, typeof ev.y2 === 'number' ? ev.y2 : y);
  }

  function doEvents(evs, state, speed) {
    const sp = speed > 0 && isFinite(speed) ? speed : 1;
    A.listen = listenAt(state);
    const base = A.ctx.currentTime + 0.03;
    const msPerTick = 50 / sp;
    const vol = sp >= 2 ? 1 / Math.sqrt(sp) : 1;
    let first = Infinity, lastT = -Infinity;
    for (const ev of evs) if (ev && typeof ev.t === 'number') { if (ev.t < first) first = ev.t; if (ev.t > lastT) lastT = ev.t; }
    if (!isFinite(first)) { first = 0; lastT = 0; }
    // 遅れたフレームでまとめて来ても、0.6 秒の中に収める
    const span = (lastT - first) * msPerTick;
    const squeeze = span > 600 ? 600 / span : 1;
    const doorMax = state && state.door && state.door.max > 0 ? state.door.max : 40;
    let flees = 0;

    for (const ev of evs) {
      if (!ev || !ev.type) continue;
      const when = base + Math.max(0, ((typeof ev.t === 'number' ? ev.t : first) - first) * msPerTick * squeeze) / 1000;
      switch (ev.type) {
        case 'shot': shotEvent(ev, when, sp, vol, state); break;
        case 'enemySpawn': {
          const p = panX(ev.x);
          if (ev.kind === 'drawn') break;      // 羽音は update が群れ一つにつき声一つで鳴らす
          if (ev.kind === 'crawler') { if (fx('spawn' + Math.round(p * 4), when, 0.15)) skitter(when, p, 0.55); }
          else if (ev.kind === 'tall') { if (fx('groan', when, 0.8)) groan(when, p, 0.8); }
          else if (ev.kind === 'lurker') { if (fx('lurk', when, 0.3)) skitter(when, p, 0.14); }
          break;
        }
        case 'enemyHit': if (fx('ehit', when, 0.045)) thwack(when, panX(ev.x), 0.35 * vol); break;
        case 'enemyDie':
          if (ev.kind === 'drawn') { if (fx('burn', when, 0.05)) burnFx(when, ev.x, ev.y); }
          else if (fx('die', when, 0.06)) deathFx(when, ev.kind, panX(ev.x));
          break;
        case 'burst': if (fx('burst', when, 0.07)) burstFx(when, ev.x, ev.y); break;
        case 'enemyFlee':
          if (flees < 3 && fx('flee', when, 0.08)) { flees++; fleeFx(when, panX(ev.x), ev.kind === 'caller' ? 0.85 : 0.5, false); }
          break;
        case 'reveal': if (fx('reveal', when, 0.5)) stingFx(when, panX(ev.x)); break;
        case 'soldierHit': if (fx('shit' + (ev.id || ''), when, 0.12)) soldierHitFx(when, panX(ev.x)); break;
        case 'soldierDown': downFx(when, ev.cause, panX(ev.x)); break;
        case 'doorHit': if (fx('door', when, 0.12)) doorFx(when, (typeof ev.hp === 'number' ? ev.hp : doorMax) / doorMax); break;
        case 'flare': flarePopFx(when, ev.x, ev.y, ev.kind === 'wide'); break;
        case 'searchOff':
          A.offWhy = ev.reason;
          if (ev.reason === 'rod') { if (fx('arc', when, 0.6)) arcSnapFx(when); }
          else if (ev.reason === 'switch') { /* 絞りの金具（beamMode）と唸りの落ちだけ */ }
          else if (fx('power', when, 0.3)) powerFx(when, false);
          break;
        case 'searchOn':
          if (A.offWhy === 'switch') { if (fx('power', when, 0.3)) layerClick(when); }
          else if (fx('power', when, 0.3)) powerFx(when, true);
          A.offWhy = null;
          break;
        case 'lamp': {
          const xy = posXY(state, ev.pos) || A.listen;
          if (fx('lamp' + ev.pos, when, 0.1)) lampFx(when, xy[0], xy[1], ECHO3[ev.pos] ? ev.pos : null, !!ev.off);
          break;
        }
        case 'beamMode': if (fx('shutter', when, 0.15)) shutterFx(when); break;
        case 'prone': {
          const s = state && (state.soldiers || []).find((x) => x && x.id === ev.soldier);
          const ok = s && typeof s.x === 'number';
          if (fx('prone' + ev.soldier, when, 0.1)) proneFx(when, ok ? s.x : A.listen[0], ok ? s.y : A.listen[1], !!ev.on);
          break;
        }
        case 'treatGo': {
          const s = state && (state.soldiers || []).find((x) => x && x.id === ev.medic);
          if (fx('bag', when, 0.3)) bagFx(when, s ? s.x : A.listen[0], s ? s.y : A.listen[1]);
          break;
        }
        case 'carry': {
          const s = state && (state.soldiers || []).find((x) => x && x.id === ev.soldier);
          if (fx('lift', when, 0.3)) liftFx(when, s ? s.x : A.listen[0], s ? s.y : A.listen[1]);
          break;
        }
        case 'recall': if (fx('whistle', when, 0.4)) whistleFx(when); break;
        case 'crush': if (fx('crush', when, 0.3)) crushFx(when, typeof ev.x === 'number' ? ev.x : 120, typeof ev.y === 'number' ? ev.y : 150, !!ev.pos); break;
        case 'fetch': if (ev.phase === 'fill' && fx('scoop', when, 0.5)) scoopFx(when, typeof ev.x === 'number' ? ev.x : 184, typeof ev.y === 'number' ? ev.y : 288); break;
        case 'cue': cueFx(ev, when); break;
        case 'dawnBegin': birdCall(when + 0.4, 0.6, LV.bird * 0.7); break;
        case 'retreat': if (fx('retreat', when, 1.5)) retreatFx(when); break;
        case 'over':
          if (ev.result === 'dawn') { dawnChordFx(when); birdCall(when + 0.8, -0.5, LV.bird); birdCall(when + 1.9, 0.7, LV.bird * 0.8); }
          else if (ev.result === 'fallen') fallenDroneFx(when);
          break;
        default: break;   // arrive / logDiscover / outcome / refused は音なし（refuse は UI が ui('refuse') で鳴らす）
      }
    }
  }

  // ---------------------------------------------------------------- 環境音（update）
  function scan(state) {
    const es = state.enemies || [], ss = state.soldiers || [];
    const pts = [[120, 260]];
    for (const s of ss) if (s && s.alive && typeof s.x === 'number') pts.push([s.x, s.y]);
    let best = 1e9, nc = 0, ncx = 120, nt = 0, ntx = 120;
    for (const e of es) {
      if (!e || typeof e.x !== 'number') continue;
      let d = 1e9;
      for (const p of pts) { const dx = e.x - p[0], dy = e.y - p[1], dd = Math.sqrt(dx * dx + dy * dy); if (dd < d) d = dd; }
      const w = e.type === 'lurker' ? d + 30 : d;
      if (w < best) best = w;
      if (e.type === 'crawler' && d < 56) { nc++; ncx = e.x; }
      if ((e.type === 'tall' || (e.type === 'mimic' && e.revealed)) && d < 100) { nt++; ntx = e.x; }
    }
    return { prox: clamp((115 - best) / 95, 0, 1), nc, ncx, nt, ntx };
  }

  function update(state, view, dtMs) {
    if (!A) return;
    // 銃声 v2 のバッファは一フレームに一種類ずつ作る（できるまでは v1 の音）
    if (A.shotQ.length) { try { makeShotKind(A, A.shotQ.shift()); } catch (e) { warn(e); A.shotQ.length = 0; } }
    if (!state) return;
    A.listen = listenAt(state);
    try { beds(state); } catch (e) { warn(e); }
    try { footsteps(state, view || {}); } catch (e) { warn(e); }
    try { woundTones(state, view || {}); } catch (e) { warn(e); }
    try { ravineBed(state); } catch (e) { warn(e); }
    try { wings(state, view || {}); } catch (e) { warn(e); }
    try { hugeBed(state); hugeSteps(state, view || {}); } catch (e) { warn(e); }
  }
  // 手当て待ち（手当てを受けていない）兵ごとに、ゲームの 1 分が替わるたびに一音。止まっている間・夜の終わりは鳴らさない
  function woundTones(state, view) {
    const W = A.wtone || (A.wtone = {});
    const quiet = !!view.paused || paused || !!state.over;
    const min = Math.floor((+state.tick || 0) / 10);
    for (const s of state.soldiers || []) {
      if (!s || !s.alive || s.state !== 'wounded' || s.treatBy || typeof s.x !== 'number') { if (s) delete W[s.id]; continue; }
      if (W[s.id] === undefined) { W[s.id] = min; continue; }
      if (W[s.id] === min) continue;
      W[s.id] = min;
      if (!quiet) woundToneFx(A.ctx.currentTime + 0.01, s.x, s.y);
    }
  }

  // 足音：moving 0.24 s、rushing 0.16 s、called 0.42 s（2 歩に 1 歩を弱く）。x4 以上と一時停止中・夜の終わりは鳴らさない
  function footsteps(state, view) {
    const t = A.ctx.currentTime, M = A.steps;
    const sp = view.speed > 0 && isFinite(view.speed) ? view.speed : 1;
    const quiet = !!view.paused || paused || sp >= 4 || !!state.over;
    const live = {};
    for (const s of state.soldiers || []) {
      if (!s || !s.alive || typeof s.x !== 'number') continue;
      const gap = STEP[s.state];
      if (!gap || quiet) continue;
      live[s.id] = true;
      let m = M[s.id];
      if (!m || m.state !== s.state) { m = M[s.id] = { state: s.state, next: t + 0.02, n: 0 }; }
      if (m.next < t - 0.25) m.next = t + 0.02;     // 長く止まっていた
      let guard = 0;
      while (m.next < t + 0.06 && guard++ < 4) {
        const weak = s.state === 'called' && (m.n % 2 === 1);
        stepFx(Math.max(m.next, t + 0.005), s.x, s.y, weak);
        m.n++;
        m.next += gap / Math.min(sp, 2);
      }
    }
    for (const id of Object.keys(M)) if (!live[id]) delete M[id];
  }

  function beds(state) {
    const t = A.ctx.currentTime, B = A.b, TT = times();
    const tick = +state.tick || 0, over = state.over || null, amb = clamp(+state.ambient || 0, 0, 1);
    const fallen = over === 'fallen';
    const sc = scan(state);
    const s = state.search || {};

    if (t - B.lastParam >= 0.05 || t < B.lastParam) {
      B.lastParam = t;
      // 風
      if (t >= B.gustNext) { B.gustNext = t + BR(1.5, 4.5); B.gustLvl = BR(0.45, 1); B.gustLp = BR(260, 700); }
      tgt('wind', B.wind.gain, LV.wind * B.gustLvl * (fallen ? 1.3 : 1) * (1 - 0.3 * amb), 1.2);
      tgt('windlp0', B.windLp[0].frequency, B.gustLp, 1.5);
      tgt('windlp1', B.windLp[1].frequency, B.gustLp * 0.85, 1.7);
      tgt('whistle', B.whistle.frequency, 700 + B.gustLp * 0.8, 1.5);
      // 東の林：突風で強く
      tgt('forest', B.forest.gain, fallen ? 0 : LV.forest * (0.3 + 0.7 * B.gustLvl * B.gustLvl) * (1 - 0.4 * amb), 0.9);
      // 秋の虫：22 時台は濃く、敵が近いと止む、夜明けで消える
      let base;
      if (tick < TT.t2300) base = 1;
      else if (tick < TT.t0100) base = 1 - 0.45 * (tick - TT.t2300) / (TT.t0100 - TT.t2300);
      else base = 0.55;
      const insL = fallen ? 0 : LV.ins * base * (1 - clamp(sc.prox * 1.7, 0, 1)) * (1 - amb);
      tgt('ins', B.ins.gain, insL, insL < (A.lv.ins || 0) ? 0.3 : 2.2);
      // 低いうなり
      // 本部壕の中で聞く低いうなり。三日目の pi_order のあと（本部が吊り橋へ出たあと）は止める
      tgt('hum', B.hum.gain, over || state.cmdAt === 'bridge' ? 0 : LV.hum * Math.pow(sc.prox, 1.4) * (sc.nt ? 1.15 : 1), 0.6);
      tgt('humlp', B.humLp.frequency, 70 + 230 * sc.prox, 0.6);
      // 照明弾
      let fl = 0, fx2 = 0;
      for (const f of state.flares || []) {
        if (!f) continue;
        const a = clamp((f.ttl || 0) / 10, 0, 1); fl += a; fx2 += a * (typeof f.x === 'number' ? f.x : 120);
      }
      tgt('flare', B.flare.gain, over ? 0 : LV.flare * Math.min(1.6, fl), 0.15);
      if (fl > 0 && B.flarePan.pan) tgt('flarepan', B.flarePan.pan, panX(fx2 / fl), 0.3);
      // アークのうなり
      // 塔の灯りを消すと 0.4 秒で落ち、光の太さを替える間は一度落ちて戻る
      tgt('arc', B.arc.gain, s.on && !over ? LV.arc : 0, s.on ? 0.15 : s.off === 'dark' ? 0.13 : s.off === 'switch' ? 0.06 : 0.03);
    }

  // 出来事の失敗の id（表で fail で、その key のもの）
  function hasFail(k) { for (const id of failIds[k] || []) if (R.journal[id]) return true; return false; }
  function failRec(k) {
    let best = null;
    for (const id of failIds[k] || []) { const r = R.journal[id]; if (r && isNum(r.t) && (!best || r.t < best.t)) best = r; }
    return best;
  }
  function recordable(id) {
    const row = idRow[id];
    if (!row || !row.key || !/_saved$/.test(id)) return true;
    return hasFail(row.key);
  }

  // ---------------------------------------------------------------- tonight
  function freshNight(n) {
    return {
      n, deaths: [], log: [], disc: {}, heard: {}, outcomes: {}, outSubj: {}, pausedIds: {}, beats: {}, beatDone: {},
      warned: {}, knownPrev: {}, idleItems: {}, committed: false, quiet: {},
    };
  }
  function idVisible(id) { return !!(revealed[id] || (N && N.disc[id])); }
  function keyVisible(k) { const l = idsByKey[k] || []; for (const id of l) if (idVisible(id)) return true; return false; }
  function revealAll() { revealed = {}; for (const id in R.journal) revealed[id] = true; }
  function nextMarkKey(after) {
    let best = null;
    for (const k of KEYS) if (keyVisible(k) && MARK_T[k] > after && (!best || MARK_T[k] < MARK_T[best])) best = k;
    return best;
  }
  function lastNightRec() { return R.nights.length ? R.nights[R.nights.length - 1] : null; }
  function markStatus(k) {
    if (N.beats[k]) return 'saved';
    const out = S.outcomes ? S.outcomes[k] : null;
    if (out === 'dead') return 'lost';
    const pn = N.committed ? null : prevNight;
    const po = pn && pn.outcomes ? pn.outcomes[k] : null;
    if (po === 'dead') return 'lost';
    if (out === 'saved' || po === 'saved') return 'saved';
    return '';
  }
  function activeWarnKey() {
    if (!N || !S || phase !== 'play') return null;
    for (const k of KEYS) if (N.warned[k] && S.tick < MARK_T[k] + 30) return k;
    return null;
  }
  function prevGhosts() { return N ? R.ghosts.filter((g) => g.night === N.n - 1) : []; }

  // 文字一つだけのボタン（兵の命令の段と「光を絞る」）

  function makeLogPane() {

  // ---------------------------------------------------------------- 当直日誌 and found records
  // 同じ時刻の行は id 表の順（原因が先、結果が後）
  function allRecords() {
    const m = {};
    for (const id in R.journal) m[id] = R.journal[id];
    if (N && !N.committed) for (const id in N.disc) if (!(id in m)) m[id] = N.disc[id];
    return Object.keys(m)
      .filter((id) => idRow[id] && idRow[id].log && TX.log[id])
      .map((id) => ({ id, t: m[id].t, pos: m[id].pos || null }))
      .sort((a, b) => a.t - b.t || idIdx[a.id] - idIdx[b.id]);
  }
  // 日誌の一行。{pos} を持つのは down だけ（倒れた持ち場。日誌用の名 logPos があればそれ、無ければ移動中）
  function logText(id, pos) {
    const s = TX.log[id] || '';
    if (s.indexOf('{pos}') < 0) return s;
    const name = pos ? ((TX.logPos && TX.logPos[pos]) || TX.positions[pos]) : null;
    return fmt(s, { pos: name || TX.ui.enRoute });
  }
  function keyDot(row) {
    if (!row.key) return null;
    const k = el('span', 'k'); k.style.background = ROLE[KEY_ROLE[row.key]] || '#ccc';
    return k;
  }
  function logLine(t, id, cls, pos) {
    const row = idRow[id] || {};
    const p = el('p', (cls || '') + (row.fail ? ' fail' : ''));
    p.appendChild(el('time', null, clock(t)));
    const k = keyDot(row); if (k) p.appendChild(k);
    p.appendChild(document.createTextNode(logText(id, pos)));
    return p;
  }
  function renderLogPane(p) {
    p.tA.classList.toggle('on', logTab === 'tonight');
    p.tB.classList.toggle('on', logTab !== 'tonight');
    setText(p.tA, TX.ui.log + (N ? ' ' + fmt(TX.ui.night, { n: N.n }) : ''));
    const L = p.list; L.textContent = '';
    if (logTab === 'tonight') {
      const lines = N ? N.log.filter((l) => TX.log[l.id]) : [];
      if (!lines.length) L.appendChild(el('div', 'empty', TX.ui.logEmpty));
      for (const l of lines) L.appendChild(logLine(l.t, l.id, 'tonight', l.pos));
      L.scrollTop = L.scrollHeight;
    } else {
      const all = allRecords();
      const total = C.ids.filter((r) => r.log && TX.log[r.id]).length;
      L.appendChild(el('div', 'cnt', all.length + ' / ' + total));
      if (!all.length) L.appendChild(el('div', 'empty', TX.ui.logEmpty));
      for (const r of all) L.appendChild(logLine(r.t, r.id, N && N.disc[r.id] ? 'tonight' : '', r.pos));
    }
  }
  function renderLogs() { for (const p of logPanes) renderLogPane(p); logDirty = false; }

  // ---------------------------------------------------------------- layout
  // wide：横長で、地図を左に置く。short：低い画面（縦長なら詰める。横長なら日誌をボタンで開き、地図の幅を高さから決める）
  function layout() {
    const W = window.innerWidth, H = window.innerHeight;
    const wide = W >= 900 || (W > H * 1.15 && W >= 560);
    const short = H < SHORT_H;
    document.body.classList.toggle('wide', wide);
    document.body.classList.toggle('short', short);
    const g = $('game');
    let mw = 0;
    if (wide && short) {
      const mb = $('mapbox').getBoundingClientRect();
      let cw = 0;
      try {
        const cs = window.getComputedStyle(g);
        cw = g.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - (parseFloat(cs.columnGap) || 0);
      } catch (e) { cw = 0; }
      if (cw > 0 && mb.height > 0) mw = Math.max(48, Math.floor(Math.min(mb.height * 0.8, cw - SIDE_MIN)));
    }
    if ((D.k.mapw || 0) !== mw) {
      D.k.mapw = mw;
      if (mw) g.style.setProperty('--mapw', mw + 'px'); else g.style.removeProperty('--mapw');
    }
    let r = $('mapbox').getBoundingClientRect();
    // 縦長の画面で地図が幅で決まるときは、余った高さを無線窓に回す（地図の大きさは変わらない）
    const extra = D.k.radioExtra || 0;
    let want = 0;
    if (!wide) {
      const avail = r.height + extra;
      if (avail * 0.8 > r.width) want = clamp(Math.floor(avail - r.width * 1.25 - 6), 0, 72);
    }
    if (want !== extra) {
      D.k.radioExtra = want;
      const rd = $('radio');
      rd.style.height = want ? (rd.offsetHeight - extra + want) + 'px' : '';
      r = $('mapbox').getBoundingClientRect();
    }
    renderRadio();      // 無線窓の高さが変わったら、入る分だけ前の行を見せ直す
    let w = Math.floor(Math.min(r.width, r.height * 0.8));
    let h = Math.floor(w * 1.25);
    if (w < 48 || h < 60) { w = 48; h = 60; }
    const d = dpr();
    if (D.k.mw !== w || D.k.mh !== h || D.k.dpr !== d) {
      D.k.mw = w; D.k.mh = h; D.k.dpr = d;
      D.frame.style.width = w + 'px'; D.frame.style.height = h + 'px';
      RENDER.layout(w, h, d);
    }
    // 無線窓の顔：裏の解像度は CSS 幅×dpr（顔の一画素の幅は RENDER.portrait が整数に揃え、余りは管の縁）
    const fr = D.rface.getBoundingClientRect();
    const px = Math.max(32, Math.round((fr.width || 58) * d));
    if (D.rface.width !== px) { D.rface.width = px; D.rface.height = px; }
    // 地図の走査線：地図の一画素の行の高さで縞。細かすぎれば 2 行を 1 段に（4.9）
    const rowH = h / 300;
    const sl = rowH < 2 ? rowH * 2 : rowH;
    const slv = sl.toFixed(3) + 'px';
    if (D.k.sl !== slv) { D.k.sl = slv; D.frame.style.setProperty('--sl', slv); }
    placeMarks();
    fitCards();
  }
  // 時刻の帯の印の押せる所（中心から左右 MK_W/2）。隣と重なる印は一つの「まとめ印」にする（3.6）：
  // まとめ印は中の印の時刻の平均の所に置き、押せる所は MK_W。まとめた後でまた重なれば、さらにまとめる。
  // 帯の端では押せる所を内側へずらす（字は端から MK_EDGE 以上内側）
  function markGroups(tw) {
    const xOf = (ks) => clamp(ks.reduce((a, k) => a + MARK_T[k], 0) / ks.length / C.END, 0, 1) * tw;
    const gs = KEYS.filter((k) => D.marks[k].vis && isNum(MARK_T[k])).sort((a, b) => MARK_T[a] - MARK_T[b] || KEYS.indexOf(a) - KEYS.indexOf(b))
      .map((k) => ({ ks: [k], x: xOf([k]) }));
    for (let i = 1; i < gs.length;) {
      if (gs[i].x - gs[i - 1].x < MK_W) {
        const ks = gs[i - 1].ks.concat(gs[i].ks);
        gs.splice(i - 1, 2, { ks, x: xOf(ks) });
        i = Math.max(1, i - 1);
      } else i++;
    }
    return gs;
  }
  function groupEl(i) {
    while (D.groups.length <= i) {
      const b = el('button', 'mk grp');
      const gl = el('span', 'gl'); gl.appendChild(el('b')); b.appendChild(gl);
      b._dots = el('span', 'dots'); b.appendChild(b._dots);
      b.hidden = true;
      b.addEventListener('click', (ev) => { ev.stopPropagation(); if (b._ks) openGroupSheet(b._ks.slice()); });
      $('tltrack').appendChild(b);
      D.groups.push(b);
    }
    return D.groups[i];
  }
  function placeMarks() {
    if (!D.marks) return;
    const tr = $('tltrack');
    const tw = tr ? tr.getBoundingClientRect().width - 2 : 0;
    if (!(tw > 0)) return;
    const gs = markGroups(tw);
    D.groupOf = {};
    let gi = 0;
    for (const g of gs) {
      const left = clamp(g.x - MK_W / 2, MK_EDGE - MK_W / 2, tw - MK_W / 2 - MK_EDGE);
      let e;
      if (g.ks.length === 1) e = D.marks[g.ks[0]].el;
      else {
        e = groupEl(gi++);
        e._ks = g.ks;
        for (const k of g.ks) { D.groupOf[k] = e; D.marks[k].el.hidden = true; }
        e.style.setProperty('--rc', ROLE[KEY_ROLE[g.ks[0]]]);
        e.title = g.ks.map((k) => clock(MARK_T[k]) + ' ' + (TX.positions[MARK_POS[k]] || '')).join(' / ');
        e._dots.textContent = '';
        for (let j = 0; j < Math.min(4, g.ks.length); j++) e._dots.appendChild(el('i'));
        e._cls = null;
        e.hidden = false;
      }
      if (g.ks.length === 1) e.hidden = false;
      e.style.left = left.toFixed(1) + 'px';
      e.style.width = MK_W + 'px';
      e.style.setProperty('--x', (g.x - left).toFixed(1) + 'px');
    }
    for (let i = gi; i < D.groups.length; i++) { D.groups[i].hidden = true; D.groups[i]._ks = null; }
  }
  // まとめ印の色と明滅：色は中で一番早い印の役の色。印の状態は中がみな同じときだけ。予感は中のどれか一つでも
  function paintGroups(wk) {
    for (const e of D.groups || []) {
      if (e.hidden || !e._ks) continue;
      const st = e._ks.map(markStatus);
      const same = st.every((s) => s === st[0]) ? st[0] : '';
      const cls = 'mk grp' + (same ? ' ' + same : '') + (wk && e._ks.indexOf(wk) >= 0 ? ' warn' : '');
      if (e._cls !== cls) {
        const keep = ['pop', 'new'].filter((c) => e.classList.contains(c));
        e._cls = cls; e.className = cls + (keep.length ? ' ' + keep.join(' ') : '');
      }
    }
  }
  // 兵の札の状態の行：一行に入らなければ役の行を隠して二行にする
  function fitCard(c) {
    if (!c || !c.st) return;
    c.el.classList.remove('st2');
    if (c.st.scrollWidth > c.st.clientWidth + 1) c.el.classList.add('st2');
  }
  function fitCards() { if (D.cards) for (const id in D.cards) fitCard(D.cards[id]); }

  // ---------------------------------------------------------------- days（日ごとの content と文）
  // 日の文：cues・log・knew・logPos・positions・posShort・enemies は二日目から足し合わせ、
  // idle・fixedTalk・tutorial・trueEnd はその日のものがあればそれ。barks は兵ごとに重ねる
  const TX_ADD = ['cues', 'log', 'knew', 'logPos', 'positions', 'posShort', 'enemies'];
  function textFor(d) {
    const DT = TEXT.days || {};
    if (d <= 1) return TEXT;
    const T = Object.assign({}, TEXT);
    for (const k of TX_ADD) T[k] = Object.assign({}, TEXT[k]);

    const X = DT[d] || {};
    for (const k of ['idle', 'fixedTalk', 'tutorial']) if (X[k]) T[k] = X[k];
    if (X.barks) for (const s in X.barks) T.barks[s] = Object.assign(T.barks[s] || {}, X.barks[s]);

  }
  // 印の時刻：events[k].mark。無ければ v1 の決まり（delta は見える時刻、ほかは出来事の時刻）
  function markOf(E, k) {
    const e = E && E[k];

  // その日の content・文・id 表・印・指紋に切りかえる。画面ができていれば作り直す
  function setDay(d) {

    KEYS = (C.keys || KEYS1).slice();
    KEY_ROLE = C.keyRole || ROLE1;

    (TX.idle || []).concat(TX.fixedTalk || []).forEach((L, i) => {

    FP = fpOf(d);
    if (!save.days[d]) save.days[d] = freshDayRec(d);
    R = save.days[d];
    if (D.built) {

  }
  // 印の持ち場の名（持ち場の無い出来事は空。三方から来る iota など）
  function markPlace(k) { return (MARK_POS[k] && TX.positions[MARK_POS[k]]) || ''; }
  function lastClearedDay() { let c = 0; for (let d = 1; d <= DAY_MAX; d++) if (save.days[d] && save.days[d].cleared) c = d; return c; }
  function clearedNoteOf(d) { const X = TEXT.days && TEXT.days[d]; return (d > 1 && X && X.clearedNote) || TX.ui.clearedNote; }
  // 今の日を五人で越えていて、次の日が開いていれば、その日

  // 「n夜目」。開いている日が二つ以上なら「二日目　n夜目」
  function nightLabel(n) { return openCount() > 1 ? fmt(TX.ui.dayNight, { day: TX.ui.dayName[day], n }) : fmt(TX.ui.night, { n }); }
  // 日の間の無線と昼の札（TEXT.days[nd].between）。t0 は最初の行が見えるまでの秒。続きの時刻を返す

  // 題の「{d}日目の夜へ」：日の間の無線と札から出し、主ボタンで次の日の 22:00 へ

  function lossMarks(n) { return n <= 5 ? '✕'.repeat(n) : '✕'.repeat(5) + n; }

  // ---------------------------------------------------------------- night lifecycle
  function indexInputs(list) {
    const m = new Map();

  }
  // 「なぞる」が手を放す tick：前の夜に失った出来事の予感（印の 5 分前）か、最初に誰かが倒れた 1 分前の、早いほう
  function traceStopOf(prev) {
    const ds = (prev.deaths || []).map((d) => d.t).filter((t) => typeof t === 'number');
    const end = ds.length ? Math.min.apply(null, ds) : (typeof prev.end === 'number' ? prev.end : C.END);
    let stop = end - 10;
    const out = prev.outcomes || {};
    for (const k of KEYS) if (out[k] === 'dead' && isNum(MARK_T[k])) stop = Math.min(stop, MARK_T[k] - 50);

  // 「この夜を閉じて」で終えた夜の影は、閉じた tick より先へは進めない
  function ghostEnd() {

  }

    if (G || !N || !prevNight || !ghostBy || !S) return;

  }
  function startNight(n) {

    if (canOrder('recall') && !hints.seen.recall && prevNight && prevNight.night === 1 && (prevNight.log || []).some((l) => /_gone$/.test(l.id) && idRow[l.id] && idRow[l.id].key === callKey()) &&
        !(R.lastInputs || []).some((x) => x && x.input && x.input.type === 'move')) hints.want.recall = { id: null, force: true };

  function commitNight(result) {

    for (const d of N.deaths) {
      R.ghosts.push({ night: n, id: d.id, x: r1(d.x), y: r1(d.y), t: d.t, cause: d.cause });
      save.losses[d.id] = (save.losses[d.id] || 0) + 1;
    }
    R.nights.push({
      night: n, deaths: N.deaths.map((d) => ({ id: d.id, t: d.t, cause: d.cause })), result,
      end: S.tick, outcomes: Object.assign({}, S.outcomes),

  function closeNight() {

  }

  // ---- 二夜目のはじまり：前の夜の出来事と倒れた記録だけが一行ずつ書き足され、帯に印が置かれ、地図に前夜の時刻が灯る。
  //      書き終えたら待つ（叩く・Enter・Space で閉じる。いつ閉じてもよい。夜は 22:00 で止まっている）
  function introLine(l) {

  }

  function introTick(now) {
    const I = intro;

  // ---- 夜の終わり
  function onOver(e) {
    phase = 'over';
    ff = false; tracing = false; beatUntil = 0;
    setFlareMode(false); deselect(); drag = null;
    if (tutorialOpen) { tutorialOpen = false; hideMapsheet(); }
    const allAlive = S.soldiers.every((s) => s.alive);

    const tok = ++endSeq;

      persist();

      return;
    }
    setTimeout(() => {
      if (endSeq !== tok || phase !== 'over') return;
      if (e.result === 'fallen') showFallen(); else showDawn();
    }, e.result === 'fallen' ? 1800 : 2600);

  function lostNames() { return joinNames(N.deaths.map((d) => d.id)); }

  function speakerLabel(who) {
    if (isSoldierId(who)) return nameOf(who);
    if (who === 'me' || who === 'fake') return TX.ui.me;
    return '';
  }
  // 無線窓の顔と電波の強さ（4.1・4.2）。'fake' は顔を作らず、受話器（'me'）に混線 0.6 を重ねる（3.6）
  const SIGNAL = { hq: 1.0, tower: 0.95, east: 0.9, bridge: 0.88, west: 0.85, north: 0.8 };
  function faceOf(who) {
    if (who === 'fake') return { face: 'me', signal: 0.6 };
    if (who === 'me') return { face: 'me', signal: 1 };
    if (who === 'static') return { face: 'static', signal: 1 };
    if (isSoldierId(who)) {
      const s = sol(who);

  // 板や題の静かな顔（ブラウン管の効果なし。ランタンの光）
  function stillFace(cv, who) {

  }
  function talkBlock(lines, delay0) {
    const box = el('div', 'talk');

  // ---- 五人とも 05:00：幕の無い地図を 10 秒、それから夜の帯の束
  function startEnding(tok) {

    const fin = isFinalDay();

  }
  // 一日分の夜の帯の段。夜が多いときは、古い夜をまとめて一段（「〜n夜目」。一夜だけなら「n夜目」）にし、近い STACK_MAX 夜を一段ずつ並べる。
  // upTo があれば、その夜（その日を五人で越えた夜）までを積み、その夜を最後の段にする。無ければ一番あとの夜が最後の段
  function stackRows(rec, upTo) {
    const all = upTo ? rec.nights.filter((nt) => nt.night <= upTo) : rec.nights;
    const early = all.length > STACK_MAX ? all.slice(0, all.length - STACK_MAX) : [];
    const eLast = early.length ? early[early.length - 1].night : 0;
    const rows = early.length ? [{ label: (early.length > 1 ? '〜' : '') + eLast, deaths: [].concat.apply([], early.map((nt) => nt.deaths || [])), many: true }] : [];
    for (const nt of all.slice(early.length)) rows.push({ label: nt.night, night: nt.night, deaths: nt.deaths || [] });
    rows.forEach((rw, i) => { rw.last = upTo ? rw.night === upTo : i === rows.length - 1; });
    return rows;
  }
  // 夜の帯の束。五人で朝を迎えた夜の終わりに出す（閉じられない）。opt.review：題の一行から開いた（Esc と外側で閉じられる）。
  // 開いている次の日があれば、その日の束・朝の会話のあとに日の間（無線と昼の札）と「{d}日目の夜へ」。
  // 最後の日の終わりは、越えた日ぜんぶの束（日ごとに見出し）と credits。開いている日が一日目だけの間は v1 と同じ一日分の束
  function showStack(opt) {
    opt = opt || {};
    const review = !!opt.review;
    const St = TX.screens.stack, TE = TX.screens.trueEnd;
    const nd = review ? 0 : nextDayOf();
    const top = review ? opt.day : day;
    const groups = [];
    for (let d = nd ? day : 1; d <= top; d++) {
      const rec = save.days[d];
      if (!rec || !rec.nights.length) continue;
      groups.push({ d, rows: stackRows(rec, (review || d < day) ? rec.cleared : null) });
    }
    const heads = openCount() > 1;
    // 最後の朝（三日目を越えた朝）：見出しと一行は screens.final、朝の会話を束より先に（地図 → 会話 → 三日分の束 → credits）
    const fin = !review && !nd && isFinalDay() && TX.screens.final;
    let panel = null;
    openSheet(review ? 'stack' : 'end', (p) => {
      panel = p;

      if (fin) {

      p.appendChild(el('p', 'sub fade-in', St.title));
      const stack = el('div', 'stack');
      const nRows = groups.reduce((a, g) => a + g.rows.length + (heads ? 1 : 0), 0);
      if (nRows > STACK_DENSE) stack.classList.add('dense');   // 段が多ければ細い帯
      const step = Math.min(0.25, 4 / Math.max(1, nRows));
      let i = 0;
      for (const g of groups) {
        if (heads) {
          const h = el('div', 'dhead', TX.ui.dayName[g.d]);
          h.style.animationDelay = (tk + 0.5 + i * step).toFixed(2) + 's';
          stack.appendChild(h); i++;
        }
        for (const rw of g.rows) {
          const band = el('div', 'band' + (rw.last ? ' last' : '') + (rw.many ? ' many' : ''));
          band.style.animationDelay = (tk + 0.5 + i * step).toFixed(2) + 's';
          band.appendChild(el('span', null, fmt(St.nightLabel, { n: rw.label })));
          const bar = el('div');
          for (const d of rw.deaths) {        // 五人で朝を迎えた夜（最後の段）は倒れた印が無い
            const m = el('i'); m.style.left = pct(d.t); m.style.setProperty('--rc', ROLE[d.id] || '#ccc');
            m.title = clock(d.t) + ' ' + nameOf(d.id);
            bar.appendChild(m);
          }
          band.appendChild(bar);
          stack.appendChild(band);
          i++;
        }
      }
      p.appendChild(stack);
      const t0 = tk + 0.8 + nRows * step;
      if (!fin) {
        const line = el('p', 'line fade-in', TE.line); line.style.animationDelay = t0.toFixed(2) + 's';
        p.appendChild(line);
        p.appendChild(talkBlock(TE.talk, t0 + 0.8));
      }
      let at = t0 + 2 + TE.talk.length * 0.7;
      let b;
      if (nd) {
        // 日の間：無線と昼の札、主ボタンで次の日の 22:00 へ
        at = betweenParts(nd, p, t0 + 1.2 + TE.talk.length * 0.7) + 0.4;
        b = el('button', 'pbtn pri fade-in', fmt(TX.title.next, { d: TX.ui.dayNum[nd] }));
      } else {
        const cr = el('div', 'credits fade-in'); cr.style.animationDelay = (t0 + 1.2 + TE.talk.length * 0.7).toFixed(2) + 's';
        for (const c of TX.screens.credits) cr.appendChild(el('div', null, c));
        p.appendChild(cr);
        b = el('button', 'pbtn fade-in', TX.ui.toTitle);
      }
      b.style.animationDelay = at.toFixed(2) + 's';
      b.style.marginTop = '18px';
      // 見えるまでは押せない（Enter や Space 一つで束・会話・credits を飛ばさない）。見えたら押せるようにし、focus を板から移す
      b.disabled = true;
      const ready = () => {
        if (!b.disabled || !$('sheet').contains(b)) return;
        b.disabled = false;
        const a = document.activeElement;
        if (!a || a === panel || a === document.body) { try { b.focus({ preventScroll: true }); } catch (e) { /* なくてよい */ } }
      };
      b.addEventListener('animationend', ready);

      b.addEventListener('click', review ? closeSheet : nd ? () => startDay(nd) : showTitle);
      p.appendChild(b);
      if (nd) {

        const sm = el('div', 'small fade-in'); sm.style.animationDelay = at.toFixed(2) + 's';

  // ---------------------------------------------------------------- sheets
  // 重ね板が開いている間は、後ろの画面（遊ぶ画面と題）に手もキーも届かないようにする。題が出ている間は遊ぶ画面も

  // 二度押して決めるボタン：一度目で文字が確かめの文に替わり、TWO_TAP_MS の間にもう一度押せば fn。
  // 一度目のすぐ後（TWO_TAP_MIN 未満）の押しは二度押しとして数えない
  function twoTap(b, label, confirmLabel, fn) {
    let armedAt = 0, timer = 0;
    const disarm = () => { armedAt = 0; setText(b, label()); b.classList.remove('arm'); };
    b.addEventListener('click', () => {
      const now = tnow();
      if (armedAt && now - armedAt < TWO_TAP_MS) {
        if (now - armedAt < TWO_TAP_MIN) return;
        clearTimeout(timer); disarm(); fn();
        return;
      }
      armedAt = now; setText(b, confirmLabel()); b.classList.add('arm');
      AUDIO.ui('select');
      clearTimeout(timer); timer = setTimeout(disarm, TWO_TAP_MS);
    });
  }

  // ---------------------------------------------------------------- commands
  function playerActed() { if (tracing) stopTrace(); }
  function setPaused(p) {
    if (phase !== 'play') return;
    paused = !!p;
    if (paused) { ff = false; if (tracing) stopTrace(); }
  }
  function togglePause() {
    if (phase === 'intro') { skipIntro(); return; }
    if (tutorialOpen) { closeTutorial(); return; }
    if (phase !== 'play') return;
    if (paused) resume(); else setPaused(true);
  }
  // 自動で止まった直後（AUTO_GUARD_MS）か。この間は再開・▶▶・なぞるの押しを捨てる（止まる瞬間に押した手で走り出さない）
  function autoGuarded() { return paused && tnow() - autoPausedAt < AUTO_GUARD_MS; }
  // 再開は一時停止ボタン・Space・Enter・地図の「一時停止中」の札だけ。自動で止まった直後の押しは捨てる
  function resume() {
    if (phase !== 'play' || !paused) return;
    if (autoGuarded()) return;
    setPaused(false);
  }
  function speedStep(d, cycle) {
    if (phase !== 'play') return;
    ff = false;
    if (tracing) stopTrace();
    let i = SPEEDS.indexOf(userSpeed); if (i < 0) i = 0;
    i = cycle ? (i + 1) % SPEEDS.length : clamp(i + d, 0, SPEEDS.length - 1);
    userSpeed = SPEEDS[i];
  }
  function toggleFF() {
    if (phase !== 'play' || autoGuarded()) return;
    if (tutorialOpen) closeTutorial();
    if (ff) { stopFF(); return; }
    if (tracing) stopTrace();
    ff = true; paused = false;
    const nk = nextMarkKey(S.tick + 100);
    ffStopT = nk ? MARK_T[nk] - 100 : Infinity;
    ffHp = {};
    for (const s of S.soldiers) ffHp[s.id] = s.alive && s.hp / s.maxHp >= 0.5;
  }
  function stopFF() { ff = false; userSpeed = 1; }
  function canTrace() { return phase === 'play' && !!traceBy && !!S && S.tick < traceStopT; }
  function toggleTrace() {
    if (autoGuarded()) return;
    if (tracing) { stopTrace(); return; }
    if (!canTrace()) return;
    if (tutorialOpen) closeTutorial();
    ff = false; tracing = true; paused = false;
  }
  function stopTrace() { tracing = false; }
  function skipIntro() {
    if (!intro) return;
    finishIntro();
  }
  function onCard(id, ev) {
    if (phase !== 'play') return;
    // 止まっている間に出した移動は札に「待ち」と出る。その行を叩けば取り消す
    const c = D.cards[id];
    const qc = cardQueued(id);
    if (ev && ev.target && c && c.st.contains(ev.target) && qc) {
      dropQueued(qc); AUDIO.ui(qc.type === 'move' ? 'move' : 'unqueue');
      if (selected === id) deselect();
      return;
    }
    // 手当て待ちの札は「衛生兵を呼ぶ」（選択にはならず、段も変わらない。もう一度叩けば取り消し）
    if (canOrder('treat') && isLying(sol(id))) { orderTreat(id); return; }
    if (selected === id) { deselect(); return; }
    select(id, lastPointer !== 'mouse');
  }
  function isLying(s) { return !!(s && s.alive && s.state === 'wounded'); }
  function select(id, touch) {
    const s = sol(id);
    if (!s) return;
    if (!s.alive) { refuseCard(id, 'dead'); return; }
    if (mode === 'flare') setFlareMode(false);
    selected = id; selTouch = !!touch; selIdle = 0;
    AUDIO.ui('select', id);
    buzz('select');
  }
  function deselect() { selected = null; selTouch = false; }
  function onPosBtn(k) {
    if (phase !== 'play' || !selected) return;
    orderMove(selected, k);
  }
  function incoming(to, except) {
    let n = 0;
    for (const o of S.soldiers) if (o.id !== except && o.alive && o.dest === to) n++;
    for (const q of queued) if (q.type === 'move' && q.to === to && q.soldier !== except) n++;
    return n;
  }
  function queuedMove(id) { for (const q of queued) if (q.type === 'move' && q.soldier === id) return q; return null; }
  function dropQueuedMove(id) { queued = queued.filter((q) => !(q.type === 'move' && q.soldier === id)); }
  function queuedOf(type, pred) { for (const q of queued) if (q.type === type && (!pred || pred(q))) return q; return null; }

  function queuedProne(id) { return queuedOf('prone', (q) => q.soldier === id); }
  function queuedLamp(pos) { return pos ? queuedOf('lamp', (q) => q.pos === pos) : null; }
  function queuedTreat(id) { return queuedOf('treat', (q) => q.soldier === id); }
  function queuedCarry(id) { return queuedOf('carry', (q) => q.soldier === id); }
  // 札の状態の行に出す積まれた命令（移動 → 伏せ → 担ぐ → 呼んだ衛生兵 → その持ち場の灯り）。その行を叩くと取り消す
  function cardQueued(id) {
    if (phase !== 'play') return null;
    const s = sol(id);
    if (!s || !s.alive) return null;

  }
  function isSamePost(s, to) { return (s.state === 'idle' && s.pos === to) || (s.state === 'moving' && s.dest === to); }
  // 無くなった持ち場（三日目に踏まれた）と、今の定員（04:30 からの橋）
  function posGone(k) { return !!(S && S.posGone && S.posGone[k]); }
  function capNow(k) { return (S && typeof SIM.capOf === 'function') ? SIM.capOf(S, k) : C.positions[k].cap; }
  function precheckMove(id, to) {
    if (posGone(to)) return 'gone';

  function orderMove(id, to) {
    // まだ効いていない（止まっている間に出した）移動があれば、新しい命令で置きかえる。今いる所へなら取り消し
    const old = queuedMove(id);

  // ---- 新しい命令（伏せろ・灯り・光の太さ）。どれも queued に積み、次の tick で効く。

  function precheckProne(s) {
    if (!s || !s.alive) return 'dead';

    if (s.state !== 'idle' || !s.pos) return 'busy';
    return null;
  }
  function orderProne(id) {
    if (phase !== 'play' || !canOrder('prone')) return false;

    const old = queuedProne(id);
    if (old) { dropQueued(old); AUDIO.ui('unqueue'); deselect(); return true; }
    const why = precheckProne(s);

    playerActed();
    dropQueuedMove(id);
    queued.push({ type: 'prone', soldier: id, on: !s.down });
    AUDIO.ui('order');
    buzz('select');
    hintDone('prone');
    deselect();
    return true;
  }
  // 灯りを替えられるのは持ち場に立っている兵（手当て待ち・手当て中は暗いボタン）
  function lampPosOf(s) { return s && s.alive && s.pos && s.state !== 'wounded' && s.state !== 'treating' ? s.pos : null; }
  function precheckLamp(s) {
    if (!s || !s.alive) return 'dead';
    const pos = lampPosOf(s);
    if (!pos) return 'busy';
    if (S.posGone && S.posGone[pos]) return 'gone';
    if (pos === 'hq') return 'hq';
    return null;
  }
  function orderLamp(id) {
    if (phase !== 'play' || !canOrder('lamp')) return false;
    const s = sol(id);
    const old = queuedLamp(lampPosOf(s));
    if (old) { dropQueued(old); AUDIO.ui('unqueue'); deselect(); return true; }
    const why = precheckLamp(s);
    if (why) { refuseCard(id, why); return false; }
    playerActed();
    const pos = s.pos;
    queued.push({ type: 'lamp', pos, off: !S.positions[pos].dark });
    AUDIO.ui('order');
    buzz('select');
    hintDone('lamp');
    deselect();
    return true;
  }
  function switching() { const sr = S && S.search; return !!(sr && sr.switchUntil !== null && sr.switchUntil !== undefined && S.tick < sr.switchUntil); }
  function orderBeam() {
    if (phase !== 'play' || !canOrder('beam') || !C.search.narrow) return false;
    const old = queuedOf('beam');
    if (old) { dropQueued(old); AUDIO.ui('unqueue'); return true; }
    if (S.posGone && S.posGone.tower) { refuseBtn(D.bBeam, 'gone'); return false; }
    if (switching()) { refuseBtn(D.bBeam, null); return false; }
    playerActed();
    queued.push({ type: 'beam', narrow: S.search.mode !== 'narrow' });
    AUDIO.ui('order');
    buzz('select');
    hintDone('beam');
    return true;
  }
  // ---- 二日目・三日目の命令（衛生兵を呼ぶ・担いで本部へ・戻れ）。どれも queued に積み、もう一度叩けば外す
  function medic() { if (!S) return null; for (const s of S.soldiers) if (C.soldiers[s.id] && C.soldiers[s.id].healEvery) return s; return null; }
  // 手当て待ちの兵の今いる所（担がれていれば本部壕へ向かう）
  function lyingAt(s) { return s ? (s.pos || (s.carriedBy ? 'hq' : null)) : null; }
  // 衛生兵を呼ぶ：sim の断る順のうち、札から分かるものを先に見る。'same' は良い返事
  function precheckTreat(s) {
    if (!s || !s.alive) return 'dead';
    if (s.state !== 'wounded') return 'fine';
    const m = medic();
    if (!m || !m.alive || m.state === 'wounded') return 'nomedic';
    if (BUSY[m.state]) return 'busy';
    if (m.state === 'idle' && m.pos === lyingAt(s)) return 'same';
    return null;
  }
  function orderTreat(id) {
    if (phase !== 'play' || !canOrder('treat')) return false;
    const old = queuedTreat(id);
    if (old) { dropQueued(old); AUDIO.ui('unqueue'); return true; }
    const why = precheckTreat(sol(id));
    if (why === 'same') { goodSame(); hintDone('treat'); return false; }
    if (why) { refuseTreat(id, why); return false; }
    playerActed();
    queued.push({ type: 'treat', soldier: id });
    AUDIO.ui('order');
    buzz('select');
    hintDone('treat');
    return true;
  }
  // 衛生兵がもうその持ち場にいる：拒みの揺れも音も出さず、衛生兵の札を光らせて一言
  function goodSame() {
    const m = medic();
    if (!m) return;
    const c = D.cards[m.id];
    if (c) restartAnim(c.el, 'good');
    orderBark(m.id, 'treatSame');
  }
  function refuseTreat(id, why) {
    const m = medic();
    if (why === 'busy' && m) refuseCard(m.id, why); else refuseCard(id, why);
  }
  function precheckCarry(s) {
    if (!s || !s.alive) return 'dead';
    if (S.posGone && S.posGone.hq) return 'gone';
    if (s.pos === 'hq') return 'safe';
    if (!carryTarget(s)) return 'fine';
    if (s.state !== 'idle') return 'busy';
    return null;
  }
  // その兵の持ち場に寝ている、手当てを受けていない兵（id の小さい順）
  function carryTarget(s) {
    if (!s || !s.pos || !S.positions[s.pos]) return null;
    const W = S.positions[s.pos].wounded || [];
    for (const o of S.soldiers) if (o.id !== s.id && o.alive && o.state === 'wounded' && !o.treatBy && W.indexOf(o.id) >= 0) return o;
    return null;
  }
  function orderCarry(id) {
    if (phase !== 'play' || !canOrder('carry')) return false;

    const why = precheckCarry(sol(id));

    playerActed();
    dropQueuedMove(id);
    const qp = queuedProne(id); if (qp) dropQueued(qp);
    queued.push({ type: 'carry', soldier: id });
    AUDIO.ui('order');
    buzz('select');
    hintDone('carry');
    deselect();
    return true;
  }
  function walkersNow() { return S ? S.soldiers.filter((s) => s.alive && WALKERS[s.state]) : []; }
  // 戻れ：自動で止まった直後（350 ms）の押しは捨てる（▶▶・前夜通りと同じ）
  function orderRecall() {
    if (phase !== 'play' || !canOrder('recall') || autoGuarded()) return false;
    const old = queuedOf('recall');
    if (old) { dropQueued(old); AUDIO.ui('unqueue'); return true; }
    if (!walkersNow().length && !queued.some((q) => q.type === 'move')) { refuseBtn(D.bRecall, 'none'); return false; }
    playerActed();
    queued.push({ type: 'recall' });
    AUDIO.ui('order');
    buzz('select');
    hintDone('recall');
    return true;
  }
  // ボタンの拒み：揺れと音（短い語があれば札と同じ形でボタンの下の行に 1.3 秒）
  function refuseBtn(b, reason) {
    AUDIO.ui('refuse');
    buzz('refuse');
    if (!b) return;
    restartAnim(b, 'shake');
    if (reason && TX.ui.refused[reason]) { b._msg = TX.ui.refused[reason]; b._msgUntil = nowMs + 1300; }
  }
  function clampMap(p) { return { x: clamp(p.x, 0, C.W), y: clamp(p.y, 0, C.H) }; }
  function aimAt(p, first) {
    const q = clampMap(p), x = r1(q.x), y = r1(q.y);
    playerActed();
    for (let i = queued.length - 1; i >= 0; i--) if (queued[i].type === 'aim') queued.splice(i, 1);
    queued.push({ type: 'aim', x, y });
    view.aimMark = { x, y, until: nowMs + 650 };
    if (first && !S.search.on) AUDIO.ui('click_dead');
  }
  function flaresAvail() { return S.flaresLeft - queued.filter((q) => q.type === 'flare').length; }
  function setFlareMode(on) { mode = on ? 'flare' : 'normal'; view.flarePreview = null; }
  function flareROf(kind) { return kind === 'wide' && wideFlare() ? C.flare.wide.r : C.flare.r; }
  // 照明弾の種類を選ぶ（構えている間の「長く」「広く」、キー V）。選んだ種類はその夜のあいだ覚える
  function setFlareKind(k, tap) {
    if (k === 'wide' && !wideFlare()) return;
    if (k !== 'long' && k !== 'wide') return;
    if (flareKind !== k || tap) AUDIO.ui('flareKind');
    flareKind = k;
  }
  // ✦（kind なし）は覚えている種類で構える。F は長い、V は広い照明弾を構える。構えている間の ✦ と F は取り消し
  function toggleFlare(kind) {
    if (phase !== 'play') return;

    if (flaresAvail() <= 0) { refuseFlare(); return; }
    if (kind) setFlareKind(kind, false);
    deselect();
    setFlareMode(true);
    AUDIO.ui('flareArm');
  }
  function keyWideFlare() {
    if (phase !== 'play' || !wideFlare()) return;

    toggleFlare('wide');

  function fireFlare(p) {
    setFlareMode(false);

    const inp = { type: 'flare', x: r1(q.x), y: r1(q.y) };

    buzz('flare');
  }
  function refuseFlare() {
    AUDIO.ui('refuse');
    buzz('refuse');

    D.k.flareMsgUntil = nowMs + 1300;
  }
  function refuseCard(id, reason) {
    AUDIO.ui('refuse');
    buzz('refuse');
    const c = D.cards[id];
    if (!c) return;
    setText(c.msg, (TX.ui.refused && TX.ui.refused[reason]) || reason);
    c.msg.classList.add('on');
    restartAnim(c.el, 'shake');
    clearTimeout(c.msgT);
    c.msgT = setTimeout(() => c.msg.classList.remove('on'), 1300);
  }
  // ---- 振動（4.10）：navigator.vibrate があるときだけ。設定「振動」で切れる。扉は 350 ms に一度まで
  const BUZZ = { select: 8, move: [12, 40, 30], refuse: [30, 40, 30], flare: 20, down: 120, door: 15 };
  function canBuzz() { try { return typeof navigator !== 'undefined' && !!navigator && typeof navigator.vibrate === 'function'; } catch (e) { return false; } }
  function buzz(kind) {
    if (!save || save.settings.buzz === false || !canBuzz()) return;

    const q = effQuality();

    try { if (typeof AUDIO.setLight === 'function') AUDIO.setLight(q === 'low'); } catch (e) { /* なくてよい */ }

  }
  // 重さの自動調整：夜の最初の 5 秒（実時間）の一フレームの処理時間（RENDER.frame の直前から AUDIO.update の直後まで）の p95 が 10 ms を超えたら「軽く」

  }

  // ---------------------------------------------------------------- input: map
  function onMapDown(ev) {
    lastPointer = ev.pointerType || 'mouse';
    isTouch = lastPointer !== 'mouse';
    if (ev.target && ev.target.closest && ev.target.closest('button')) return;
    if (typeof ev.button === 'number' && ev.button > 0) return;
    if (phase === 'intro') { skipIntro(); return; }
    if (tutorialOpen) { closeTutorial(); return; }
    if (phase !== 'play' || sheetOpen) return;
    if (ev.cancelable) ev.preventDefault();
    const p = RENDER.toMap(ev.clientX, ev.clientY);
    try { D.frame.setPointerCapture(ev.pointerId); } catch (e) { /* なくてよい */ }
    drag = { id: ev.pointerId, kind: 'none' };
    // 止まっている間も動いている間と同じ：命令は queued に積まれ、次の tick で効く（それまで view.pending で見せる）。
    // 地図を叩いても再開しない

    }

    if (!selected && canOrder('treat')) {
      const w = RENDER.pickWounded(S, p.x, p.y);
      if (w) { orderTreat(w); drag.kind = 'none'; return; }
    }
    const pk = RENDER.pick(S, p.x, p.y, view);
    if (pk && pk.kind === 'soldier') { if (pk.id !== selected) select(pk.id, false); return; }
    if (selected) {
      if (pk && pk.kind === 'pos') orderMove(selected, pk.id); else deselect();
      return;
    }
    aimAt(p, true); drag.kind = 'aim';
  }
  function onMapMove(ev) {
    const p = RENDER.toMap(ev.clientX, ev.clientY);
    if (ev.pointerType === 'mouse') view.hover = p;
    if (mode === 'flare' && (ev.pointerType === 'mouse' || (drag && drag.kind === 'flare'))) view.flarePreview = clampMap(p);

  }
  function onMapUp(ev) {
    if (!drag || drag.id !== ev.pointerId) return;

  function onMapLeave(ev) {
    if (ev.pointerType === 'mouse') {

      if (mode === 'flare' && !drag) view.flarePreview = null;
    }
  }

  // ---------------------------------------------------------------- input: keys
  // Space 止める/再開、1–5 選ぶ（手当て待ちの兵なら衛生兵を呼ぶ）、N T W E H 行き先、F 照明弾、V 広い照明弾、Z 光の太さ、X 伏せる、D 灯り、
  // K 担いで本部へ、C 戻れ、[ ] 速さ、G ▶▶、R なぞる、L 当直日誌、
  // Enter 開いている重ね板・はじまり・説明の主ボタン（遊んでいる間は再開）、Esc 閉じる・取り消す、F3 tick 表示。押しっぱなしの繰り返しは捨てる
  function onKey(ev) {
    const key = ev.key || '';

      if (sheetOpen && sheetOpen !== 'end') { closeSheet(); return; }
      if (sheetOpen) return;
      if (intro) { skipIntro(); return; }                // 二夜目からのはじまりと一夜目の説明も Esc で閉じる
      if (tutorialOpen) { closeTutorial(); return; }

      if (selected) { deselect(); return; }
      return;
    }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = key.toLowerCase();
    if (sheetOpen) {
      if (key === 'Enter') {
        const a = document.activeElement;
        if (a && a.tagName === 'BUTTON' && $('sheet').contains(a)) return;      // 選ばれているボタンはブラウザが押す
        ev.preventDefault();
        const b = sheetPrimary();
        if (b) b.click(); else if (sheetOpen !== 'end') closeSheet();
        return;
      }
      if (k === 'l' && sheetOpen === 'log') { closeSheet(); return; }
      return;
    }
    if (phase === 'title' && (key === 'Enter' || space)) {
      // 題のボタンやつまみが選ばれていれば、それをブラウザが押す。どれも選ばれていなければ主ボタン
      const a = document.activeElement;
      if (a && (a.tagName === 'BUTTON' || a.tagName === 'INPUT') && $('title').contains(a)) return;
      if (D.titlePrimary) { ev.preventDefault(); D.titlePrimary.click(); }
      return;
    }
    if (space) { ev.preventDefault(); togglePause(); return; }
    if (key === 'Enter') {
      if (phase === 'intro') { ev.preventDefault(); skipIntro(); return; }
      if (tutorialOpen) { ev.preventDefault(); closeTutorial(); return; }
      if (phase === 'play' && paused) { ev.preventDefault(); resume(); }
      return;
    }
    if (phase !== 'play') return;
    if (/^[1-5]$/.test(key)) {
      const id = C.soldierOrder[+key - 1];
      if (canOrder('treat') && isLying(sol(id))) { orderTreat(id); return; }      // 手当て待ちの兵の番号は「衛生兵を呼ぶ」
      if (selected === id) deselect(); else select(id, false);
      return;
    }
    if (POS_KEY[k]) { if (selected && C.posOrder.indexOf(POS_KEY[k]) >= 0) orderMove(selected, POS_KEY[k]); return; }
    if (k === 'f') { if (mode === 'flare') setFlareMode(false); else toggleFlare('long'); return; }

    if (k === 'r') { toggleTrace(); return; }
    if (k === 'l') { openLogSheet(); return; }
    if (key === '[') { speedStep(-1, false); return; }
    if (key === ']') { speedStep(1, false); return; }
  }

  // ---------------------------------------------------------------- the step and what the UI does with its events
  function curSpeed(now) {
    if (beatUntil > now) return 0.25;

    return phase === 'play' && !paused && !sheetOpen && !tutorialOpen && !!S && !S.over;
  }

    if (!save.settings.autoPause) return false;

  }
  function doStep() {
    if (!S || S.over) return true;
    const t = S.tick;
    if (tracing && t >= traceStopT) {
      // 前の夜に失った出来事の予感か、最初に誰かが倒れた 1 分前：手を放して、止めて渡す
      stopTrace();

    if (canOrder('recall') && !hints.seen.recall && inputs.some((i) => i && i.type === 'move')) {
      const ref = evs.filter((e) => e.type === 'refused').map((e) => e.input);

    for (const e of evs) frameEvents.push(e);

  }
  function onEvents(evs, t) {

        case 'logDiscover': if (onLog(e)) stop = true; break;
        case 'outcome': N.outcomes[e.key] = e.value; N.outSubj[e.key] = e.subject; break;
        case 'soldierDown': if (onDown(e)) stop = true; break;
        case 'refused': onRefused(e); break;

          buzz('door');

        case 'shot': if (e.from && e.from !== 'me') bark(e.from, 'fire'); break;
        case 'enemyDie': {

          if (s) bark(s.id, 'kill');
          break;
        }
        // 新しい命令が効いた：本人（灯りはその持ち場の先頭、光は塔の操作役）の一言。案内はここで終える
        case 'prone': orderBark(e.soldier, e.on ? 'prone' : 'up'); hintDone('prone'); break;
        case 'lamp': orderBark(posSpeaker(e.pos), e.off ? 'lampOff' : 'lampOn'); hintDone('lamp'); break;
        case 'beamMode': orderBark(S.search.operator || posSpeaker('tower'), e.mode === 'narrow' ? 'beamNarrow' : 'beamWide'); hintDone('beam'); break;
        case 'treatGo': orderBark(e.medic, 'treatGo'); hintDone('treat'); break;
        case 'carry': orderBark(e.soldier, 'carry'); hintDone('carry'); break;

          const cd = D.cards[e.id];

        }

  function pauseFirst(id) {
    const row = idRow[id];

    return requestPause();
  }
  function note(e) {
    if (!recordable(e.id)) return;
    if (!N.disc[e.id]) N.disc[e.id] = { night: N.n, t: e.t, subject: e.subject || null, pos: e.pos || null };
  }
  function onCue(e) {
    const seen = !!R.journal[e.id] || !!N.heard[e.id];
    N.heard[e.id] = true;
    note(e);
    queueCue(e, seen);
    if (e.id === 'wave_w') hintWant('beam', null);
    // 二日目の初めての沢の羽音：橋に立つ兵の札を明滅（灯りの案内をまだ見ていなければ文も）。行き先の「橋」は光らせない
    if (e.id === 'zeta_hum' && !seen) {
      const id = posSpeaker(e.pos || 'bridge');
      if (id && canOrder('lamp')) {
        hints.cur = { key: 'lamp', id, until: tnow() + (save.settings.autoPause ? HINT_MS : HINT_MS_OFF), quiet: !!hints.seen.lamp };
        hints.seen.lamp = true;
        delete hints.want.lamp;
        AUDIO.ui('hint');
      }
    }
    // 灯りを消した持ち場が静かになった：その札の「灯り消」を、点けるまでゆっくり明滅させる
    if (e.id === 'lamp_quiet' && e.pos) N.quiet[e.pos] = true;
    // 水汲みに出た兵（命令を受けない）：選択と積んだ移動・伏せを外す
    if (/_water$/.test(e.id) && e.subject) {
      if (selected === e.subject) deselect();
      dropQueuedMove(e.subject);
      const qw = queuedProne(e.subject); if (qw) dropQueued(qw);
    }
    if (e.id === 'door_low') { N.pausedIds[e.id] = true; return requestPause(); }
    // 手当て待ちになった：自動で止める（b）。▶▶ と前夜通りも手を放す。初めてなら衛生兵の案内
    if (e.id === 'wound_down' || e.id === 'xi_fall') {
      if (ff) stopFF();
      if (tracing) { stopTrace(); userSpeed = 1; }
      if (e.subject) hintWant('treat', e.subject);
      if (selected === e.subject) deselect();
      dropQueuedMove(e.subject);
      const qp = queuedProne(e.subject); if (qp) dropQueued(qp);
      const qc = queuedCarry(e.subject); if (qc) dropQueued(qc);

  }
  function onLog(e) {
    if (!recordable(e.id)) return false;      // *_saved は対応する失敗を前に見ていたときだけ
    note(e);

    logDirty = true;
    return pauseFirst(e.id);
  }
  function onDown(e) {
    const d = { id: e.id, t: e.t, cause: e.cause, x: e.x, y: e.y };
    N.deaths.push(d);
    if (selected === e.id) deselect();
    dropQueuedMove(e.id);
    const qp = queuedProne(e.id); if (qp) dropQueued(qp);
    const qc = queuedCarry(e.id); if (qc) dropQueued(qc);
    const qt = queuedTreat(e.id); if (qt) dropQueued(qt);
    if (e.cause === 'combat') addDeathTick(d);      // 出来事で倒れた分は出来事の印が ✕ になる

  }
  // 戻れが効いた：本部の一行（捨てない）と、戻る兵のうち一人の一言。戻る兵ぜんぶに出てきた持ち場への点線を 1 秒
  function onRecall(e) {
    hintDone('recall');
    const L = TX.orders && TX.orders.recall;
    if (L) say({ who: L.who, text: L.text, prio: 3, tick: e.t });
    const ids = (e.ids || []).filter((id) => alive(id));
    const arr = ids.length && TX.barks[ids[0]] && TX.barks[ids[0]].recall;
    if (arr && arr.length) say({ who: ids[0], text: arr[0], prio: 3, tick: e.t });
    view.recallFlash = { ids: ids.slice(), until: nowMs + 1000 };
  }
  function onRefused(e) {
    const inp = e.input || {};

      return;
    }
    if (inp.type === 'carry') { refuseCard(inp.soldier, e.reason); return; }
    if (inp.type === 'recall') { refuseBtn(D.bRecall, e.reason); return; }
    if (inp.type === 'move') refuseCard(inp.soldier, e.reason);
    else if (inp.type === 'flare') refuseFlare();
